/* Vergleichsbalken: Volumen dieser Übung heute vs. letztes Training derselben Einheit.
   Bei Körpergewichtsübungen (Volumen = 0) werden stattdessen die Wiederholungen verglichen. */
function exRepsNow(ex){
  return ex.sets.filter(s=>s.done).reduce((a,s)=>a+(+s.reps||0),0);
}
function exRepsInLog(log, exName, exId){
  if(!log) return 0;
  const e=log.exercises.find(x=> (exId && x.exId===exId) || x.name===exName);
  if(!e) return 0;
  return e.sets.filter(s=>s.done!==false).reduce((a,s)=>a+(+s.reps||0),0);
}
function volCompare(ex){
  const exId=ex.exId;
  const prevLog=lastSessionLog(SESSION.dayName);
  let now=exVolumeNow(ex);
  let prev=exVolumeInLog(prevLog, ex.name, exId);
  // Fallback: Gibt es kein Training DERSELBEN Einheit (z. B. Einheit umbenannt,
  // freies Training oder anderer Plan), nimm das letzte Vorkommen dieser Übung
  // überhaupt – sonst bliebe der "Zuletzt"-Balken fälschlich leer.
  let prevReps2=null;
  if(!prev){
    const lp=lastPerf(ex.name, exId);
    if(lp){
      const f=exFactor(ex.name, exId);
      prev=lp.ex.sets.filter(s=>s.done!==false).reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
      prevReps2=lp.ex.sets.filter(s=>s.done!==false).reduce((a,s)=>a+(+s.reps||0),0);
    }
  }
  let unit='kg', title='Volumen';
  // Kein Gewicht im Spiel (Körpergewicht) -> Wiederholungen vergleichen
  const nowReps=exRepsNow(ex);
  let prevReps=exRepsInLog(prevLog, ex.name, exId);
  if(!prevReps && prevReps2!=null) prevReps=prevReps2;
  if(now===0 && prev===0 && (nowReps>0 || prevReps>0)){
    now=nowReps; prev=prevReps; unit='Wdh'; title='Wiederholungen';
  }
  if(!prev && !now) return ''; // weder Vorgeschichte noch geleistete Sätze
  const max=Math.max(now, prev, 1);
  const nowPct=Math.round(now/max*100);
  const prevPct=Math.round(prev/max*100);
  const fmt=v=>v.toLocaleString('de-DE')+' '+unit;
  let delta='';
  if(prev>0 && now>0){
    const d=Math.round((now/prev-1)*100);
    const cls = d>0?'up' : (d<0?'down':'same');
    delta=`<span class="vc-delta ${cls}">${d>0?'+':''}${d}%</span>`;
  } else if(!prev){
    delta=`<span class="vc-delta same">neu</span>`;
  }
  return `<div class="vc">
    <div class="vc-title">
      <span>${title}</span>${delta}
    </div>
    <div class="vc-row">
      <span class="vc-lbl">Heute</span>
      <div class="vc-track"><div class="vc-fill now" style="width:${nowPct}%"></div></div>
      <span class="vc-val">${fmt(now)}</span>
    </div>
    <div class="vc-row">
      <span class="vc-lbl">Zuletzt</span>
      <div class="vc-track"><div class="vc-fill prev" style="width:${prevPct}%"></div></div>
      <span class="vc-val prev">${prev?fmt(prev):'–'}</span>
    </div>
  </div>`;
}
/* Vorgeschlagene Wiederholungen – aber nur, wenn der Vorschlag KEIN Gewicht
   trägt. Genau dann stammt er aus dem Körpergewichts-Zweig von suggest(), wo
   der Fortschritt über Wiederholungen läuft. Bei Übungen mit Gewicht ist
   sug.weight immer > 0, dort bleibt der Planwert maßgeblich. */
function sugReps(st){
  const s = st && st.sug;
  if(!s || !s.reps) return null;
  // Kein Gewicht = Körpergewichtsübung. repsVorschlag = Gerät am Anschlag:
  // Dort steht ein Gewicht dabei und die Wiederholungen sind trotzdem gemeint.
  return (!s.weight || s.repsVorschlag) ? s.reps : null;
}
function setRow(ex,ei,st,si){
  const ph=st.sug&&st.sug.weight?st.sug.weight:'';
  const f=exFactor(ex.name);
  /* Die „zuletzt“-Zeile steht auch dann, wenn diese Übung keine Vorgeschichte
     hat – dann mit Strichen. Grund ist nicht Kosmetik, sondern der Bildrahmen:
     Ohne sie wären die Satzblöcke einer neu hinzugefügten Übung rund 16 px
     niedriger als die der übrigen, der reservierte Platz fiele kleiner aus und
     das Bild spränge beim Wischen zwischen den Übungen. Genau dieser Sprung war
     der Fehler aus 1.19.1. Die Striche sagen zudem das Richtige: Es gibt kein
     letztes Mal. Fehlt jede Vorgeschichte in der ganzen Einheit, entfällt die
     Zeile überall – dann sind die Blöcke wieder untereinander gleich. */
  const einheitHatPrev = !!(SESSION && SESSION.exercises &&
    SESSION.exercises.some(e=>(e.sets||[]).some(s=>s.prev)));
  /* Eine Zeile statt drei Spalten, in derselben Schreibweise wie der Rekord:
     „82,5 kg × 9 Wdh“. Sie sitzt im Raster über den Spalten 2 bis 4 und damit
     mittig unter den Eingabefeldern – die Satznummer links und das Häkchen
     rechts zählen nicht mit, sonst stünde die Angabe sichtbar daneben. */
  const prevTxt = st.prev
    ? `zuletzt ${zahlFeld(st.prev.weight)} kg × ${st.prev.reps} Wdh` +
      ((st.prev.rir!=null&&st.prev.rir!=='') ? ` · RIR ${st.prev.rir}` : '')
    : 'zuletzt –';
  const prevRow = (st.prev || einheitHatPrev)
    ? `<div class="set-grid prev-grid${st.prev?'':' prev-leer'}">
      <span class="prev-line">${prevTxt}</span>
    </div>` : '';
  // Satz-Volumen: zuletzt (aus dem letzten Training) und heute (live).
  // f = Hantel-Faktor (2 bei zwei Hanteln), damit das Volumen zum Gesamtgewicht passt.
  const prevVol = st.prev ? (+st.prev.weight||0)*f*(+st.prev.reps||0) : 0;
  const nowVol  = (+st.weight||0)*f*(+st.reps||0);
  const totalKg = f===2 ? (+st.weight||0)*2 : 0;
  const rec = bestSet(ex.exId, ex.name);
  const volRow = `<div class="set-vol" id="vol-${ei}-${si}">${setVolText(prevVol, nowVol, totalKg, st.prev, rec, st, f)}</div>`;
  // RIR (Reps in Reserve): optionale Angabe pro Satz, 0–5
  const rirSel = `<select class="input rir-sel" onchange="setVal(${ei},${si},'rir',this.value)" aria-label="RIR">
      <option value=""${(st.rir===''||st.rir==null)?' selected':''}>–</option>
      ${[0,1,2,3,4,5].map(v=>`<option value="${v}"${String(st.rir)===String(v)?' selected':''}>${v}</option>`).join('')}
    </select>`;
  const wInput = f===2
    ? `<input class="input" inputmode="decimal" placeholder="${ph||'–'}" value="${zahlFeld(st.weight)}" oninput="updateTotal(${ei},${si},this.value)" onchange="setVal(${ei},${si},'weight',this.value)">`
    : `<input class="input" inputmode="decimal" placeholder="${ph||'–'}" value="${zahlFeld(st.weight)}" oninput="updateSetVol(${ei},${si})" onchange="setVal(${ei},${si},'weight',this.value)">`;
  // Trägt ein Vorschlag KEIN Gewicht, aber Wiederholungen, dann sind diese
  // Wiederholungen der Vorschlag (Körpergewichtsübungen). Bei Übungen mit
  // Gewicht ist sug.weight immer > 0, dort greift die Regel also nie.
  const rInput = `<input class="input" inputmode="numeric" placeholder="${sugReps(st)||ex.targetReps||'–'}" value="${zahlFeld(st.reps)}" oninput="updateSetVol(${ei},${si})" onchange="setVal(${ei},${si},'reps',this.value)">`;
  return `<div class="set-block" data-set="${ei}-${si}">
    ${prevRow}
    <div class="set-grid">
      <span class="display" style="font-size:15px;color:var(--text-faint);text-align:center">${si+1}</span>
      <div class="in-unit">${wInput}<span class="unit">kg</span></div>
      <div class="in-unit">${rInput}<span class="unit">Wdh</span></div>
      ${rirSel}
      <button class="chip" style="width:44px;height:44px;justify-content:center;padding:0;${st.done?'background:var(--accent);color:#0a0c10;border-color:var(--accent)':''}" onclick="toggleSet(${ei},${si})">${I.check}</button>
    </div>
    ${volRow}
  </div>`;
}
/* Hat dieser Satz den Rekord geschlagen? Nur abgehakte Sätze zählen – sonst
   feiert die App eine Zahl, die gerade noch geändert wird. */
function schlaegtRekord(st, rec, f){
  if(!rec || !st || !st.done) return false;
  const w=+st.weight||0, r=+st.reps||0;
  if(r<=0) return false;
  return rec.vol>0 ? (w*f*r > rec.vol) : (w===0 && r > rec.reps);
}
// Text für die Satz-Volumen-Zeile: "zuletzt X · heute Y (+Z%) · Rekord 80×12"
function setVolText(prevVol, nowVol, totalKg, prev, rec, st, f){
  const parts=[];
  const geschlagen = schlaegtRekord(st, rec, f||1);
  // Kompaktfassung der "zuletzt"-Zeile für flache Panels: dort wird die eigene
  // prev-Zeile ausgeblendet und ihr Inhalt hier mit angezeigt – spart pro Satz
  // eine komplette Zeile Höhe.
  if(prev){
    const rirTxt=(prev.rir!=null&&prev.rir!=='')?` · RIR ${prev.rir}`:'';
    // Gleiche Schreibweise wie in der „zuletzt“-Zeile und beim Rekord.
    parts.push(`<span class="sv-prevset">zuletzt ${zahlFeld(prev.weight)} kg × ${prev.reps} Wdh${rirTxt}</span>`);
  }
  // Reihenfolge bewusst gruppiert: erst alles zum letzten Training, dann alles
  // zum heutigen Satz – sonst stünde das heutige Gesamtgewicht mitten zwischen
  // den "zuletzt"-Werten.
  /* Das Gesamtgewicht des letzten Satzes („zuletzt 530 kg“) steht hier bewusst
     NICHT mehr: Die Angabe darüber nennt Gewicht und Wiederholungen schon
     einzeln, und der Prozentwert an „heute“ trägt den Vergleich. Die Zeile hat
     dadurch Platz, ohne den Rekord abzuschneiden. */
  if(nowVol>0){
    let d='';
    if(prevVol>0){
      const pct=Math.round((nowVol/prevVol-1)*100);
      const cls=pct>0?'up':(pct<0?'down':'same');
      d=` <span class="sv-delta ${cls}">${pct>0?'+':''}${pct}%</span>`;
    }
    parts.push(`<span class="sv-now">heute ${nowVol.toLocaleString('de-DE')} kg${d}</span>`);
  }
  // Bei 2-Hantel-Übungen: Gesamtgewicht beider Hanteln zum heutigen Satz.
  if(totalKg>0) parts.push(`<span class="sv-total">gesamt ${totalKg} kg</span>`);
  /* Der Rekord steht bewusst hier und nicht in einer eigenen Zeile: Auf dem
     Panel ist die „zuletzt“-Zeile ausgeblendet, auf Handy und PC sind ihre fünf
     Spalten belegt, und ein eigener Streifen kostet auf dem Handy 19,5 px je
     Satz – zu viel für die Zusage, dass immer drei Sätze zu sehen sind.
     Beim Rekordbruch nennt die Zeile den HEUTIGEN Satz: Die alte Marke ist in
     dem Moment nicht mehr die interessante Zahl. */
  if(rec){
    const txt = geschlagen
      ? `Rekord geschlagen · ${zahlFeld(+st.weight||0)} kg × ${+st.reps||0} Wdh`
      : `Rekord ${zahlFeld(rec.weight)} kg × ${rec.reps} Wdh`;
    parts.push(`<span class="sv-rec${geschlagen?' beat':''}">${txt}</span>`);
  }
  /* Innenelement, damit die Teile im Raster gemeinsam über den Spalten 2 bis 4
     sitzen. Ohne es landete jeder Teil in einer eigenen Rasterzelle.
     Leer bleibt wirklich leer – daran hängt die Regel .set-vol:empty. */
  if(!parts.length) return '';
  return `<span class="sv-inner">${parts.join('<span class="sv-sep">·</span>')}</span>`;
}
// Live-Aktualisierung der Satz-Volumen-Zeile beim Eintippen
function updateSetVol(ei,si){
  const ex=SESSION.exercises[ei]; if(!ex) return;
  const st=ex.sets[si]; if(!st) return;
  // aktuelle Feldwerte übernehmen (damit die Anzeige sofort stimmt)
  const block=document.querySelector(`.set-block[data-set="${ei}-${si}"]`);
  if(block){
    const inputs=block.querySelectorAll('.set-grid .in-unit .input');
    if(inputs[0]) st.weight=feldZahl(inputs[0].value);
    if(inputs[1]) st.reps=feldZahl(inputs[1].value);
  }
  const f=exFactor(ex.name);
  const prevVol = st.prev ? (+st.prev.weight||0)*f*(+st.prev.reps||0) : 0;
  const nowVol  = (+st.weight||0)*f*(+st.reps||0);
  const totalKg = f===2 ? (+st.weight||0)*2 : 0;
  const el=document.getElementById(`vol-${ei}-${si}`);
  if(el) el.innerHTML=setVolText(prevVol, nowVol, totalKg, st.prev, bestSet(ex.exId, ex.name), st, f);
}
function updateTotal(ei,si,val){
  SESSION.exercises[ei].sets[si].weight=feldZahl(val); // Wert schon während der Eingabe halten
  updateSetVol(ei,si); // Gesamtgewicht + Satz-Volumen stehen zusammen in der Info-Zeile
  saveSession();
}
// Gewicht, Wiederholungen und RIR sind allesamt Zahlenfelder – deshalb wird hier
// ausnahmslos umgewandelt.
function setVal(ei,si,k,v){ SESSION.exercises[ei].sets[si][k]=feldZahl(v); saveSession(); }
function toggleSet(ei,si){
  const ex=SESSION.exercises[ei];
  const st=ex.sets[si];
  if(!st.done){
    /* „Nichts eingetragen“ heißt leer – nicht null. Vor 1.19.7 stand hier eine
       Zeichenkette im Feld, und "0" ist truthy; seit die Felder echte Zahlen
       liefern, wäre eine bewusst eingetragene 0 sonst vom Vorschlag
       überschrieben worden. */
    const leer=v=>v===''||v==null;
    if(leer(st.weight) && st.sug && st.sug.weight) st.weight=st.sug.weight;
    if(leer(st.reps)) st.reps=sugReps(st)||ex.targetReps||'';
  }
  st.done=!st.done;
  /* Rekord erst beim Abhaken feiern, nicht beim Tippen. Der Vergleich läuft
     gegen den Stand aus DB.logs – die laufende Einheit steht da noch nicht
     drin, die Marke bleibt also die, mit der man reingegangen ist. */
  if(st.done){
    const f=exFactor(ex.name, ex.exId);
    const rec=bestSet(ex.exId, ex.name);
    if(schlaegtRekord(st, rec, f)){
      const neu=(+st.weight||0)*f*(+st.reps||0);
      toast(rec.vol>0 ? `Rekord! ${rec.vol.toLocaleString('de-DE')} → ${neu.toLocaleString('de-DE')} kg`
                      : `Rekord! ${rec.reps} → ${+st.reps||0} Wdh`);
    }
  }
  saveSession();
  renderView();
  // Pausen-Countdown automatisch starten, wenn Satz bestätigt wurde und eine Pause gesetzt ist
  if(st.done && ex.rest>0) startRest(ex.rest, ex.name);
}

/* ================================================================
   PAUSEN-COUNTDOWN (Rest Timer)
   ================================================================ */
/* Der Timer rechnet bewusst mit einem Ziel-Zeitpunkt (endAt) statt mit einem
   heruntergezählten Zähler. Browser drosseln setInterval in Hintergrund-Tabs
   (Chrome ~1×/Minute, iOS Safari friert ganz ein) – ein Zähler würde dann
   stehenbleiben, sobald das Handy in der Tasche ist. Über Date.now() stimmt die
   Restzeit auch nach einer Pause im Hintergrund. */
let TIMER=null; // {endAt,total,base,label,handle,ended,alerted}
function restRemaining(){
  if(!TIMER) return 0;
  return Math.max(0, Math.round((TIMER.endAt-Date.now())/1000));
}
function startRest(seconds, label){
  stopRestTick();
  TIMER={endAt:Date.now()+seconds*1000, total:seconds, base:seconds,
         label:label||'', ended:false, alerted:false};
  renderRestTimer();
  TIMER.handle=setInterval(tickRest,1000);
}
function tickRest(){
  if(!TIMER) return;
  if(restRemaining()<=0){
    TIMER.ended=true;
    stopRestTick();
    // Nur einmal Alarm geben, auch wenn tickRest mehrfach nachläuft
    if(!TIMER.alerted){ TIMER.alerted=true; restAlert(); } // Ton + Vibration
    renderRestTimer();
    setTimeout(()=>{ if(TIMER&&TIMER.ended) closeRest(); },4000);
  } else {
    renderRestTimer();
  }
}
function stopRestTick(){ if(TIMER&&TIMER.handle){ clearInterval(TIMER.handle); TIMER.handle=null; } }
function closeRest(){ stopRestTick(); TIMER=null; renderRestTimer(); }
function adjustRest(delta){
  if(!TIMER) return;
  // Mindestens 1 Sekunde Restzeit, damit „−15“ die Pause nicht sofort beendet
  const next=Math.max(1, restRemaining()+delta);
  TIMER.endAt=Date.now()+next*1000;
  TIMER.total=Math.max(TIMER.total, next);
  if(TIMER.ended){ TIMER.ended=false; TIMER.alerted=false; if(!TIMER.handle){ TIMER.handle=setInterval(tickRest,1000); } }
  renderRestTimer();
}
function restartRest(){
  if(!TIMER) return;
  startRest(TIMER.base, TIMER.label); // zurück zur ursprünglich eingestellten Pausendauer
}
/* Zurück aus dem Hintergrund: sofort neu rechnen, statt bis zum nächsten
   Intervall-Tick eine veraltete Zeit anzuzeigen. */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && TIMER) tickRest();
});
function fmtClock(s){ const m=Math.floor(s/60), ss=s%60; return `${m}:${String(ss).padStart(2,'0')}`; }
/* Reservierte der letzte Durchlauf Platz für den Timer? Nur wenn sich das
   ÄNDERT, muss die Platzaufteilung neu gerechnet werden – nicht bei jedem Tick. */
let TIMER_PLATZ=false;
/* Der Timer nimmt unten Platz weg und verkürzt damit die Übungskarte. Ohne eine
   neue Aufteilung behält der Satzbereich die Höhe, die OHNE ihn gerechnet wurde:
   Er wird zusammengedrückt, zeigt keine ganze Zahl von Sätzen mehr, und das
   Einrasten trifft daneben. Beim Training ist genau das der Normalfall, denn
   toggleSet() startet die Pause NACH dem Neuzeichnen. */
function neuAufteilenWennTimerWechselt(an){
  if(an===TIMER_PLATZ) return;          // nichts geändert, nichts zu rechnen
  TIMER_PLATZ=an;
  if(SESSION && current==='today') fitSessImage();
}
function renderRestTimer(){
  const el=document.getElementById('restTimer'); if(!el) return;
  // Timer nur während einer laufenden Session zeigen
  if(!TIMER || !SESSION){
    el.classList.remove('show'); el.innerHTML='';
    document.body.classList.remove('timer-on');
    neuAufteilenWennTimerWechselt(false);
    return;
  }
  document.body.classList.add('timer-on'); // Platz im Trainings-Layout reservieren
  neuAufteilenWennTimerWechselt(true);
  const remaining=restRemaining();
  const pct = TIMER.total? Math.max(0, Math.min(100, remaining/TIMER.total*100)) : 0;
  const ended=TIMER.ended;
  el.innerHTML=`
    <div class="rt-bar"><div class="rt-fill ${ended?'done':''}" style="width:${ended?100:pct}%"></div></div>
    <div class="rt-body">
      <div class="rt-left">
        <span class="rt-ico ${ended?'done':''}">${I.timer}</span>
        <div>
          <div class="rt-time ${ended?'done':''}">${ended?'Pause vorbei!':fmtClock(remaining)}</div>
          <div class="rt-label">${ended?'':'Pause'}${TIMER.label&&!ended?' · '+esc(TIMER.label):''}</div>
        </div>
      </div>
      <div class="rt-controls">
        ${ended?'' :`<button class="rt-btn" onclick="adjustRest(-15)" title="15 Sek. weniger" aria-label="15 Sekunden weniger">−15</button>
        <button class="rt-btn" onclick="adjustRest(15)" title="15 Sek. mehr" aria-label="15 Sekunden mehr">+15</button>`}
        <button class="rt-btn icon" onclick="restartRest()" title="Neu starten" aria-label="Pause neu starten">${I.restart}</button>
        <button class="rt-btn icon" onclick="closeRest()" title="Abbrechen" aria-label="Pause abbrechen">${I.x}</button>
      </div>
    </div>`;
  el.classList.add('show');
}
// Ton (Web Audio) + Vibration am Pausenende
let _audioCtx=null;
function restAlert(){
  // Vibration
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  // Ton: kurze Beep-Sequenz
  try{
    _audioCtx = _audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const ctx=_audioCtx;
    if(ctx.state==='suspended') ctx.resume();
    const now=ctx.currentTime;
    [0,0.22,0.44].forEach((t,i)=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type='sine';
      osc.frequency.setValueAtTime(i===2?1046:880, now+t); // letzter Ton höher
      gain.gain.setValueAtTime(0.0001, now+t);
      gain.gain.exponentialRampToValueAtTime(0.35, now+t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+t+0.18);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now+t); osc.stop(now+t+0.2);
    });
  }catch(e){}
}
function addSet(ei){
  const ex=SESSION.exercises[ei]; const prev=ex.sets[ex.sets.length-1];
  ex.sets.push({weight:'',reps:'',rir:'0',done:false,sug:prev?prev.sug:null,prev:null});

function cancelSession(){

    SESSION=null; clearStoredSession(); closeRest(); renderView();

function finishSession(){
  const s=SESSION;
  const exercises=s.exercises.map(ex=>({exId:ex.exId||exIdForName(ex.name),name:ex.name,muscle:ex.muscle,targetReps:ex.targetReps,
    sets:ex.sets.filter(x=>x.done).map(x=>({weight:+x.weight||0,reps:+x.reps||0,rir:(x.rir===''||x.rir==null)?null:+x.rir,done:true}))}))
    .filter(ex=>ex.sets.length);
  if(!exercises.length){ toast('Noch keine Sätze abgehakt'); return; }
  DB.logs.push({id:uid(),date:s.date,planId:s.planId||null,planName:s.planName,dayName:s.dayName,exercises});
  save(); SESSION=null; clearStoredSession(); closeRest(); toast('Training gespeichert 💪'); go('history');
}

/* ---- Plan-Übersicht: wie oft wird welcher Muskel je Einheit beansprucht? ---- */
function showPlanOverview(id){
  const p=DB.plans.find(x=>x.id===id); if(!p) return;
  let missing=0;   // Übungen ohne hinterlegte Muskeln
  // Getrennte Zählung je Einheit: wie oft kommt ein Muskel als PRIMÄR bzw. als
  // SEKUNDÄR vor? Vorher wurde beides zusammengeworfen – das war irreführend,
  // weil ein nur unterstützend beteiligter Muskel genauso stark wirkte.
  const perDay=p.days.map(d=>{
    const cP={}, cS={};
    d.exercises.forEach(e=>{
      const m=exMetaById(e.exId)||exMeta(e.name);
      const prim = m ? (Array.isArray(m.pm)&&m.pm.length ? m.pm : (m.g?[m.g]:[])) : [];
      const sec  = (m && Array.isArray(m.sm)) ? m.sm : [];
      if(!prim.length && !sec.length){
        missing++;
        const fallback=(m&&m.g)||e.muscle||'—';
        cP[fallback]=(cP[fallback]||0)+1;        // Rückfall: wenigstens die Region
        return;
      }
      [...new Set(prim)].forEach(x=>{ cP[x]=(cP[x]||0)+1; });
      // Ein Muskel, der bereits primär zählt, wird nicht zusätzlich sekundär gezählt
      [...new Set(sec)].filter(x=>!prim.includes(x)).forEach(x=>{ cS[x]=(cS[x]||0)+1; });
    });
    return {name:d.name, exCount:d.exercises.length, cP, cS};
  });
  // Gesamtzählung über den ganzen Plan
  const tP={}, tS={};
  perDay.forEach(d=>{
    Object.entries(d.cP).forEach(([m,n])=>{ tP[m]=(tP[m]||0)+n; });
    Object.entries(d.cS).forEach(([m,n])=>{ tS[m]=(tS[m]||0)+n; });
  });

  // Ein Balkenblock. Die Skala gilt für Primär und Sekundär gemeinsam, damit
  // gleiche Zahlen auch gleich lange Balken ergeben.
  const block=(count, max, sekundaer)=>{
    const arr=Object.entries(count).sort((a,b)=>b[1]-a[1]);
    if(!arr.length) return `<div class="faint" style="font-size:11.5px;padding:2px 0 6px">–</div>`;
    return arr.map(([m,n])=>`<div class="ov-row">
      <span class="ov-lbl">${esc(m)}</span>
      <div class="ov-track"><div class="ov-fill ${sekundaer?'sec':'acc'}" style="width:${Math.round(n/max*100)}%"></div></div>
      <span class="ov-val">${n}×</span>
    </div>`).join('');
  };
  const maxOf=(...objs)=>Math.max(1, ...objs.flatMap(o=>Object.values(o)));

  openModal(`<div class="grab"></div>
    <h2>${esc(p.name)}</h2>
    <p class="faint" style="font-size:12px;margin:4px 0 14px">Wie oft wird welcher Muskel beansprucht? Getrennt nach Haupt- und Nebenbelastung.</p>
    ${missing?`<div class="ov-note">
      Bei ${missing} ${missing===1?'Übung':'Übungen'} sind noch keine Muskeln hinterlegt.
      Dort wird ersatzweise die Körperregion gezählt. Trage die Muskeln in der Übung nach, um eine genauere Übersicht zu erhalten.
    </div>`:''}

    ${perDay.map(d=>{
      const maxD=maxOf(d.cP, d.cS);
      return `<div class="card" style="padding:13px 15px;margin-bottom:10px">
        <div class="row between" style="margin-bottom:10px">
          <span style="font-weight:700;font-size:14px">${esc(d.name)}</span>
          <span class="faint" style="font-size:11px">${d.exCount} Übungen</span>
        </div>
        ${d.exCount? `
          <div class="ov-sub">Primär</div>
          ${block(d.cP, maxD, false)}
          <div class="ov-sub" style="margin-top:10px">Sekundär</div>
          ${block(d.cS, maxD, true)}
        ` : `<div class="faint" style="font-size:12px">Noch keine Übungen.</div>`}
      </div>`;
    }).join('')}

    ${(Object.keys(tP).length||Object.keys(tS).length)?`<div class="card" style="padding:13px 15px;margin-bottom:10px;border-color:var(--accent-dim)">
      <div class="eyebrow" style="margin-bottom:10px;color:var(--accent-dim)">Gesamter Plan</div>
      <div class="ov-sub">Primär</div>
      ${block(tP, maxOf(tP,tS), false)}
      <div class="ov-sub" style="margin-top:10px">Sekundär</div>
      ${block(tS, maxOf(tP,tS), true)}
    </div>`:''}

    <button class="btn ghost" style="margin-top:4px" onclick="closeModal()">Schließen</button>
  `, true);
}
/* Einheit direkt an einen bestehenden Plan hängen – ohne Editor, ohne Entwurf.

/* Trainingseinheiten pro Woche. Steht auf der Plankarte und damit außerhalb des
   Entwurfs-Modells des Editors – wird deshalb sofort geschrieben. Der Wert
   speist die Serien-Berechnung in der Heute-Ansicht. */
function setPlanPerWeek(id, n){
  const p=DB.plans.find(x=>x.id===id); if(!p) return;
  p.perWeek=+n; save();
}
/* Der Plan ist das Größte, was sich hier verlieren lässt: Rückfrage UND
   anschließend die Rücknahme-Leiste. Alle anderen Löschungen betreffen einzelne
   Einträge und kommen mit der Rücknahme allein aus. */
function deletePlan(id){
  const p0=DB.plans.find(x=>x.id===id); if(!p0) return;
  const ec=p0.days.reduce((a,d)=>a+d.exercises.length,0);
  confirmModal('Plan löschen?',
    `„${p0.name}“ mit ${p0.days.length} ${p0.days.length===1?'Einheit':'Einheiten'} und ${ec} ${ec===1?'Übung':'Übungen'}.`,
    'Löschen', ()=>{
    const idx=DB.plans.findIndex(p=>p.id===id);
    if(idx<0) return;
    const plan=DB.plans[idx];
    // Aufklapp-Zustand gehört zum Plan und wird gleich mit gelöscht – deshalb
    // hier sichern. Ohne das käme der Plan anders aufgeklappt zurück, als er ging.
    const m=collapsedMap();
    const kHeute='today:'+id, kPlaene='plans:'+id;
    const zHeute=m[kHeute], zPlaene=m[kPlaene];

    DB.plans.splice(idx,1);
    delete m[kHeute]; delete m[kPlaene];
    save(); renderView();

    registerUndo(`„${plan.name}“ gelöscht`, ()=>{
      DB.plans.splice(Math.min(idx, DB.plans.length), 0, plan);
      const m2=collapsedMap();
      if(zHeute!==undefined) m2[kHeute]=zHeute;
      if(zPlaene!==undefined) m2[kPlaene]=zPlaene;
    });
  });
}

let BUILDER=null;

/* Wischen zwischen Einheiten – ignoriert Züge, die am Drag-Griff starten */
function initBldSwipe(){
  const el=document.getElementById('bldPage'); if(!el) return;
  let x0=null,y0=null,moved=false,skip=false;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    skip = !!e.target.closest('.bld-grip');   // Drag&Drop nicht stören
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; moved=false;
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(x0==null||skip) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10) moved=true;
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0==null||skip||!moved){ x0=null; skip=false; return; }
    const dx=e.changedTouches[0].clientX-x0;
    x0=null;
    if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if(dx<-45) goDay(BUILDER.page+1);
    else if(dx>45) goDay(BUILDER.page-1);
  },{passive:true});
}

let _dragDi=null, _dragEi=null;
function moveExercise(di, from, to){
  if(from===to || to<0) return;
  const arr=BUILDER.days[di].exercises;
  if(to>=arr.length) to=arr.length-1;

// Desktop (HTML5 drag)
function dragStart(ev,di,ei){ _dragDi=di; _dragEi=ei; ev.dataTransfer.effectAllowed='move';
  try{ev.dataTransfer.setData('text/plain',ei);}catch(e){}
  ev.currentTarget.classList.add('dragging'); }
function dragEnd(ev){ ev.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.bld-row.drop-target').forEach(r=>r.classList.remove('drop-target')); }
function dragOver(ev,di,ei){ if(_dragDi!==di) return; ev.preventDefault(); ev.dataTransfer.dropEffect='move';
  ev.currentTarget.classList.add('drop-target'); }
function dragLeave(ev){ ev.currentTarget.classList.remove('drop-target'); }
function dragDrop(ev,di,ei){ if(_dragDi!==di) return; ev.preventDefault();
  moveExercise(di,_dragEi,ei); _dragDi=null; _dragEi=null; renderBuilder(); }

// Touch (pointer-basiert) — HTML5-Drag ist auf Mobilgeräten unzuverlässig
let _touchDrag=null;
function initTouchDrag(){
  document.querySelectorAll('.bld-grip').forEach(grip=>{
    grip.addEventListener('touchstart', onGripTouchStart, {passive:false});
  });
}
function onGripTouchStart(ev){
  const row=ev.target.closest('.bld-row'); if(!row) return;
  ev.preventDefault();
  const di=+row.dataset.di, ei=+row.dataset.ei;
  const list=row.closest('.bld-exlist');
  row.classList.add('dragging');
  _touchDrag={di, from:ei, row, list};
  const move=e=>{
    const t=e.touches[0];
    const rows=[...list.querySelectorAll('.bld-row')];
    let target=null;
    for(const r of rows){ const rc=r.getBoundingClientRect();
      if(t.clientY>=rc.top && t.clientY<=rc.bottom){ target=r; break; } }
    rows.forEach(r=>r.classList.remove('drop-target'));
    if(target && target!==row) target.classList.add('drop-target');
    _touchDrag.overEi = target? +target.dataset.ei : null;
  };
  const end=()=>{
    document.removeEventListener('touchmove',move);
    document.removeEventListener('touchend',end);
    if(_touchDrag && _touchDrag.overEi!=null && _touchDrag.overEi!==_touchDrag.from){
      moveExercise(_touchDrag.di,_touchDrag.from,_touchDrag.overEi);
      _touchDrag=null; renderBuilder();
    } else { row.classList.remove('dragging');
      list.querySelectorAll('.drop-target').forEach(r=>r.classList.remove('drop-target')); _touchDrag=null; }
  };
  document.addEventListener('touchmove',move,{passive:false});
  document.addEventListener('touchend',end);
}

// Aktuell angezeigter Monat im Verlaufs-Kalender (Offset 0 = aktueller Monat).
let HIST_MONTH=null; // {year, month} – wird beim ersten Rendern gesetzt
function viewHistory(){
  if(!DB.logs.length) return topbar('Training history')+`<div class="pad"><div class="empty">${I.history}
    <h3>Noch kein Training</h3><p style="font-size:13.5px">Deine abgeschlossenen Einheiten erscheinen hier.</p></div></div>`;
  const now=new Date();
  if(!HIST_MONTH) HIST_MONTH={year:now.getFullYear(), month:now.getMonth()};
  return topbar('Training history')+`<div class="pad">${calendarHtml()}</div>`;
}
// Gruppiert alle Logs nach Kalendertag (lokale Zeit): 'YYYY-M-D' -> [logs]
function logsByDay(){
  const map={};
  DB.logs.forEach(l=>{
    const d=new Date(l.date);
    const key=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
    (map[key]||(map[key]=[])).push(l);
  });
  return map;
}
// Erfüllungsgrad eines Trainingstages: absolvierte Übungen / geplante Übungen
// der Einheit. Ohne zuordenbaren Plan (freies Training, gelöschter Plan) gilt 100 %.
// Bei mehreren Trainings am Tag zählt das beste.
function dayCompletion(dayLogs){
  let best=0;
  dayLogs.forEach(l=>{
    let pct=1;
    const plan=(l.planId && DB.plans.find(p=>p.id===l.planId)) || DB.plans.find(p=>p.name===l.planName);
    const day=plan && (plan.days||[]).find(d=>d.name===l.dayName);
    if(day && day.exercises && day.exercises.length){
      pct=Math.min(1, (l.exercises||[]).length / day.exercises.length);
    }
    best=Math.max(best, pct);
  });
  return best;
}
function calendarHtml(){
  const {year, month}=HIST_MONTH;
  const byDay=logsByDay();
  const first=new Date(year, month, 1);
  const daysInMonth=new Date(year, month+1, 0).getDate();
  // Wochenstart Montag: JS getDay() 0=So..6=Sa -> in Mo..So umrechnen
  let startWd=first.getDay(); startWd=(startWd===0)?6:startWd-1;
  const monthName=first.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
  const today=new Date();
  const todayKey=today.getFullYear()+'-'+today.getMonth()+'-'+today.getDate();

  // Gibt es überhaupt frühere/spätere Logs? (für Pfeil-Deaktivierung)
  const monthStart=new Date(year,month,1).getTime();
  const monthEnd=new Date(year,month+1,1).getTime();
  const hasOlder=DB.logs.some(l=>l.date<monthStart);
  const hasNewer=DB.logs.some(l=>l.date>=monthEnd);

  const wd=['Mo','Di','Mi','Do','Fr','Sa','So'];
  let cells='';
  // Keine Leerzellen mehr: Der erste Tag wird per grid-column-start an die
  // richtige Wochentagsspalte gesetzt. Das vermeidet, dass leere Platzhalter-
  // zellen die Höhe der ersten Zeile aufblähen.
  for(let day=1;day<=daysInMonth;day++){
    const key=year+'-'+month+'-'+day;
    const dayLogs=byDay[key]||[];
    const trained=dayLogs.length>0;
    const isToday=(key===todayKey);
    const cls=['cal-cell'];
    if(trained) cls.push('trained');
    if(isToday) cls.push('today');
    // Nur der erste Tag bekommt die Spalten-Startposition (1-basiert: Mo=1..So=7);
    // Trainingstage zusätzlich den Füllstand (wie voll der Tag "grün vollläuft").
    const styles=[];
    if(day===1) styles.push(`grid-column-start:${startWd+1}`);
    if(trained) styles.push(`--fill:${Math.round(dayCompletion(dayLogs)*100)}%`);
    const colStyle = styles.length ? ` style="${styles.join(';')}"` : '';
    // Mehrere Trainings am selben Tag: kleiner Zähler
    const badge = dayLogs.length>1 ? `<span class="cal-badge">${dayLogs.length}</span>` : '';
    const onclick = trained ? ` onclick="openDayLogs('${key}')"` : '';
    cells+=`<div class="${cls.join(' ')}"${colStyle}${onclick}>
      <span class="cal-num">${day}</span>${badge}
    </div>`;
  }

  // Monats-Zusammenfassung
  const monthLogs=DB.logs.filter(l=>l.date>=monthStart && l.date<monthEnd);
  const mVol=monthLogs.reduce((a,l)=>a+logVolume(l),0);
  const trainDays=new Set(monthLogs.map(l=>{const d=new Date(l.date);return d.getDate();})).size;

  return `<div class="cal-wrap">
    <div class="cal-head">
      <button class="cal-nav" onclick="histShiftMonth(-1)" ${hasOlder?'':'disabled'} aria-label="Vorheriger Monat">${I.chevronL}</button>
      <div class="cal-title">${monthName}</div>
      <button class="cal-nav" onclick="histShiftMonth(1)" ${hasNewer?'':'disabled'} aria-label="Nächster Monat">${I.chevron}</button>
    </div>
    <div class="cal-grid cal-wd">${wd.map(d=>`<div class="cal-wdlbl">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    ${monthLogs.length?`<div class="cal-summary">
      <div class="cal-sum-item"><span class="cal-sum-num">${trainDays}</span><span class="cal-sum-lbl">Trainingstage</span></div>
      <div class="cal-sum-item"><span class="cal-sum-num">${monthLogs.length}</span><span class="cal-sum-lbl">Einheiten</span></div>
      <div class="cal-sum-item"><span class="cal-sum-num">${(mVol/1000).toFixed(1)}<span style="font-size:13px;color:var(--text-dim)">t</span></span><span class="cal-sum-lbl">Volumen</span></div>
    </div>`:`<div class="cal-empty-month">In diesem Monat kein Training</div>`}
  </div>`;
}
function histShiftMonth(dir){
  let {year, month}=HIST_MONTH;
  month+=dir;
  if(month<0){ month=11; year--; }
  else if(month>11){ month=0; year++; }
  HIST_MONTH={year, month};
  renderView();
}
// Öffnet die Trainings eines Tages. Bei einem Training direkt die Details,
// bei mehreren eine kleine Auswahl.
function openDayLogs(key){
  const byDay=logsByDay();
  const logs=byDay[key]||[];
  if(!logs.length) return;
  if(logs.length===1){ showLogDetail(logs[0].id); return; }
  // Mehrere: Auswahlliste
  const d=new Date(logs[0].date);
  const dateStr=d.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  openModal(`<div class="grab"></div>
    <h2>${logs.length} Trainings</h2>
    <p class="faint" style="font-size:12.5px;margin:4px 0 16px">${dateStr}</p>
    ${logs.map(l=>{
      const vol=logVolume(l);
      const sets=l.exercises.reduce((a,e)=>a+e.sets.length,0);
      return `<div class="card" style="padding:13px 15px;margin-bottom:10px;cursor:pointer" onclick="closeModal();showLogDetail('${l.id}')">
        <div class="row between">
          <div class="display" style="font-size:17px">${esc(l.dayName)}</div>
          <span class="faint" style="font-size:11px">${new Date(l.date).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</span>
        </div>
        <div class="row wrap" style="gap:8px;margin-top:10px">

          <span class="chip">${sets} Sätze</span>
          <span class="chip" style="color:var(--accent);border-color:var(--accent-dim)">${vol.toLocaleString('de-DE')} kg</span>
        </div>

    <button class="btn ghost" style="margin-top:4px" onclick="closeModal()">Schließen</button>

function deleteLog(id){
  const idx=DB.logs.findIndex(l=>l.id===id);
  if(idx<0) return;
  const log=DB.logs[idx];
  DB.logs.splice(idx,1);
  save(); renderView();
  registerUndo(`„${log.dayName}“ gelöscht`, ()=>{
    // Index begrenzen: Zwischen Löschen und Rücknahme kann saveLogEdit() neu
    // sortiert oder finishSession() angehängt haben.
    DB.logs.splice(Math.min(idx, DB.logs.length), 0, log);
  });
}

/* ================================================================
   EINHEIT GEGEN EINHEIT
   ================================================================
   Verglichen wird eine Einheit mit dem vorherigen Vorkommen DERSELBEN Einheit –
   nicht mit „vor sieben Tagen“. Wer eine Woche aussetzt, will gegen sein letztes
   Push-Training verglichen werden, nicht gegen nichts.

   Der Kern ist der Umgang mit geänderten Übungen. Die Prozentzahl wird
   ausschließlich über die Übungen gebildet, die in BEIDEN Einheiten vorkommen,
   und der Block sagt auch, wie viele das sind. Stünde dort die Summe beider
   Einheiten, würde bei getauschten Übungen eine Übung gegen eine andere
   gerechnet und das Ergebnis als Fortschritt ausgegeben. Hinzugekommenes und
   Weggefallenes steht darunter mit seinem Volumen, aber außerhalb der Rechnung.

   Zugeordnet wird über die Übungs-ID mit Rückfall auf den Namen – eine
   umbenannte Übung bleibt dieselbe, ein Alteintrag ohne ID findet sich trotzdem.
   ================================================================ */
// Vorheriges Vorkommen derselben Einheit. Bewusst „älter als diese“ und nicht
// „das letzte überhaupt“: Man kann auch eine ältere Einheit im Verlauf öffnen.
function vorherigeEinheit(log){
  let best=null;
  (DB.logs||[]).forEach(l=>{
    if(l.id===log.id || l.dayName!==log.dayName || l.date>=log.date) return;
    if(!best || l.date>best.date) best=l;
  });
  return best;
}
function exVolInEintrag(e){
  const f=exFactor(e.name, e.exId);
  return (e.sets||[]).filter(s=>s.done!==false)
    .reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
}
function exRepsInEintrag(e){
  return (e.sets||[]).filter(s=>s.done!==false).reduce((a,s)=>a+(+s.reps||0),0);
}
function vergleicheEinheiten(log){
  const vorher=vorherigeEinheit(log);
  const leer={vorher:null, gemeinsam:[], neu:[], weg:[],
              summeJetzt:0, summeVorher:0, pct:null, einheit:'kg'};
  if(!log) return leer;
  if(!vorher) return Object.assign({}, leer, {vorher:null});

  const passt=(x,y)=> (x.exId && y.exId) ? x.exId===y.exId : x.name===y.name;
  const alt=[...(vorher.exercises||[])];
  const gemeinsam=[], neu=[], weg=[];

  (log.exercises||[]).forEach(e=>{
    const i=alt.findIndex(a=>passt(e,a));
    if(i<0){ neu.push({exId:e.exId, name:e.name, vol:exVolInEintrag(e), reps:exRepsInEintrag(e)}); return; }
    const a=alt.splice(i,1)[0];
    const jv=exVolInEintrag(e), vv=exVolInEintrag(a);
    const jr=exRepsInEintrag(e), vr=exRepsInEintrag(a);
    // Je Übung entscheidet sich die Einheit selbst – wie im Vergleichsbalken.
    const wdh = (jv===0 && vv===0 && (jr>0 || vr>0));
    gemeinsam.push({exId:e.exId, name:e.name,
      jetzt: wdh?jr:jv, vorher: wdh?vr:vv, einheit: wdh?'Wdh':'kg',
      pct: (!wdh && vv>0) ? Math.round((jv/vv-1)*100)
         : ( wdh && vr>0) ? Math.round((jr/vr-1)*100) : null});
  });
  alt.forEach(a=>weg.push({exId:a.exId, name:a.name, vol:exVolInEintrag(a), reps:exRepsInEintrag(a)}));

  // Gesamtzahl: Volumen, außer es geht in beiden Einheiten um reine
  // Körpergewichtsübungen – dann Wiederholungen.
  const alleWdh = gemeinsam.length>0 && gemeinsam.every(g=>g.einheit==='Wdh');
  const einheit = alleWdh?'Wdh':'kg';
  const summeJetzt  = gemeinsam.reduce((a,g)=>a+(g.einheit===einheit?g.jetzt :0),0);
  const summeVorher = gemeinsam.reduce((a,g)=>a+(g.einheit===einheit?g.vorher:0),0);
  /* Kein Prozentwert bei nur EINER gemeinsamen Übung: Das wäre keine Aussage
     über die Einheit, sondern über diese eine Übung – und die steht ohnehin
     als Zeile darunter. Ebenso wenig ohne Vergleichswert (Division durch 0). */
  const pct = (gemeinsam.length>=2 && summeVorher>0)
    ? Math.round((summeJetzt/summeVorher-1)*100) : null;

  return {vorher, gemeinsam, neu, weg, summeJetzt, summeVorher, pct, einheit};
}
function vergleichsBlock(log){
  const v=vergleicheEinheiten(log);
  if(!v.vorher) return `<div class="vgl-leer">Erstes Training dieser Einheit — noch nichts zu vergleichen.</div>`;
  const zahl=n=>n.toLocaleString('de-DE');
  const pill=p=>p==null?'' : `<span class="vgl-delta ${p>0?'up':(p<0?'down':'same')}">${p>0?'+':''}${p}%</span>`;
  const zeile=g=>`<div class="vgl-row">
      <span class="vgl-name">${esc(g.name)}</span>
      <span class="vgl-num">${zahl(g.vorher)} → ${zahl(g.jetzt)} ${g.einheit}</span>
      ${pill(g.pct)}
    </div>`;
  const extra=(titel,list)=>list.length? `<div class="vgl-extra">
      <div class="vgl-extra-t">${titel}</div>
      ${list.map(x=>`<div class="vgl-row">
        <span class="vgl-name">${esc(x.name)}</span>
        <span class="vgl-num">${x.vol>0?zahl(x.vol)+' kg':zahl(x.reps)+' Wdh'}</span>
      </div>`).join('')}
    </div>`:'';
  const n=v.gemeinsam.length;
  return `<div class="vgl">
    <div class="vgl-head">
      <span class="eyebrow">gegenüber ${fmtDate(v.vorher.date)}</span>
      ${pill(v.pct)}
    </div>
    ${n? `${n>=2? `<div class="vgl-sum">${zahl(v.summeVorher)} → <b>${zahl(v.summeJetzt)}</b> ${v.einheit}</div>
        <div class="vgl-basis">über ${n} gemeinsame Übungen</div>`
      /* Bei einer einzigen gemeinsamen Übung wiederholte die Summenzeile genau
         das, was direkt darunter als Zeile steht. Dann lieber nur die Zeile –
         und dazusagen, warum keine Gesamtzahl dasteht. */
      : `<div class="vgl-basis">Nur eine gemeinsame Übung — für eine Gesamtzahl über die Einheit zu wenig.</div>`}
      ${v.gemeinsam.map(zeile).join('')}`
    : `<div class="vgl-basis">Keine gemeinsame Übung — die Einheit wurde vollständig umgestellt.</div>`}
    ${extra('Neu dabei', v.neu)}
    ${extra('Weggefallen', v.weg)}
  </div>`;
}

function showLogDetail(id){
  const l=DB.logs.find(x=>x.id===id); if(!l) return;
  const vol=logVolume(l);
  openModal(`<div class="grab"></div>
    <h2>${esc(l.dayName)}</h2>

            <div style="min-width:0"><div style="font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.name)}</div>

          <span class="num" style="font-weight:600">${s.reps} Wdh</span>
          <span class="num" style="color:var(--text-dim)">${(s.rir!=null&&s.rir!=='')?('RIR '+s.rir):'–'}</span>
        </div>`).join('')}
      </div>`;
    }).join('')}
    <div class="log-actions" style="margin-top:16px">
      <button class="log-btn" onclick="closeModal();editLog('${l.id}')">${I.edit}<span>Bearbeiten</span></button>
      <button class="log-btn danger" onclick="closeModal();deleteLog('${l.id}')">${I.trash}<span>Löschen</span></button>
    </div>
    <button class="btn ghost" style="margin-top:10px" onclick="closeModal()">Schließen</button>`);
}

      <line x1="${a1x}" y1="${a1y}" x2="${a2x}" y2="${a2y}"/>
      <path d="${spitze(a1x,a1y,1)}"/>
      <path d="${spitze(a2x,a2y,-1)}"/>
      ${strich(g.x1,g.y1,'halo')}${strich(g.x2,g.y2,'halo')}
      ${strich(g.x1,g.y1,'')}${strich(g.x2,g.y2,'')}
    </g>`;
  }
  // Beschriftungen mit Werten rund um die Figur
  let labels='';
  if(opts.beschriftet){
    labels=BODY_LABELS.map(L=>{
      const m=BODY_METRICS.find(x=>x.key===L.key); if(!m) return '';
      const cur=lastMeasure(m.key), prev=prevMeasure(m.key);
      const diff=(cur&&prev)? Math.round((cur.value-prev.value)*10)/10 : null;
      const links=L.seite==='l';
      const tx=links?LBL_L:LBL_R;
      const anchor=links?'end':'start';        // Text zeigt von der Figur weg
      const kx=links?LBL_L+6:LBL_R-6;          // Start der Führungslinie
      const g=BODY_GUIDES[m.region];
      let ax,ay;
      if(g){ const nimmLinks=(g.x1<=g.x2)===links; ax=nimmLinks?g.x1:g.x2; ay=nimmLinks?g.y1:g.y2; }
      else { ax=links?110:190; ay=26; }        // Körpergewicht: Anschluss am Rumpf oben
      const aktiv = BODY_ACTIVE_KEY===m.key;
      const wert = cur? `${cur.value}` : '–';
      // Differenz gehört in die Namenszeile: die Wertzeile bleibt schmal,
      // dadurch braucht die Beschriftung weniger Platz und die Figur wird größer.
      const dTxt = (diff!=null&&diff!==0) ? `${diff>0?'+':''}${diff}` : '';
      const dCls = diff>0?'up':'down';
      const inhalt = `${wert}<tspan class="lbl-unit"> ${m.unit}</tspan>`;
      const nameZeile = links
        ? `${dTxt?`<tspan class="lbl-diff ${dCls}">${dTxt} </tspan>`:''}${esc(L.kurz)}`
        : `${esc(L.kurz)}${dTxt?`<tspan class="lbl-diff ${dCls}"> ${dTxt}</tspan>`:''}`;
      return `<g class="lbl${aktiv?' on':''}" onclick="editMeasure('${m.key}')">
        <path class="lbl-lead" d="M${kx},${L.y} L${(kx+ax)/2},${L.y} L${ax},${ay}"/>
        <circle class="lbl-dot" cx="${ax}" cy="${ay}" r="3.2"/>
        <rect class="lbl-hit" x="${links?tx-96:tx-4}" y="${L.y-20}" width="100" height="36"/>
        <text class="lbl-name" x="${tx}" y="${L.y-5}" text-anchor="${anchor}">${nameZeile}</text>
        <text class="lbl-val" id="lblval-${m.key}" x="${tx}" y="${L.y+13}" text-anchor="${anchor}">${inhalt}</text>
      </g>`;
    }).join('');
  }
  const schmal = opts.beschriftet && window.innerWidth<520;
  const vb = opts.beschriftet ? (schmal?"-104 -16 508 486":"-118 -16 536 486") : BODY_VIEWBOX;
  return `<svg viewBox="${vb}" class="body-fig${opts.beschriftet?' mit-labels':''}${schmal?' schmal':''}" xmlns="http://www.w3.org/2000/svg">
    <path class="body-fill" d="${BODY_SIL}"/>
    ${BODY_DEKO.map(d=>`<path class="body-deko" d="${d}"/>`).join('')}
    ${Object.keys(BODY_REGIONS).map(k=>{
      const m=BODY_METRICS.find(x=>x.region===k);
      return `<path class="body-reg${active===k?' on':''}" d="${BODY_REGIONS[k]}"
        ${klick?`onclick="editMeasure('${m?m.key:''}')"`:''}></path>`;
    }).join('')}
    <path class="body-outline" d="${BODY_SIL}"/>
    ${pfeil}
    ${labels}
  </svg>`;
}
// Letzte Messung eines Werts (jüngster Eintrag, der ihn enthält)
function lastMeasure(key){
  const list=(DB.measurements||[]).filter(m=>m.vals && m.vals[key]!=null).sort((a,b)=>b.date-a.date);
  return list.length? {value:list[0].vals[key], date:list[0].date} : null;
}
// Vorletzter Wert – für die Veränderung
function prevMeasure(key){
  const list=(DB.measurements||[]).filter(m=>m.vals && m.vals[key]!=null).sort((a,b)=>b.date-a.date);
  return list.length>1? {value:list[1].vals[key], date:list[1].date} : null;
}

// Veränderung einer Messstelle: erster gegen letzten Wert
function measureTrend(key){
  const list=(DB.measurements||[]).filter(m=>m.vals&&m.vals[key]!=null).sort((a,b)=>a.date-b.date);
  if(list.length<2) return null;
  return Math.round((list[list.length-1].vals[key]-list[0].vals[key])*10)/10;
}
// Verlaufskurve einer Messstelle
function renderMeasureChart(key){
  const el=document.getElementById('msChart'); if(!el) return;
  const m=BODY_METRICS.find(x=>x.key===key); if(!m) return;
  const rows=(DB.measurements||[]).filter(x=>x.vals&&x.vals[key]!=null)
    .map(x=>({date:x.date, v:x.vals[key]})).sort((a,b)=>a.date-b.date);
  if(!rows.length){ el.innerHTML=`<div class="faint" style="font-size:12.5px;padding:14px 0">Noch keine Werte.</div>`; return; }
  let chart='';
  if(rows.length>=2){
    const vs=rows.map(r=>r.v), max=Math.max(...vs), min=Math.min(...vs), sp=(max-min)||1;
    const W=100,H=80;
    const pfad=rows.map((r,i)=>{const x=i/(rows.length-1)*W, y=H-((r.v-min)/sp)*H; return `${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');
    const flaeche=`M0,${H} `+rows.map((r,i)=>{const x=i/(rows.length-1)*W, y=H-((r.v-min)/sp)*H; return `L${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ')+` L${W},${H} Z`;
    const d=rows[rows.length-1].v-rows[0].v, dr=Math.round(d*10)/10;
    chart=`<div class="row between" style="margin:8px 0 10px">
        <span class="faint" style="font-size:12px">${rows.length} Messungen</span>
        <span class="pill ${d>0?'up':d<0?'down':'same'}">${d>0?'+':''}${dr} ${m.unit}</span></div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:110px;overflow:visible">
        <defs><linearGradient id="msgrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
        <path d="${flaeche}" fill="url(#msgrad)"/>
        <path d="${pfad}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
  }
  el.innerHTML=chart+`<div class="prog-table">
    <div class="prog-row prog-head" style="grid-template-columns:1.4fr 1fr 1fr">
      <span>Datum</span><span>Wert</span><span>Δ</span></div>
    ${[...rows].reverse().map((r,i,arr)=>{
      const vor=arr[i+1];
      const d=vor? Math.round((r.v-vor.v)*10)/10 : null;
      return `<div class="prog-row" style="grid-template-columns:1.4fr 1fr 1fr">
        <span>${fmtDate(r.date)}</span>
        <span class="num">${r.v} ${m.unit}</span>
        <span class="num">${d!=null&&d!==0?`<span class="wk-delta ${d>0?'up':'down'}">${d>0?'+':''}${d}</span>`:'–'}</span>
      </div>`;
    }).join('')}
  </div>`;
}
// Wert erfassen/ändern. Alle Werte eines Tages landen in einem Eintrag.
/* Wert direkt an der Beschriftung eintragen – ohne Extra-Fenster.
   Das Eingabefeld wird exakt über die angezeigte Zahl gelegt. */
function editMeasure(key){
  const m=BODY_METRICS.find(x=>x.key===key); if(!m) return;
  BODY_ACTIVE=m.region||'';
  BODY_ACTIVE_KEY=key;
  renderView();
  requestAnimationFrame(()=>openInline(key));
}
let INLINE_AKTIV=false, INLINE_VERSTECKT=[];
// Beschriftung wieder einblenden, die für die Eingabe gewichen ist
function inlineZeigen(){
  INLINE_VERSTECKT.forEach(el=>{ el.style.opacity=''; });
  INLINE_VERSTECKT=[];
}
function openInline(key){
  const wrap=document.getElementById('bodyWrap');
  const ziel=document.getElementById('lblval-'+key);
  const inp=document.getElementById('msInline');
  if(!wrap||!ziel||!inp) return;
  const wr=wrap.getBoundingClientRect(), zr=ziel.getBoundingClientRect();
  const cur=lastMeasure(key);
  const def=BODY_LABELS.find(L=>L.key===key);
  const links = def ? def.seite==='l' : true;
  inp.value = cur ? zahlFeld(cur.value) : '';
  inp.dataset.key = key;
  // Schriftgröße an die gerenderte Zahl angleichen (mind. 16px gegen Zoom auf iOS)
  const fs=Math.max(16, parseFloat(getComputedStyle(ziel).fontSize)||18);
  inp.style.fontSize=fs+'px';
  const breite=Math.max(78, zr.width+40);
  inp.style.width=breite+'px';
  /* Die ganze Beschriftung weicht für die Dauer der Eingabe – Zahl UND Name.
     Grund ist reine Geometrie: Das Feld ist rund 30 px hoch, zwei Beschriftungen
     liegen aber nur 40 px auseinander (auf dem Panel bei 600 px Fensterhöhe).
     Es gibt dort also keine 30 px freie Bahn, in die das Feld ausweichen könnte
     – egal wo man es hinschiebt, es läge über dem Namen. Verloren geht dabei
     nichts: Die Bildunterschrift darunter nennt die Messstelle sogar
     ausgeschrieben („Körpergewicht“ statt „Gewicht“). */
  const gruppe=ziel.parentNode;
  inlineZeigen();
  INLINE_VERSTECKT=[...gruppe.querySelectorAll('.lbl-name, .lbl-val')];
  INLINE_VERSTECKT.forEach(el=>{ el.style.opacity='0'; });
  inp.style.display='block';
  // Erst nach dem Einblenden ausrichten: dann ist die echte Feldhöhe bekannt und
  // das Feld liegt exakt mittig über der Zahl statt auf der Namenszeile.
  const h=inp.offsetHeight||28;
  inp.style.left = Math.round(zr.left+zr.width/2 - wr.left - breite/2) + 'px';
  inp.style.top  = Math.round(zr.top+zr.height/2 - wr.top - h/2) + 'px';
  INLINE_AKTIV=true;
  inp.focus(); inp.select();
}
function inlineKey(e){
  if(e.key==='Enter'){ e.preventDefault(); inlineSave(); }
  else if(e.key==='Escape'){ e.preventDefault(); inlineAbbruch(); }
}
function inlineAbbruch(){
  const inp=document.getElementById('msInline');
  INLINE_AKTIV=false;
  inlineZeigen();
  if(inp){ inp.style.display='none'; inp.blur(); }
}
function inlineSave(){
  const inp=document.getElementById('msInline');
  if(!inp || !INLINE_AKTIV) return;
  INLINE_AKTIV=false;
  inp.style.display='none';
  inlineZeigen();
  const key=inp.dataset.key, roh=(inp.value||'').trim();
  if(roh==='') return;                       // leer gelassen: nichts ändern
  const val=Math.round(parseNum(roh)*10)/10;
  if(!isFinite(val) || val<=0){ toast('Bitte eine gültige Zahl eingeben'); return; }
  if(!Array.isArray(DB.measurements)) DB.measurements=[];
  // Alle Werte desselben Kalendertags landen in einem Eintrag
  const heute=new Date(); heute.setHours(0,0,0,0);
  let eintrag=DB.measurements.find(m=>{const d=new Date(m.date); d.setHours(0,0,0,0); return d.getTime()===heute.getTime();});
  if(!eintrag){ eintrag={id:uid(), date:Date.now(), vals:{}}; DB.measurements.push(eintrag); }
  if(!eintrag.vals) eintrag.vals={};
  eintrag.vals[key]=val;
  save(); renderView();
  toast('Gespeichert ✓');
}
function deleteMeasureDay(id){
  const arr=DB.measurements||(DB.measurements=[]);
  const idx=arr.findIndex(m=>m.id===id);
  if(idx<0) return;
  const eintrag=arr[idx];
  arr.splice(idx,1);
  save(); renderView();
  registerUndo(`Messung vom ${fmtDate(eintrag.date)} gelöscht`, ()=>{
    const a=DB.measurements||(DB.measurements=[]);
    a.splice(Math.min(idx, a.length), 0, eintrag);
  });
}

function logEditDelSet(ei,si){

      </div>
      <div class="sess-bar"><div class="sess-fill" style="width:${pct}%;background:${eng?'var(--red)':'var(--accent)'}"></div></div>
      ${eng?`<p style="font-size:11.5px;color:var(--red);margin-top:7px;line-height:1.45">
        Der Speicher wird knapp. Lade ein Backup herunter und entferne Bilder aus
        eigenen Übungen — sonst können neue Trainings bald nicht mehr gesichert werden.</p>`:''}
    </div>
    <button class="btn-slim solid" style="margin-bottom:10px" onclick="exportData()">${I.download}<span>Backup herunterladen</span></button>
    <button class="btn-slim" onclick="document.getElementById('importFile').click()">${I.upload}<span>Backup wiederherstellen</span></button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(event)">
    <div class="app-version">ProgressLab v${APP_VERSION} · Stand ${APP_BUILD}</div>
  </div>`;
}
function exportData(){
  const payload={
    app:'ProgressLab', type:'backup', version:1, appVersion:APP_VERSION, appBuild:APP_BUILD,
    exportedAt:new Date().toISOString(),
    data:{ plans:DB.plans, logs:DB.logs, settings:DB.settings, customEx:DB.customEx||[], measurements:DB.measurements||[] }
  };
  const json=JSON.stringify(payload,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date(); const p=n=>String(n).padStart(2,'0');
  a.href=url;
  a.download=`ProgressLab-Backup_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
  toast('Backup heruntergeladen');
}
function importData(ev){
  const file=ev.target.files&&ev.target.files[0];
  ev.target.value=''; // erlaubt erneuten Import derselben Datei
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    let parsed;
    try{ parsed=JSON.parse(reader.result); }
    catch(e){ toast('Datei konnte nicht gelesen werden'); return; }
    const d = parsed && parsed.data ? parsed.data : parsed; // akzeptiert auch rohe {plans,logs}
    if(!d || (!Array.isArray(d.plans) && !Array.isArray(d.logs))){
      toast('Keine gültige ProgressLab-Datei'); return;
    }
    const nP=Array.isArray(d.plans)?d.plans.length:0;
    const nL=Array.isArray(d.logs)?d.logs.length:0;
    const nC=Array.isArray(d.customEx)?d.customEx.length:0;
    confirmModal('Backup wiederherstellen?',
      `Die Datei enthält ${nP} Pläne, ${nL} Trainings${nC?` und ${nC} eigene Übungen`:''}. Deine aktuellen Daten werden dadurch ersetzt.`,
      'Wiederherstellen',()=>{
        clearUndo();   // gleicher Grund wie in applyCloudData
        DB.plans = Array.isArray(d.plans)? d.plans : [];
        DB.logs  = Array.isArray(d.logs)?  d.logs  : [];
        DB.customEx = Array.isArray(d.customEx)? d.customEx : [];
        DB.measurements = Array.isArray(d.measurements)? d.measurements : [];
        if(d.settings && typeof d.settings==='object') DB.settings=Object.assign(DB.settings||{},d.settings);
        DB.logs.sort((a,b)=>a.date-b.date);
        rebuildExDB();
        migrateToEnglish();     // zuerst: Regionen/Muskeln/Namen auf Englisch
        migrateMuscleNames();   // alte Bezeichnungen aus älteren Backups umstellen
        migrateExerciseIds();   // Übungs-IDs in wiederhergestellten Logs/Plänen nachtragen
        save(); go('stats'); toast('Backup wiederhergestellt ✓');
      });
  };
  reader.readAsText(file);
}

/* ---- Statistik-Helfer ---- */
let STATS_RANGE='week';   // 'week' | 'month' | 'year' | 'all'
function setStatsRange(r){ STATS_RANGE=r; renderView(); }
/* Liefert den gewählten Zeitraum und den unmittelbar davorliegenden gleich
   langen Vergleichszeitraum. Bei "Gesamt" gibt es keinen Vorzeitraum. */
function statsPeriod(range){
  const now=new Date(), y=now.getFullYear(), mo=now.getMonth();
  if(range==='week'){
    const cur=weekStartTs(Date.now());
    return {from:cur, prevFrom:cur-7*86400000, prevTo:cur,
            titel:'Diese Woche vs. letzte Woche', kurz:'diese Woche'};
  }
  if(range==='month'){
    const cur=new Date(y,mo,1).getTime();
    return {from:cur, prevFrom:new Date(y,mo-1,1).getTime(), prevTo:cur,
            titel:'Dieser Monat vs. letzter Monat', kurz:'dieser Monat'};
  }
  if(range==='year'){
    const cur=new Date(y,0,1).getTime();
    return {from:cur, prevFrom:new Date(y-1,0,1).getTime(), prevTo:cur,
            titel:'Dieses Jahr vs. letztes Jahr', kurz:'dieses Jahr'};
  }
  return {from:0, prevFrom:null, prevTo:null, titel:'', kurz:'gesamt'};
}
// Montag 00:00 der Woche, in der ts liegt (konsistent mit dem Kalender)
function weekStartTs(ts){ const d=new Date(ts); const wd=(d.getDay()+6)%7; d.setHours(0,0,0,0); return d.getTime()-wd*86400000; }
function logDoneSets(l){ return l.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done!==false).length,0); }
// Durchschnittlicher RIR über alle Sätze der Logs (null, wenn nie angegeben)
function avgRir(logs){
  let sum=0,n=0;
  logs.forEach(l=>l.exercises.forEach(e=>e.sets.forEach(x=>{
    if(x.done!==false && x.rir!=null && x.rir!==''){ sum+=+x.rir; n++; }
  })));
  return n? sum/n : null;
}
// Harte (abgehakte) Sätze pro Muskelgruppe (Primärmuskel der Übung)
function setsPerMuscle(logs){
  const m={};
  logs.forEach(l=>l.exercises.forEach(e=>{
    const n=e.sets.filter(x=>x.done!==false).length;
    if(n) m[e.muscle||'—']=(m[e.muscle||'—']||0)+n;
  }));
  return m;
}
// Volumen-Fortschritt einer Übung in Prozent: erstes vs. letztes Training.
// Gleiche Rechnung wie im Detailbereich, damit beide Werte übereinstimmen.
function exProgressPct(key){
  const byName = key && key.indexOf('name:')===0;
  const exId = byName ? null : key;
  const name = byName ? key.slice(5) : (exMetaById(key) ? exMetaById(key).n : key);
  const f=exFactor(name, exId);
  const vols=[];
  DB.logs.forEach(l=>{
    const e=l.exercises.find(x=> (exId && x.exId===exId) || x.name===name);
    if(!e) return;
    const v=e.sets.filter(s=>s.done!==false).reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
    if(v>0) vols.push(v);
  });
  if(vols.length<2) return null;              // erst ab zwei Trainings aussagekräftig
  const first=vols[0], last=vols[vols.length-1];
  return first? Math.round((last-first)/first*100) : null;
}
// Delta-Chip für den Wochenvergleich (neutral = kein Gut/Schlecht, z. B. bei RIR)
function deltaChip(cur, prev, unit, neutral){
  if(cur==null && prev==null) return '';
  const d=(cur||0)-(prev||0);
  const cls = neutral ? 'same' : (d>0?'up':(d<0?'down':'same'));
  const txt = (d>0?'+':'')+(unit==='t'? (d/1000).toFixed(1)+'t' : (Math.round(d*10)/10)+(unit||''));
  return `<span class="wk-delta ${cls}">${txt}</span>`;
}

  return topbar('Your statistics')+`<div class="pad">

    </div>

    <div class="row" style="gap:12px;align-items:stretch;margin-top:12px">
      <div class="card stat-tile">
        <div class="display stat-num" style="color:var(--accent)">${rEinheiten}</div>
        <div class="faint stat-lbl">Einheiten</div></div>
      <div class="card stat-tile">
        <div class="display stat-num">${rSets}</div>
        <div class="faint stat-lbl">Sätze</div></div>
      <div class="card stat-tile">
        <div class="display stat-num">${(rVol/1000).toFixed(1)}<span style="font-size:15px;color:var(--text-dim)">t</span></div>
        <div class="faint stat-lbl">Volumen</div></div>
    </div>
    <p class="faint" style="font-size:10.5px;text-align:center;margin:6px 0 0;letter-spacing:.04em;text-transform:uppercase">${rangeLabel}</p>

    ${lw?`<div class="card" style="margin-top:14px">
      <div class="eyebrow" style="margin-bottom:12px">${per.titel}</div>
      <div class="wk-grid">
        <div class="wk-item"><span class="wk-val">${tw.e}</span>${deltaChip(tw.e,lw.e,'')}<span class="wk-lbl">Einheiten</span></div>
        <div class="wk-item"><span class="wk-val">${tw.s}</span>${deltaChip(tw.s,lw.s,'')}<span class="wk-lbl">Sätze</span></div>
        <div class="wk-item"><span class="wk-val">${(tw.v/1000).toFixed(1)}t</span>${deltaChip(tw.v,lw.v,'t')}<span class="wk-lbl">Volumen</span></div>
        <div class="wk-item"><span class="wk-val">${tw.r!=null?tw.r.toFixed(1):'–'}</span>${(tw.r!=null&&lw.r!=null)?deltaChip(tw.r,lw.r,'',true):''}<span class="wk-lbl">Ø RIR</span></div>

    <div class="card" style="margin-top:14px">
      <div class="eyebrow" style="margin-bottom:4px">Volumen pro Einheit</div>

      <div style="display:flex;align-items:flex-end;gap:6px;height:130px">
        ${recent.map(l=>{const v=logVolume(l);const h=Math.max(v/maxV*100,4);
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%">

      ${mArr.length? mArr.map(([m,v])=>`<div style="margin-bottom:11px">

        </select></div>

    </div>

// Fortschritt einer Übung: Volumen pro Training als Kurve + Tabelle aller Werte
function renderExerciseProgress(key){
  const el=document.getElementById('strChart'); if(!el) return;
  // key ist entweder eine stabile exId oder 'name:<Name>' (Altdaten ohne ID).
  const byName = key && key.indexOf('name:')===0;
  const exId = byName ? null : key;
  const name = byName ? key.slice(5) : (exMetaById(key) ? exMetaById(key).n : key);
  const rows=[];
  const f=exFactor(name, exId);
  DB.logs.forEach(l=>{
    // Übung im Log per ID finden (Altdaten per Name).
    const e=l.exercises.find(x=> (exId && x.exId===exId) || x.name===name);
    if(e){
      const done=e.sets.filter(s=>s.done!==false);
      const vol=done.reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
      const topW=done.reduce((m,s)=>Math.max(m,(+s.weight||0)*f),0);
      const setStr=done.map(s=>`${(+s.weight||0)*f}×${+s.reps||0}`).join(', ');
      const rirVals=done.filter(s=>s.rir!=null&&s.rir!=='').map(s=>+s.rir);
      const rir=rirVals.length? rirVals.reduce((a,b)=>a+b,0)/rirVals.length : null;
      if(vol>0) rows.push({date:l.date, vol, topW, sets:done.length, setStr, rir});
    }
  });
  if(rows.length<1){ el.innerHTML=`<div class="faint" style="font-size:12.5px;padding:14px 0">Für diese Übung liegen noch keine Trainingsdaten vor.</div>`; return; }

  // Kurve (nur ab 2 Punkten sinnvoll)
  let chart='';
  if(rows.length>=2){
    const vols=rows.map(r=>r.vol);
    const max=Math.max(...vols), min=Math.min(...vols), range=max-min||1;
    const W=100, H=90;
    const path=rows.map((r,i)=>{const x=i/(rows.length-1)*W;const y=H-((r.vol-min)/range)*H;return `${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');
    const area=`M0,${H} `+rows.map((r,i)=>{const x=i/(rows.length-1)*W;const y=H-((r.vol-min)/range)*H;return `L${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ')+` L${W},${H} Z`;
    const first=rows[0].vol, last=rows[rows.length-1].vol, diff=last-first;
    const pct=first? Math.round(diff/first*100):0;
    chart=`<div class="row between" style="margin:8px 0 10px">
        <span class="faint" style="font-size:12px">${rows.length} Trainings</span>
        <span class="pill ${diff>0?'up':diff<0?'down':'same'}">${diff>0?'+':''}${(diff/1000).toFixed(1)}t · ${pct>0?'+':''}${pct}%</span></div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:120px;overflow:visible">
        <defs><linearGradient id="volgrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
        <path d="${area}" fill="url(#volgrad)" stroke="none"/>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
        ${rows.map((r,i)=>{const x=i/(rows.length-1)*W;const y=H-((r.vol-min)/range)*H;return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="var(--accent)" vector-effect="non-scaling-stroke"/>`;}).join('')}
      </svg>`;
  }

  // Tabelle aller Werte (neueste zuerst)
  const table=`<div class="prog-table">
    <div class="prog-row prog-head"><span>Datum</span><span>Sätze</span><span>Top-kg</span><span>Ø RIR</span><span>Volumen</span></div>
    ${[...rows].reverse().map(r=>`<div class="prog-row" title="${esc(r.setStr)}">
      <span>${fmtDate(r.date)}</span>
      <span class="num">${r.sets}</span>
      <span class="num">${r.topW} kg</span>
      <span class="num faint">${r.rir!=null? (Math.round(r.rir*10)/10) : '–'}</span>
      <span class="num" style="font-weight:700;color:var(--accent-dim)">${r.vol.toLocaleString('de-DE')} kg</span>
    </div>`).join('')}
  </div>`;

  el.innerHTML=chart+table;
}

let _pickCb=null, _pickSearch='', _pickMuscle='', _pickEquip='', _pickOwn=false, _filtersOpen=false;
let _pickMuscleDetail='', _pickMuscleSearch='';   // Filter auf einzelne Muskeln
// Geräte-Filter: die feste Auswahlliste, ergänzt um alles, was in eigenen Übungen vorkommt
function equipList(){
  const base=(typeof CUSTOM_EQUIP!=='undefined')?CUSTOM_EQUIP:[];
  const used=customList().map(e=>e.eq).filter(Boolean);
  return [...new Set([...base, ...used])].sort();
}

function openExercisePicker(cb){ _pickCb=cb; _pickSearch=''; _pickMuscle=''; _pickEquip=''; _pickOwn=false; _filtersOpen=false; _pickMuscleDetail=''; _pickMuscleSearch=''; renderPicker(); }

function filterList(){
  const t=(_pickSearch||'').toLowerCase().trim();
  return EXDB.filter(e=>{
    if(_pickOwn && !e._.custom) return false;
    if(_pickMuscle && e.m!==_pickMuscle) return false;
    if(_pickEquip && e.t!==_pickEquip) return false;
    // Filter auf einen einzelnen Muskel: zählt als Treffer, wenn er primär
    // ODER sekundär beansprucht wird.
    if(_pickMuscleDetail){
      const alle=(e._.pm||[]).concat(e._.sm||[]);
      if(!alle.includes(_pickMuscleDetail)) return false;
    }
    if(t){
      const hay=(e.n+' '+e.m+' '+e._.pm.join(' ')+' '+e._.sm.join(' ')+' '+e.t).toLowerCase();
      if(!hay.includes(t)) return false;
    }
    return true;
  });
}

// Deutsch -> Englisch für Regionen und Einzelmuskeln

const EX_RENAME={
  'Schrägbankdrücken mit KH':'Incline Dumbbell Press',
  'Flachbankdrücken mit KH':'Flat Dumbbell Press',
  'Fliegende mit KH':'Dumbbell Fly',
  'KH-Rudern beidarmig':'Two-Arm Dumbbell Row',

  'KH-Kreuzheben (gestreckt)':'Stiff-Leg Dumbbell Deadlift',
  'Wadenheben mit KH':'Standing Dumbbell Calf Raise',
  'Wadenheben sitzend':'Seated Dumbbell Calf Raise'
};
function migrateToEnglish(){
  let changed=false;

  // 1) Übungen: umbenennen, Region/Muskeln übersetzen, Primär/Sekundär neu setzen
  (DB.customEx||[]).forEach(e=>{
    const newName=EX_RENAME[e.n];
    if(newName){ e.n=newName; changed=true; }
    if(e.g && EN_MUSCLE[e.g]){ e.g=EN_MUSCLE[e.g]; changed=true; }
    if(Array.isArray(e.pm)){
      const t=e.pm.map(toEnMuscle);
      if(t.join('|')!==e.pm.join('|')){ e.pm=t; changed=true; }
    }
    if(Array.isArray(e.sm)){
      const t=e.sm.map(toEnMuscle);
      if(t.join('|')!==e.sm.join('|')){ e.sm=t; changed=true; }
    }
    // Feste Neueinteilung anwenden (nach dem Umbenennen greift der englische Name)
    const rc=EX_RECLASSIFY[e.n];
    if(rc){
      const pmNew=rc.pm.join('|'), smNew=rc.sm.join('|');
      if((e.pm||[]).join('|')!==pmNew){ e.pm=rc.pm.slice(); changed=true; }
      if((e.sm||[]).join('|')!==smNew){ e.sm=rc.sm.slice(); changed=true; }
      if(e.g!==rc.g){ e.g=rc.g; changed=true; }
    }
  });

  // Index neu aufbauen, damit exMetaById unten die neuen Namen/Regionen kennt
  rebuildExDB();

  // 2) Regionen in Plänen und Logs übersetzen (dort steht die Körperregion)
  (DB.plans||[]).forEach(p=>(p.days||[]).forEach(d=>(d.exercises||[]).forEach(e=>{
    if(e.muscle && EN_MUSCLE[e.muscle]){ e.muscle=EN_MUSCLE[e.muscle]; changed=true; }
    // Anzeigenamen im Plan aktualisieren. Bevorzugt über die stabile exId – so
    // werden auch abweichende Altnamen erfasst, die in keiner Umbenennungsliste stehen.
    const meta=e.exId?exMetaById(e.exId):null;
    if(meta && e.name!==meta.n){ e.name=meta.n; changed=true; }
    else if(!meta && e.name && EX_RENAME[e.name]){ e.name=EX_RENAME[e.name]; changed=true; }
    // Region am Primärmuskel der Übung ausrichten (z. B. Enges Drücken -> Arms)
    if(meta && meta.g && e.muscle!==meta.g){ e.muscle=meta.g; changed=true; }
  })));
  (DB.logs||[]).forEach(l=>(l.exercises||[]).forEach(e=>{
    if(e.muscle && EN_MUSCLE[e.muscle]){ e.muscle=EN_MUSCLE[e.muscle]; changed=true; }
    // Übungsnamen in Logs bleiben historisch stehen – nur die Region wird übersetzt,
    // damit die Statistik nicht in "Beine" und "Legs" zerfällt.
  }));

  // 3) Eigene Muskeln in den Einstellungen übersetzen und Duplikate entfernen
  if(DB.settings && Array.isArray(DB.settings.customMuscles)){
    const before=DB.settings.customMuscles.join('|');
    DB.settings.customMuscles=DB.settings.customMuscles
      .map(toEnMuscle)
      .filter((m,i,a)=>!SECONDARY_MUSCLES.includes(m) && a.indexOf(m)===i);
    if(DB.settings.customMuscles.join('|')!==before) changed=true;
  }

  if(changed){ rebuildExDB(); save(); console.log('[Migration] Auf englische Taxonomie umgestellt'); }
}
// Einmalige Migration: trägt allen Übungen in bestehenden Logs und Plänen ihre
// stabile exId nach (per Namensauflösung). Danach überlebt die Verknüpfung ein
// Umbenennen der Übung. Läuft bei jedem Laden, ist aber idempotent (macht nichts,
// wenn schon alle IDs gesetzt sind) und verändert Altdaten nicht destruktiv:
// der Name bleibt als Anzeige-Text erhalten.
function migrateExerciseIds(){
  let changed=false, linked=0, unmatched=0;
  const fix=(exArr)=>{
    (exArr||[]).forEach(e=>{
      if(e.exId) return;                 // schon verknüpft
      const id=exIdForName(e.name);      // passende Übung per Namen suchen
      if(id){ e.exId=id; linked++; changed=true; }
      else { unmatched++; }              // keine Übung dieses Namens (mehr) vorhanden
    });
  };
  (DB.logs||[]).forEach(l=>fix(l.exercises));
  (DB.plans||[]).forEach(p=>(p.days||[]).forEach(d=>fix(d.exercises)));
  if(changed){ save(); }
  // Für Debug/Transparenz im Log (stört den Nutzer nicht)
  if(linked||unmatched) console.log(`[Migration] Übungs-IDs verknüpft: ${linked}, ohne Treffer: ${unmatched}`);
}
const MAX_IMG_BYTES=1_500_000; // ~1,5 MB Warnschwelle für hochgeladene Bilder

function openCustomExercise(id){
  if(!CUSTOM_RETURN) CUSTOM_RETURN=captureReturn();   // wohin nach dem Speichern zurück?
  const src = id ? (customList().find(e=>e.id===id)) : null;
  CUSTOM = src ? JSON.parse(JSON.stringify(src)) : {
    id:uid(), custom:true, n:'', g:MUSCLES[0], eq:CUSTOM_EQUIP[0], bench:'', dumbbells:2,
    pm:[], sm:[], cat:'', lvl:'', frc:'', ins:[], img:[], imgMode:'file'
  };
  if(CUSTOM.dumbbells!==1 && CUSTOM.dumbbells!==2) CUSTOM.dumbbells = 2;
  if(!Array.isArray(CUSTOM.sm)) CUSTOM.sm=[];
  if(!Array.isArray(CUSTOM.pm)) CUSTOM.pm=[];
  // Alle bekannten Muskeln (eingebaute + selbst hinzugefügte) sind Kacheln.
  // Sollte eine Übung noch einen Muskel enthalten, der (noch) keine Kachel ist, wird er ergänzt.
  CUSTOM.sm.forEach(m=>{ if(!allMuscles().includes(m)) addCustomMuscle(m, true); });
  CUSTOM.pm.forEach(m=>{ if(!allMuscles().includes(m)) addCustomMuscle(m, true); });
  CUSTOM._smChips = CUSTOM.sm.slice();
  // Primärmuskeln: bei Altdaten stand hier teils nur die Körperregion – die
  // ist keine Muskel-Kachel und wird daher nicht vorausgewählt.
  CUSTOM._pmChips = CUSTOM.pm.filter(m=>allMuscles().includes(m));
  if(!CUSTOM.imgMode) CUSTOM.imgMode = (CUSTOM.img[0]&&/^https?:/i.test(CUSTOM.img[0]))?'url':'file';
  CUSTOM._isEdit = !!id;
  renderCustomForm(!!id);
}
/* ---- Muskel-Kacheln: eingebaute + eigene (dauerhaft gemerkt) ---- */
function customMuscles(){
  if(!DB.settings) DB.settings={};
  if(!Array.isArray(DB.settings.customMuscles)) DB.settings.customMuscles=[];
  return DB.settings.customMuscles;
}
function allMuscles(){ return SECONDARY_MUSCLES.concat(customMuscles()); }
function addCustomMuscle(name, silent){
  name=(name||'').trim();
  if(!name) return false;
  const all=allMuscles();
  if(all.some(m=>m.toLowerCase()===name.toLowerCase())){
    if(!silent) toast('Dieser Muskel ist bereits vorhanden');
    return false;
  }
  customMuscles().push(name);
  if(!silent) save();
  return true;
}
function addMuscleFromInput(){
  const el=document.getElementById('cxNewMuscle');
  const name=el?el.value.trim():'';
  if(!name) return;
  if(addCustomMuscle(name)){
    // neu angelegte Muskeln gleich für diese Übung auswählen
    (CUSTOM._smChips||(CUSTOM._smChips=[])).push(name);
    renderCustomForm(!!CUSTOM._isEdit);
  }
}
function deleteCustomMuscle(name){
  const liste=customMuscles();
  const idx=liste.indexOf(name);
  if(idx<0) return;
  // War der Muskel im offenen Formular ausgewählt? Nur dann darf die Rücknahme
  // ihn wieder auswählen – sonst erschiene er plötzlich als gewählt.
  const warSek = !!(CUSTOM && Array.isArray(CUSTOM._smChips) && CUSTOM._smChips.includes(name));
  const warPrim= !!(CUSTOM && Array.isArray(CUSTOM._pmChips) && CUSTOM._pmChips.includes(name));

  liste.splice(idx,1);
  if(CUSTOM && Array.isArray(CUSTOM._smChips)) CUSTOM._smChips=CUSTOM._smChips.filter(m=>m!==name);
  if(CUSTOM && Array.isArray(CUSTOM._pmChips)) CUSTOM._pmChips=CUSTOM._pmChips.filter(m=>m!==name);
  save();
  if(CUSTOM) renderCustomForm(!!CUSTOM._isEdit);

  registerUndo(`„${name}“ entfernt`, ()=>{
    const l=customMuscles();
    l.splice(Math.min(idx, l.length), 0, name);
    // CUSTOM kann inzwischen null sein (Formular geschlossen) – dann gibt es
    // keine Auswahl mehr, die wiederherzustellen wäre.
    if(CUSTOM){
      if(warSek && Array.isArray(CUSTOM._smChips)) CUSTOM._smChips.push(name);
      if(warPrim && Array.isArray(CUSTOM._pmChips)) CUSTOM._pmChips.push(name);
      renderCustomForm(!!CUSTOM._isEdit);
    }
  });
}
function toggleSecMuscle(m){
  const arr=CUSTOM._smChips||(CUSTOM._smChips=[]);
  const i=arr.indexOf(m);
  if(i>=0) arr.splice(i,1);
  else {
    arr.push(m);
    // Ein Muskel kann nicht gleichzeitig primär und sekundär sein
    CUSTOM._pmChips=(CUSTOM._pmChips||[]).filter(x=>x!==m);
  }
  renderCustomForm(!!CUSTOM._isEdit);
}
function togglePrimMuscle(m){
  const arr=CUSTOM._pmChips||(CUSTOM._pmChips=[]);
  const i=arr.indexOf(m);
  if(i>=0) arr.splice(i,1);
  else {
    arr.push(m);
    CUSTOM._smChips=(CUSTOM._smChips||[]).filter(x=>x!==m);
  }
  renderCustomForm(!!CUSTOM._isEdit);
}
