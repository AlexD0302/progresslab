<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Make FMC Fit Again</title>

<meta name="theme-color" content="#0a0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Make FMC Fit Again">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312151c'/%3E%3Cg stroke='%23c8ff00' stroke-width='3.4' stroke-linecap='round' fill='none'%3E%3Cpath d='M20 22v20M44 22v20M13 27v10M51 27v10M20 32h24'/%3E%3C/g%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>

:root{
  --bg:#0a0c10;
  --surface:#12151c;
  --surface-2:#1a1f29;
  --surface-3:#232a37;
  --line:#2a3240;
  --line-soft:#1f2530;
  --text:#eef2f7;
  --text-dim:#9aa6b8;

  --text-faint:#7d8ca6;
  --accent:#c8ff00;
  --accent-dim:#8fb300;
  --accent-glow:rgba(200,255,0,.18);
  --blue:#3d9bff;
  --red:#ff5c5c;
  --amber:#ffb43d;
  --green:#37d99a;

  --img-bg:#fff;
  --measure:#ff3b3b;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 8px 30px rgba(0,0,0,.45);
  --font-display:'Barlow Condensed',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,h4,.display{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;line-height:1.05}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.input:focus-visible,.chip:focus-visible,.btn-slim:focus-visible,.sync-badge:focus-visible{outline-offset:3px}

::selection{background:var(--accent-glow);color:var(--text)}
input,textarea,select{caret-color:var(--accent)}
input,select{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:100px}

body.in-session{overflow:hidden}

body.in-session #app{padding-bottom:0;min-height:0;height:100vh;height:100dvh;display:flex;flex-direction:column}

body.in-session{--nav-space:96px;--timer-space:0px}
body.in-session.timer-on{--timer-space:78px}
.sess{
  display:flex;flex-direction:column;
  height:100vh;
  height:100dvh;
  padding:14px 20px calc(var(--nav-space) + var(--timer-space) + env(safe-area-inset-bottom));
  gap:10px;box-sizing:border-box;
}
.sess-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.sess-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  padding:7px 11px;border-radius:9px;background:transparent;border:1px solid var(--line);color:var(--text-dim);transition:all .12s}
.sess-btn svg{width:14px;height:14px;stroke-width:2.4}

.sess-btn{position:relative}
.sess-btn::after{content:"";position:absolute;inset:-9px 0}
.sess-arrow{position:relative}
.sess-arrow::after{content:"";position:absolute;inset:-3px}
.ex-card .add-set,.add-set{position:relative}
.add-set::after{content:"";position:absolute;inset:-6px 0}

.sess-dot{position:relative}
.sess-dot::after{content:"";position:absolute;inset:-17px -3px}
.sess-btn.solid{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.sess-btn.danger{color:var(--red);border-color:rgba(255,92,92,.3)}

.sess-clock{font-family:var(--font-display);font-size:15px;font-weight:700;
  color:var(--text-dim);font-variant-numeric:tabular-nums;letter-spacing:.02em;
  line-height:1;padding:0 10px;display:inline-flex;align-items:center;
  border-radius:9px;background:transparent;border:1px solid var(--line);
  white-space:nowrap;flex-shrink:0}

.sess-clock{gap:7px}
.sess-sep{color:var(--line);font-weight:400}
.sess-dur{color:var(--accent)}

@media (max-width:430px){
  .sess-btn.danger span{display:none}
  .sess-btn.danger{padding:0 11px}
}

.row.sess-ctls{align-items:stretch}
.sess-btn:active{transform:scale(.95)}
.sess-vol{flex-shrink:0;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:11px 14px}
.sess-bar{height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.sess-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

.cmp{border:1px solid rgba(200,255,0,.22);border-radius:12px;padding:12px 13px;margin-bottom:16px;
  background:var(--surface-2);box-shadow:0 0 24px rgba(200,255,0,.10)}
.cmp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.cmp-sum{font-family:var(--font-display);font-size:17px;color:var(--text-dim);letter-spacing:.01em}
.cmp-sum b{color:var(--text)}

.cmp-basis{font-size:11px;color:var(--text-faint);margin:2px 0 10px}
.cmp-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
.cmp-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-dim)}
.cmp-num{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--text)}
.cmp-delta{flex:0 0 auto;font-size:11px;font-weight:700;padding:0 7px;border-radius:5px;line-height:1.6}
.cmp-delta.up{color:var(--accent);background:var(--accent-glow)}
.cmp-delta.down{color:var(--red);background:rgba(255,92,92,.12)}
.cmp-delta.same{color:var(--text-faint);background:var(--surface-3)}
.cmp-extra{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.cmp-extra-t{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-faint);font-weight:700;margin-bottom:3px}
.cmp-empty{font-size:12.5px;color:var(--text-faint);margin-bottom:16px}

.vc{flex-shrink:0;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft)}
.vc-title{display:flex;align-items:center;justify-content:space-between;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);font-weight:600;margin-bottom:8px}

.vc-delta{font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;padding:0 7px;border-radius:5px;line-height:1.6}
.vc-delta.up{color:var(--accent);background:var(--accent-glow)}
.vc-delta.down{color:var(--red);background:rgba(255,92,92,.12)}
.vc-delta.same{color:var(--text-dim);background:var(--surface-3)}

.summary-rec{margin-top:14px;padding:11px 13px;border-radius:var(--radius-sm);
  background:var(--accent-glow);border:1px solid var(--accent-dim)}

.bil-sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
.bil-ex{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:9px;
  padding:5px 0;font-size:12.5px}
.bil-ex+.bil-ex{border-top:1px solid var(--line-soft)}
.bil-ex-name{color:var(--text-dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bil-ex-val{color:var(--text);font-weight:700;white-space:nowrap}

.bil-rec+.bil-rec{margin-top:9px;padding-top:9px;border-top:1px solid var(--accent-dim)}
.bil-rec-name{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bil-rec-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12.5px;padding:2px 0}
.bil-rec-reps{color:var(--text-dim);white-space:nowrap}

.dlg-ico{display:inline-flex;align-items:center;flex-shrink:0}
.dlg-ico svg{width:19px;height:19px;stroke-width:2.2}
.vc-row{display:grid;grid-template-columns:48px 1fr 74px;align-items:center;gap:9px;margin-bottom:5px}
.vc-row:last-child{margin-bottom:0}
.vc-lbl{font-size:11px;color:var(--text-faint);font-weight:600}
.vc-track{height:7px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.vc-fill{height:100%;border-radius:4px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.vc-fill.now{background:var(--accent)}
.vc-fill.prev{background:var(--text-faint);opacity:.55}
.vc-val{font-size:11px;font-weight:700;color:var(--text);text-align:right;white-space:nowrap}
.vc-val.prev{color:var(--text-faint);font-weight:600}

.sess-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:stretch;overflow:hidden}
.ex-card{flex:0 1 auto;min-height:0;max-height:100%;display:flex;flex-direction:column;
  margin:0;overflow:hidden;width:100%}

.ex-card .ex-preview{flex:0 0 auto;margin:10px 0 12px;width:100%;
  height:var(--img-max,300px);display:flex;align-items:center;justify-content:center;

  background:var(--img-bg)}

.ex-card .ex-preview img{width:100%;height:100%;object-fit:contain;display:block}

.ex-preview.bad{background:var(--surface-2)}

.ex-sets{scroll-snap-type:y mandatory}
.ex-sets .set-block{scroll-snap-align:start}
.ex-sets{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;

  scrollbar-gutter:stable;padding-right:2px}

.ex-sets::-webkit-scrollbar{width:6px}
.ex-sets::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.ex-sets::-webkit-scrollbar-track{background:transparent}

.ex-card.scroll-all{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.ex-card.scroll-all .ex-sets{overflow:visible;max-height:none;flex:0 0 auto}

.ex-main{display:flex;flex-direction:column;min-height:0;flex:0 1 auto}
.ex-col{display:flex;flex-direction:column;min-height:0;flex:0 1 auto}

.ex-main.no-image .ex-col{max-width:560px;width:100%;margin-inline:auto}

.ex-card.no-image{margin-block:auto}

@media (min-width:900px) and (max-height:820px){

  #app{max-width:1100px}
  body .nav{max-width:1060px;width:calc(100% - 40px)}
  body .rest-timer{max-width:1060px;width:calc(100% - 40px)}
  .sess{padding-left:20px;padding-right:20px}

  .ex-card{flex:1 1 auto !important;height:100%;max-height:100% !important}

  .ex-main{flex-direction:row;align-items:stretch;gap:22px;flex:1 1 auto;min-height:0}
  .ex-card .ex-preview{
    flex:0 0 44%;max-width:48%;margin:8px 0 0;
    max-height:none !important;height:auto;align-self:stretch;min-height:0;
  }

  .ex-card .ex-preview img{max-height:100% !important;max-width:100%;
    height:100%;width:100%;object-fit:contain}
  .ex-col{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column}

  .ex-sets{max-height:var(--sets-max,none) !important;flex:1 1 auto;overflow-y:auto}

  .ex-col .vc{flex:0 0 auto;margin-top:auto;padding-top:8px}
  .ex-col .vc .vc-row{margin-bottom:3px}

}

@media (min-width:900px) and (max-height:720px),
       (min-width:900px) and (max-height:900px) and (display-mode: standalone),
       (min-width:900px) and (max-height:900px) and (display-mode: fullscreen){

  body.in-session{--nav-space:66px;--timer-space:0px}
  body.in-session.timer-on{--timer-space:58px}

  body.in-session #app{height:100vh}
  .sess{height:100vh;padding-top:8px;gap:6px}

  .sess-head{gap:8px}
  .sess-btn{padding:5px 9px;font-size:11px}

  .sess-vol{padding:7px 11px}

  .ex-card{flex:1 1 auto;height:auto;max-height:100% !important;min-height:0}
  .ex-main{gap:16px;min-height:0}

  .ex-card .ex-preview{align-self:stretch !important;margin:0;min-height:0;
    flex:0 0 44%;max-width:48%;width:auto;height:auto;
    max-height:100% !important;
    display:flex;align-items:center;justify-content:center;
    padding:4px 4px 8px;overflow:hidden}

  .ex-card .ex-preview img{max-height:100% !important;max-width:100%;
    width:100%;height:100%;object-fit:contain;display:block}

  .ex-sets{flex:1 1 0;min-height:0;overflow-y:auto}

  .ex-col .vc{margin-top:6px;padding-top:6px}
  .vc-title{margin-bottom:5px}
  .vc-row{margin-bottom:3px}

  .sess-nav{padding-top:0}
  .sess-arrow{width:32px;height:32px}
  .sess-arrow svg{width:16px;height:16px}
  .sess-dot{width:7px;height:7px}

  body .nav{margin-bottom:calc(6px + env(safe-area-inset-bottom));padding:5px}

  body .nav button{padding:5px 2px;min-height:0;font-size:9px;gap:1px}
  body .nav button svg{width:17px;height:17px}

  body .rest-timer{bottom:calc(60px + env(safe-area-inset-bottom))}
  .rt-body{padding:7px 11px}
  .rt-time{font-size:20px}
  .rt-ico svg{width:20px;height:20px}

  .ex-card .prev-grid{display:none}
  .set-vol .sv-prevset{display:inline}
  .set-vol .sv-prevset + .sv-sep{display:inline}

  .ex-card .set-block{margin-bottom:5px}

  .set-vol{margin-top:2px;min-height:13px}
  .sv-inner{gap:5px}
  .ex-card .in-unit .input{padding:9px 26px 9px 9px}
  .ex-card{--satz-gap:7px}
  .ex-card .set-grid{gap:7px}

  .ex-col .vc{margin-top:7px;padding-top:7px}
  .vc-title{margin-bottom:5px}
  .vc-row{margin-bottom:3px}
}

@media (min-width:900px) and (max-height:620px){
  .ex-card .ex-sec{display:none}
  .ex-card .set-block{margin-bottom:4px}
  .ex-card .in-unit .input{padding:8px 26px 8px 9px}

  .ex-card .add-set{padding:7px}
  .ex-col .vc{margin-top:5px;padding-top:5px}
  .vc-title{margin-bottom:3px}

  .ex-card{--satz-cols:20px 1fr 1fr 46px 40px}
  .ex-card .set-grid{grid-template-columns:20px 1fr 1fr 46px 40px}
  .ex-card .set-grid > button.chip{width:40px !important;height:40px !important}

  body.timer-on .ex-col .vc{display:none}
}

.sess-nav{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:12px;padding-top:2px}
.sess-nav-spacer{flex-shrink:0;height:2px}
.sess-arrow{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;
  background:transparent;border:1px solid var(--line);color:var(--text-dim);transition:all .12s}
.sess-arrow:not(:disabled):hover{background:var(--surface-2);color:var(--text)}
.sess-arrow svg{width:19px;height:19px;stroke-width:2.4}
.sess-arrow:disabled{opacity:.3}
.sess-arrow:not(:disabled):active{transform:scale(.92);background:var(--surface-3)}
.sess-dots{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center;max-width:60%}
.sess-dot{width:9px;height:9px;border-radius:50%;background:var(--surface-3);border:1px solid var(--line);transition:all .18s;padding:0}
.sess-dot.done{background:var(--accent-dim);border-color:var(--accent-dim)}
.sess-dot.on{width:24px;border-radius:5px;background:var(--accent);border-color:var(--accent)}
.sess-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

.bld-modal{display:flex;flex-direction:column;height:92vh;max-height:92vh;height:92dvh;max-height:92dvh;overflow:hidden;flex-shrink:0}
.bld{display:flex;flex-direction:column;flex:1;min-height:0;gap:12px}
.bld-head{flex-shrink:0}
.bld-page{flex:1;min-height:0;display:flex}
.bld-card{flex:1;min-height:0;display:flex;flex-direction:column;margin:0;padding:14px}
.bld-dayname{padding:8px 10px;font-weight:700;background:transparent;border-color:transparent;min-width:0;flex:1}
.bld-dayname:focus{background:var(--surface-2);border-color:var(--accent-dim)}

.bld-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
  margin:0 -4px;padding:0 4px}

.bld-nav{flex-shrink:0;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:8px;min-height:38px}
.bld-navmid{display:flex;align-items:center;justify-content:center;gap:8px}
.bld-nav > .bld-addbtn:first-child{justify-self:start}
.bld-nav > .bld-addbtn:last-child{justify-self:end}
.bld-addbtn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  padding:9px 12px;border-radius:11px;background:transparent;border:1px solid var(--accent-dim);
  color:var(--accent);transition:all .12s;white-space:nowrap}
.bld-addbtn:hover{background:var(--accent-glow)}
.bld-addbtn:active{transform:scale(.97)}
.bld-addbtn:disabled{opacity:.4;cursor:default}
.bld-addbtn svg{width:15px;height:15px;flex-shrink:0}

@media (max-width:430px){
  .bld-nav{gap:5px}
  .bld-addbtn{padding:8px 9px;font-size:11.5px;gap:4px}
  .bld-navmid{gap:5px}
}

.ex-card.prev-kompakt .prev-grid{display:none}
.ex-card.prev-kompakt .set-vol .sv-prevset{display:inline}
.ex-card.prev-kompakt .set-vol .sv-prevset + .sv-sep{display:inline}

.ex-card{padding:14px 16px}
.ex-card .set-block{margin-bottom:8px}

.ex-card .add-set{margin-top:6px;padding:9px;flex-shrink:0}

.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--bg) 60%,transparent);
  padding:18px 20px 12px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:9px}

.sync-badge{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
  padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700;
  background:transparent;border:1px solid var(--line);color:var(--text-dim);
  transition:all .15s;max-width:46%}

.next-card{display:block;width:100%;text-align:left;margin-top:22px;
  background:var(--accent);color:var(--bg);border:none;border-radius:var(--radius);
  padding:15px 17px;box-shadow:0 6px 22px rgba(200,255,0,.14);transition:transform .12s,box-shadow .2s}
.next-card:hover{box-shadow:0 8px 28px rgba(200,255,0,.22)}
.next-card:active{transform:scale(.99)}
.next-lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  opacity:.62;margin-bottom:5px}

.next-card .faint{color:rgba(10,12,16,.72)}
.next-card .display{color:var(--bg)}
.next-go{display:grid;place-items:center;width:38px;height:38px;flex-shrink:0;
  border-radius:50%;background:rgba(10,12,16,.14)}
.next-go svg{width:19px;height:19px;stroke-width:2.4}

.topbar-ico{position:relative;width:30px;height:30px;margin-left:auto;margin-right:8px;display:grid;place-items:center;
  border-radius:9px;color:var(--text-faint);flex-shrink:0;transition:color .15s,background .15s}
.topbar-ico::after{content:"";position:absolute;inset:-7px;border-radius:12px}
.topbar-ico:hover{color:var(--text-dim);background:var(--surface-2)}
.topbar-ico svg{width:17px;height:17px;stroke-width:2}

.sync-badge{position:relative}
.sync-badge::after{content:"";position:absolute;inset:-7px;border-radius:inherit}
.sync-badge:hover{background:var(--surface-2)}
.sync-badge:active{transform:scale(.95)}
.sync-badge svg{width:14px;height:14px;stroke-width:2;flex-shrink:0}
.sync-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-badge.ok{color:var(--accent-dim);border-color:rgba(200,255,0,.22)}
.sync-badge.busy{color:var(--text-dim)}
.sync-badge.busy .sync-ico{animation:spin 1.1s linear infinite;display:inline-flex}
.sync-badge.err{color:var(--red);border-color:rgba(255,92,92,.3)}
.sync-badge.off{color:var(--text-faint)}
@keyframes spin{to{transform:rotate(360deg)}}

.auth-err{background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.28);color:var(--red);
  font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:9px;margin-bottom:14px}

.cf-opt{display:block;width:100%;text-align:left;background:var(--surface-2);
  border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;transition:all .15s}
.cf-opt:hover{border-color:var(--accent-dim)}
.cf-opt:active{transform:scale(.99)}
.cf-title{display:flex;align-items:center;justify-content:space-between;
  font-weight:700;font-size:14.5px;color:var(--text)}
.cf-title svg{width:16px;height:16px;color:var(--text-faint)}
.cf-sub{font-size:12.5px;color:var(--text-dim);margin-top:5px}
.cf-when{font-size:11px;color:var(--text-faint);margin-top:3px}
.brand .mark{
  width:30px;height:30px;border-radius:8px;
  background:var(--surface);border:1px solid var(--line);
  flex-shrink:0;display:grid;place-items:center;
  box-shadow:0 0 16px var(--accent-glow);
}
.brand .mark svg{width:19px;height:19px;color:var(--accent);stroke-width:2.2}
.brand .name{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.02em}
.brand .name b{color:var(--accent)}
.topbar .sub{font-size:11px;color:var(--text-faint);letter-spacing:.18em;text-transform:uppercase;margin-top:-3px}

.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);

  width:calc(100% - 40px);max-width:480px;z-index:50;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  margin-bottom:calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 4px 24px rgba(0,0,0,.55);
  display:flex;padding:8px;
}

.nav-fade{
  position:fixed;bottom:0;left:0;right:0;z-index:49;pointer-events:none;
  height:calc(104px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom, rgba(10,12,16,0) 0%, rgba(10,12,16,.85) 45%, var(--bg) 80%);
}
body.in-session .nav-fade{display:none}
.nav button{
  flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:8px 2px;border-radius:10px;color:var(--text-faint);
  font-size:9.5px;font-weight:600;letter-spacing:.02em;transition:color .18s;
}
.nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button svg{width:20px;height:20px;stroke-width:2}
.nav button.on{color:var(--accent)}
.nav button.on svg{filter:drop-shadow(0 0 6px var(--accent-glow))}

.rest-timer{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);
  bottom:calc(84px + env(safe-area-inset-bottom));
  width:calc(100% - 40px);max-width:480px;z-index:60;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s}
.rest-timer.show{transform:translateX(-50%) translateY(0);opacity:1}
.rt-bar{height:4px;background:var(--surface-3)}
.rt-fill{height:100%;background:var(--accent);transition:width 1s linear}
.rt-fill.done{background:var(--green);transition:none}
.rt-body{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px}
.rt-left{display:flex;align-items:center;gap:11px;min-width:0}
.rt-ico{color:var(--accent);display:inline-flex}
.rt-ico svg{width:24px;height:24px}
.rt-ico.done{color:var(--green)}
.rt-time{font-family:var(--font-display);font-size:24px;font-weight:800;line-height:1;color:var(--text)}
.rt-time.done{color:var(--green);font-size:18px}
.rt-label{font-size:11px;color:var(--text-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.rt-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.rt-btn{background:var(--surface-3);border:1px solid var(--line);color:var(--text-dim);
  font-size:13px;font-weight:700;padding:8px 10px;border-radius:9px;min-width:40px;transition:all .12s}
.rt-btn:hover{background:var(--line);color:var(--text)}
.rt-btn:active{transform:scale(.94)}
.rt-btn.icon{padding:8px;min-width:0;display:grid;place-items:center}
.rt-btn.icon svg{width:17px;height:17px;stroke-width:2.2}

.pad{padding:4px 20px calc(92px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px}

.card+.card{margin-top:14px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);font-weight:600}
.muted{color:var(--text-dim)}
.faint{color:var(--text-faint)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.hr{height:1px;background:var(--line-soft);margin:16px 0;border:0}

.btn{
  background:transparent;color:var(--accent);font-weight:700;
  border:1px solid var(--accent-dim);
  padding:11px 18px;min-height:44px;border-radius:var(--radius-sm);font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:all .15s;width:100%;
}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--accent-glow)}
.btn svg{width:16px;height:16px;stroke-width:2.4}
.btn.danger:hover{background:rgba(255,92,92,.1)}
.btn.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line-strong,var(--line));color:var(--text)}

.btn.ghost.acc{color:var(--accent);border-color:var(--accent-dim)}
.btn.ghost.acc:hover{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(255,92,92,.3)}
.btn.sm{padding:9px 14px;min-height:44px;font-size:13.5px;width:auto}
.btn.wauto{width:auto}

.btn-slim{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:44px;
  padding:10px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;
  background:transparent;border:1px solid var(--accent-dim);color:var(--accent);transition:all .15s}
.btn-slim svg{width:16px;height:16px;stroke-width:2.4}
.btn-slim:hover{background:var(--accent-glow)}
.btn-slim:active{transform:scale(.98)}
.btn-slim.solid{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn-slim.solid:hover{box-shadow:0 0 18px var(--accent-glow);background:var(--accent)}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:1px solid var(--line);
  padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--text-dim);
  transition:all .15s;
}

.chip[onclick]{min-height:44px;min-width:44px;justify-content:center}
.chip:hover{background:var(--surface-2);color:var(--text)}
.chip svg{width:15px;height:15px;stroke-width:2.2;flex-shrink:0}
.ic-bench{width:auto !important;height:13px !important;vertical-align:-1px;display:inline-block;flex-shrink:0}
.chip .ic-bench{height:15px !important;margin-right:-1px}
.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.add-set{margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:9px;border-radius:9px;background:transparent;border:1px dashed var(--line);
  color:var(--text-dim);font-size:13px;font-weight:600;transition:all .15s}
.add-set svg{width:15px;height:15px;stroke-width:2.4}
.add-set:hover{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-glow)}
.add-set:active{transform:scale(.99)}

.day-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
  padding:12px 14px;margin-bottom:8px;background:transparent;border:1px solid var(--line);
  border-radius:11px;transition:background .15s,border-color .15s}
.day-row:last-child{margin-bottom:0}
.day-row:hover{background:var(--surface-2);border-color:var(--accent-dim)}
.day-row:active{transform:scale(.99)}

.day-box{display:block;width:100%;min-height:44px;text-align:left;background:transparent;
  border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px;
  transition:background .15s,border-color .15s,transform .12s}
.day-box:last-of-type{margin-bottom:0}
.day-box:hover{background:var(--surface-2);border-color:var(--accent-dim)}
.day-box:active{transform:scale(.99)}
.day-arrow{display:inline-flex;color:var(--text-faint);flex-shrink:0}
.day-arrow svg{width:15px;height:15px}

select.input.pw-sel{width:auto;min-height:44px;padding:5px 21px 5px 9px;font-size:12px;font-weight:700;
  border-radius:9px;flex-shrink:0;background-position:right 6px center;
  background-color:transparent;color:var(--text-dim)}
.day-name{font-weight:700;font-size:15px;margin-bottom:2px}
.day-go{width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;border-radius:9px;
  background:var(--accent);color:var(--bg)}
.day-go svg{width:15px;height:15px}

.log-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.log-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;
  border-radius:9px;background:transparent;border:1px solid var(--line);
  color:var(--text-dim);font-size:12.5px;font-weight:600;transition:all .15s}
.log-btn svg{width:15px;height:15px;stroke-width:2;flex-shrink:0}
.log-btn:hover{background:var(--surface-2);color:var(--text)}
.log-btn:active{transform:scale(.97)}
.log-btn.danger{color:var(--red);border-color:rgba(255,92,92,.25)}
.log-btn.danger:hover{background:rgba(255,92,92,.1);color:var(--red)}

.cal-wrap{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:16px 14px;max-width:460px;margin:0 auto}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-title{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:.01em;text-transform:capitalize}
.cal-nav{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text-dim);
  font-size:20px;line-height:1;cursor:pointer;transition:all .12s;flex-shrink:0}
.cal-nav:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
.cal-nav:active:not(:disabled){transform:scale(.94)}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-nav svg{width:18px;height:18px;stroke-width:2.5}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:100%}
.cal-wd{margin-bottom:6px}
.cal-wdlbl{text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--text-faint);padding:2px 0}
.cal-cell{position:relative;aspect-ratio:1;min-height:44px;min-width:0;display:flex;align-items:center;justify-content:center;
  border-radius:10px;background:var(--surface-2);border:1px solid transparent}
.cal-cell.empty{background:transparent}
.cal-num{font-size:14px;font-weight:600;color:var(--text-dim);font-variant-numeric:tabular-nums}

.cal-cell.trained{
  background:var(--surface-2);
  border-color:rgba(200,255,0,.4);
  cursor:pointer;
  overflow:hidden;
  box-shadow:0 0 10px rgba(200,255,0,.22);
  transition:transform .12s, box-shadow .2s;
}
.cal-cell.trained::before{content:"";position:absolute;left:0;right:0;bottom:0;
  height:var(--fill,100%);background:var(--accent-glow);
  box-shadow:inset 0 0 8px rgba(200,255,0,.08);pointer-events:none}
.cal-cell.trained .cal-num{position:relative;z-index:1;color:var(--accent);font-weight:700}
.cal-cell.trained:hover{
  box-shadow:0 0 16px rgba(200,255,0,.4);
  transform:translateY(-1px);
}
.cal-cell.trained:active{transform:scale(.95)}

.cal-cell.today{border-color:var(--text-dim)}
.cal-cell.today.trained{border-color:var(--accent)}
.cal-cell.today .cal-num{color:var(--text)}
.cal-cell.today.trained .cal-num{color:var(--accent)}

.cal-badge{position:absolute;top:3px;right:4px;min-width:15px;height:15px;padding:0 4px;
  display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;
  background:var(--accent);color:var(--bg);border-radius:8px;line-height:1}

.cal-summary{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line-soft)}
.cal-sum-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.cal-sum-num{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent);line-height:1}
.cal-sum-lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}
.cal-empty-month{margin-top:16px;padding-top:16px;border-top:1px solid var(--line-soft);
  text-align:center;font-size:12.5px;color:var(--text-faint)}

.det-ex{background:transparent;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.det-grid{display:grid;grid-template-columns:44px 1fr 1fr 48px;gap:10px;align-items:center;padding:5px 2px;font-size:13.5px}
.det-grid.det-grid-edit{grid-template-columns:44px 1fr 1fr 48px 40px}
.det-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:600;border-bottom:1px solid var(--line-soft);padding-bottom:7px;margin-bottom:3px}

.set-grid{display:grid;grid-template-columns:var(--satz-cols,24px 1fr 1fr 50px 44px);
  gap:var(--satz-gap,8px);align-items:center}

select.input.rir-sel{padding:0 2px;align-self:stretch;
  text-align:center;text-align-last:center;width:100%;
  -webkit-appearance:none;appearance:none;background-image:none}

@media (max-width:420px){
  .ex-card{--satz-cols:20px 1fr 1fr 46px 44px;--satz-gap:6px}
  .set-grid{gap:6px;grid-template-columns:20px 1fr 1fr 46px 44px}
  .in-unit .input{padding:10px 24px 10px 8px}
  .in-unit .unit{right:7px;font-size:10px}
}

.set-head{font-size:11px;color:var(--text-faint);font-weight:600;margin-bottom:6px;
  padding:0 2px;flex-shrink:0;padding-right:4px}
.set-block{margin-bottom:10px}

.ex-sets .set-block:last-child{margin-bottom:0}

.ex-preview{width:100%;max-height:260px;margin:12px 0 16px;border-radius:12px;overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line-soft);cursor:pointer;display:grid;place-items:center;position:relative}
.ex-preview img{max-width:100%;max-height:260px;width:auto;height:auto;object-fit:contain;display:block}
.ex-preview.bad{min-height:120px}
.ex-preview.bad img{display:none}

.prev-grid{margin-bottom:3px}
.prev-cell{font-size:11px;color:var(--text-dim);text-align:center}

.prev-line{grid-column:2 / 5;text-align:center;font-size:10px;color:var(--text-dim);
  font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev-empty .prev-line{color:var(--text-faint)}
.prev-cell:not(:empty){color:var(--accent-dim);font-weight:600}
.total-grid{margin-top:3px}
.total-cell{font-size:11px;color:var(--text-faint);text-align:center;font-weight:600}

.set-vol{display:grid;grid-template-columns:var(--satz-cols,24px 1fr 1fr 50px 44px);
  gap:var(--satz-gap,8px);margin-top:4px;font-size:11px;line-height:1.3;min-height:14px}
.sv-inner{grid-column:2 / 5;display:flex;flex-wrap:nowrap;overflow:hidden;
  align-items:center;justify-content:flex-start;gap:6px;min-width:0}
.sv-inner > *{flex-shrink:0;white-space:nowrap}
.sv-inner .sv-rec{flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.set-vol:empty{margin-top:0;min-height:0}

.sv-prevset{display:none;color:var(--text-dim);font-weight:600;font-size:10px}

.sv-prevset + .sv-sep{display:none}
.sv-now{color:var(--accent-dim);font-weight:700}
.sv-sep{color:var(--text-faint);font-weight:400}

.sv-rec{color:var(--text-faint);font-weight:600;white-space:nowrap;font-size:10px}
.sv-prevset svg,.sv-rec svg{width:11.5px;height:11.5px;stroke-width:2.1;
  vertical-align:-1.5px;margin-right:3px}

.sv-rec.beat{color:var(--accent);font-weight:800;
  background:var(--accent-glow);padding:0 6px;border-radius:5px}

.sv-delta{font-weight:700;padding:0 5px;border-radius:5px;font-size:10px}
.sv-delta.up{background:rgba(55,217,154,.14);color:var(--green)}
.sv-delta.down{background:rgba(255,92,92,.14);color:var(--red)}
.sv-delta.same{color:var(--text-faint)}

.in-unit{position:relative;display:flex;align-items:center;align-self:stretch}
.in-unit .input{padding:10px 30px 10px 12px;text-align:center;width:100%;height:100%}
.in-unit .unit{position:absolute;right:10px;font-size:11px;color:var(--text-faint);font-weight:600;pointer-events:none}

.stat-tile{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:18px 12px;margin-top:0 !important}
.stat-num{font-size:30px;line-height:1.15;display:flex;align-items:baseline;justify-content:center;gap:1px}
.stat-lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}

.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:4px}
.seg-btn{flex:1;padding:8px 6px;min-height:44px;border-radius:9px;background:transparent;border:none;
  color:var(--text-faint);font-size:12.5px;font-weight:700;letter-spacing:.02em;transition:all .15s}
.seg-btn.on{background:var(--accent-glow);color:var(--accent)}
.seg-btn:active{transform:scale(.97)}

.wk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wk-item{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.wk-val{font-family:var(--font-display);font-size:20px;font-weight:800;line-height:1}
.wk-lbl{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint)}
.wk-delta{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px}
.wk-delta.up{background:rgba(55,217,154,.14);color:var(--green)}
.wk-delta.down{background:rgba(255,92,92,.14);color:var(--red)}
.wk-delta.same{background:var(--surface-3);color:var(--text-dim)}

.trend{display:flex;align-items:flex-end;gap:5px;margin-top:6px}
.trend-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;gap:5px}
.trend-val{font-size:9px;color:var(--text-faint);white-space:nowrap;line-height:1}
.trend-plot{width:100%;height:104px;display:flex;align-items:flex-end}
.trend-bar{width:100%;border-radius:4px 4px 2px 2px;
  transition:height .35s cubic-bezier(.2,.8,.2,1)}
.trend-bar.now{background:linear-gradient(180deg,var(--accent),var(--accent-dim))}
.trend-bar.prev{background:var(--text-faint)}
.trend-bar.old{background:rgba(125,140,166,.65)}
.trend-lbl{font-size:8.5px;color:var(--text-faint);white-space:nowrap;line-height:1;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.trend-col.now .trend-lbl{color:var(--accent-dim);font-weight:700}
.trend-key{display:inline-block;width:9px;height:9px;border-radius:3px;
  vertical-align:-1px;margin-right:4px}
.trend-key.now{background:var(--accent)}
.trend-key.prev{background:var(--text-faint)}
.trend-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-faint);
  margin-bottom:2px}

.spm-track{position:relative;height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.spm-zone{position:absolute;top:0;bottom:0;background:rgba(200,255,0,.12);
  border-left:1px solid rgba(200,255,0,.35);border-right:1px solid rgba(200,255,0,.35)}
.spm-fill{position:relative;height:100%;background:var(--accent);border-radius:4px}

.pr-row{display:grid;grid-template-columns:1.35fr 1.05fr 0.8fr 0.7fr;gap:8px;align-items:center;
  padding:9px 4px;font-size:13px;border-bottom:1px solid var(--line-soft)}
@media (max-width:430px){
  .pr-row{grid-template-columns:1.2fr 1fr 0.75fr 0.65fr;gap:5px;font-size:12px;align-items:start}

  .pr-row .pr-name{white-space:normal;line-height:1.25}
  .pr-row span:nth-child(n+2){padding-top:1px}
}

}

.pad > .card.hero{
  border-color:var(--edge-hero);
  background-image:linear-gradient(180deg,#181d27 0%,var(--surface) 60%);

}
.pad > .card.hero::before{
  content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;

}
.day-row,.ex-row{

}
.day-row:hover,.ex-row:hover{border-left-color:var(--accent)}

.eyebrow{display:inline-flex;align-items:center;gap:7px}
.eyebrow::before{
  content:"";width:14px;height:2px;border-radius:1px;flex-shrink:0;
  background:linear-gradient(90deg,var(--accent),var(--accent-dim));
}

.hr{background:linear-gradient(90deg,var(--line-card),var(--line-soft) 70%,transparent);

.vc-fill.now,.spm-fill,.sess-fill,.undo-fill{

.vc-track,.spm-track,.sess-bar{box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}

.next-card{background-image:linear-gradient(135deg,#dcff4d 0%,var(--accent) 46%,#a9d900 100%)}

async function cloudFetch(path, opts={}){
  const res=await fetch(CLOUD.url+path, {
    ...opts,
    headers:{
      'apikey':CLOUD.key,
      'Content-Type':'application/json',
      ...(SYNC.token?{'Authorization':'Bearer '+SYNC.token}:{}),
      ...(opts.headers||{})
    }
  });
  if(!res.ok){
    let msg='';
    try{ const j=await res.json(); msg=j.msg||j.message||j.error_description||j.error||''; }catch(e){}
    throw new Error(msg||('Error '+res.status));
  }

  const txt=await res.text();
  if(!txt) return null;
  try{ return JSON.parse(txt); }catch(e){ return null; }
}

function cloudRedirect(){ return encodeURIComponent(location.origin + location.pathname); }
async function cloudSignUp(email, password){
  const r=await fetch(`${CLOUD.url}/auth/v1/signup?redirect_to=${cloudRedirect()}`,{
    method:'POST',
    headers:{'apikey':CLOUD.key,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})
  });
  const j=await r.json();
  if(!r.ok) throw new Error(j.msg||j.message||j.error_description||'Sign-up failed');

  if(!j.access_token) return {needsConfirm:true};
  applySession(j);
  return {needsConfirm:false};
}

}

async function pullFromCloud(silent){
  if(!SYNC.token) return;
  setSync('syncing','Loading…');
  try{
    const rows=await cloudFetch(`/rest/v1/progresslab?id=eq.${SYNC.user.id}&select=data,rev,updated_at`);
    const row=rows && rows[0];
    const meta=syncMeta();

    if(!row){

      await pushToCloud(true);
      return;
    }

    const cloudRev = row.rev||0;
    const seenRev  = meta.rev||0;
    const localChanged = SYNC.dirty || !!meta.dirty;

    if(cloudRev===seenRev){

      SYNC.rev=cloudRev;
      if(localChanged){ await pushToCloud(); }
      else setSync('idle','Up to date');
      return;
    }

    if(!localChanged){
      applyCloudData(row);
      setSync('idle','Updated');
      if(!silent) toast('Data loaded from the cloud');
      return;
    }

    SYNC.conflict = { cloud:row, localAt: meta.changedAt||Date.now() };
    setSync('conflict','Conflict');
    showConflict();
  }catch(e){

    if(/JWT|token|401/i.test(e.message) && SYNC.refresh){
      try{ await cloudRefresh(SYNC.refresh); return pullFromCloud(silent); }catch(_){}
    }
    setSync('error', e.message||'Error');
  }
}
function applyCloudData(row){

  clearUndo();
  const d=row.data||{};
  DB.plans    = Array.isArray(d.plans)? d.plans : [];
  DB.logs     = Array.isArray(d.logs)?  d.logs  : [];
  DB.customEx = Array.isArray(d.customEx)? d.customEx : [];
  DB.measurements = Array.isArray(d.measurements)? d.measurements : [];
  DB.settings = (d.settings && typeof d.settings==='object') ? d.settings : DB.settings;
  DB.logs.sort((a,b)=>a.date-b.date);
  rebuildExDB(); migrateToEnglish(); migrateMuscleNames(); migrateExerciseIds(); migrateEquipToEnglish(); migrateKind();
  saveNow();
  SYNC.rev = row.rev||0;
  SYNC.dirty=false;
  setSyncMeta({rev:SYNC.rev, dirty:false, changedAt:null});
  renderView();
}

async function pushToCloud(isFirst){
  if(!SYNC.token || SYNC.state==='conflict') return;
  setSync('syncing','Saving…');
  try{
    const nextRev = (SYNC.rev||0)+1;
    const payload = { id:SYNC.user.id, data:DB, rev:nextRev, updated_at:new Date().toISOString() };
    await cloudFetch('/rest/v1/progresslab', {
      method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(payload)
    });
    SYNC.rev=nextRev;
    SYNC.dirty=false;
    setSyncMeta({rev:nextRev, dirty:false, changedAt:null});
    setSync('idle', isFirst?'Uploaded':'Saved');
  }catch(e){
    if(/JWT|token|401/i.test(e.message) && SYNC.refresh){
      try{ await cloudRefresh(SYNC.refresh); return pushToCloud(isFirst); }catch(_){}
    }
    setSync('error', e.message||'Error');
  }
}

function setSync(state, msg){

  if(state==='error' && (!navigator.onLine || /fetch|network|Load failed/i.test(msg||''))){
    msg='Offline – will catch up';
  }
  SYNC.state=state; SYNC.msg=msg||'';

  if(state!=='conflict'){
    const m=syncMeta();
    setSyncMeta({...m, rev:SYNC.rev, dirty:SYNC.dirty, changedAt: SYNC.dirty?(m.changedAt||Date.now()):null});
  }
  renderSyncBadge();
}

}
function resolveConflict(which){
  const c=SYNC.conflict; if(!c) return;
  SYNC.conflict=null;
  closeModal();
  if(which==='cloud'){
    applyCloudData(c.cloud);
    setSync('idle','Cloud applied');
    toast('Cloud version applied');
  }else{

    SYNC.rev = c.cloud.rev||0;
    SYNC.dirty=true;
    SYNC.state='idle';
    pushToCloud().then(()=>toast('This device won'));
  }
}
function fmtDateTime(ts){
  const d=new Date(ts);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'})+' '+
         d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function authErrText(e){
  let m=(e && e.message)||'Failed';
  if(/Invalid login/i.test(m)) m='Email or password is wrong';
  if(/already registered/i.test(m)) m='That email is already registered';
  if(/Invalid path|not found|404/i.test(m)) m='The project URL is wrong. It has to end in .supabase.co – no trailing slash and no path.';
  if(/Invalid API key|apikey/i.test(m)) m='The key is wrong. Use the “anon public” key from the project settings.';
  if(/does not exist|relation/i.test(m)) m='The table is missing. Run the SQL from step 2 of the guide.';
  if(/not confirmed/i.test(m)) m='Email not confirmed yet. Either click the link in the email or turn off “Confirm email” in Supabase.';
  if(/Password should be at least/i.test(m)) m='The password needs at least 6 characters';
  if(/you can only request this after|rate limit|too many/i.test(m)) m='Too many attempts. Wait a few minutes and try again.';
  if(/otp_expired|invalid claim|expired|token has invalid/i.test(m)) m='The link has expired. Request a new one.';
  if(/fetch|network|Load failed/i.test(m)) m='No connection. Is the project URL right? Are you online?';
  return m;
}

let RECOVERY=null;
function recoveryFromUrl(){
  const h=(location.hash||'').replace(/^#/,'');
  if(!h) return null;
  const p=new URLSearchParams(h);
  const clean=()=>{ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; } };
  if(p.get('error') || p.get('error_code')){
    clean();
    return {error: p.get('error_description')||p.get('error_code')||'The link did not work'};
  }
  const typ=p.get('type');
  if(typ && typ!=='recovery'){

    clean();
    return {confirmed:true};
  }
  if(typ!=='recovery' || !p.get('access_token')) return null;
  clean();
  return {
    access_token: p.get('access_token'),
    refresh_token: p.get('refresh_token'),
    expires_in: +(p.get('expires_in')||3600)
  };
}

  if(!cloudConfigured()){ SYNC.state='off'; renderSyncBadge(); return; }

  }catch(e){
    setSync('signed-out','Please sign in again');
  }
}

    if(!el.hasAttribute('role')) el.setAttribute('role','button');

function fmtDate(ts){
  const d=new Date(ts), n=new Date();
  const same=d.toDateString()===n.toDateString();
  const y=new Date(n-864e5).toDateString()===d.toDateString();
  if(same) return 'Today';
  if(y) return 'Yesterday';
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

function parseNum(v){
  if(typeof v==='number') return isFinite(v)?v:NaN;
  if(v==null) return NaN;
  const n=parseFloat(String(v).replace(',','.').trim());
  return isFinite(n)?n:NaN;
}

const EQUIP_MAX_STUFEN=500;

function equipWeights(eq){ return equipWeightsFrom(eq ? equipMap()[eq] : null); }
function equipWeightsFrom(c){
  if(!c) return [];
  if(c.mode==='liste'){
    const arr=(Array.isArray(c.gewichte)?c.gewichte:[])
      .map(parseNum).filter(v=>isFinite(v) && v>0)
      .map(v=>Math.round(v*1000)/1000);
    return [...new Set(arr)].sort((a,b)=>a-b);
  }
  const von=parseNum(c.von), bis=parseNum(c.bis), schritt=parseNum(c.schritt);
  if(!isFinite(von)||!isFinite(bis)||!isFinite(schritt)) return [];
  if(schritt<=0 || bis<von || von<=0) return [];
  const out=[];

  for(let v=von; v<=bis+1e-9 && out.length<EQUIP_MAX_STUFEN; v+=schritt){
    out.push(Math.round(v*1000)/1000);
  }
  return out;
}

function lastPerf(exName, exId){

  const match=(e)=> (exId && e.exId===exId) || (e.name===exName);
  for(let i=DB.logs.length-1;i>=0;i--){
    const ex=DB.logs[i].exercises.find(match);
    if(ex && ex.sets.some(s=>s.done)) return {log:DB.logs[i], ex};
  }
  return null;
}

function lastPerfUnit(exName, exId, dayName){
  if(dayName){
    const log=lastSessionLog(dayName);
    const ex=log && log.exercises.find(e=> (exId && e.exId===exId) || e.name===exName);
    if(ex && ex.sets.some(s=>s.done!==false)) return {log, ex};
  }
  return lastPerf(exName, exId);
}

function bestSet(exId, exName, satzIdx){
  const passt=e=> (exId && e.exId===exId) || (exName && e.name===exName);
  const f=exFactor(exName, exId);
  let best=null, bestReps=null;
  (DB.logs||[]).forEach(l=>{
    (l.exercises||[]).forEach(e=>{
      if(!passt(e)) return;

      const kandidaten = (satzIdx==null)
        ? (e.sets||[])
        : [(e.sets||[])[satzIdx]].filter(Boolean);
      kandidaten.forEach(s=>{
        if(s.done===false) return;
        const w=+s.weight||0, r=+s.reps||0;
        if(r<=0) return;
        const vol=w*f*r;
        if(!best || vol>best.vol) best={weight:w, reps:r, vol, date:l.date};
        if(!bestReps || r>bestReps.reps) bestReps={weight:w, reps:r, vol:0, date:l.date};
      });
    });
  });
  if(!best) return null;
  return best.vol>0 ? best : bestReps;
}

function lastSessionLog(dayName){
  for(let i=DB.logs.length-1;i>=0;i--){
    if(DB.logs[i].dayName===dayName) return DB.logs[i];
  }
  return null;
}

function exVolumeInLog(log, exName, exId){
  if(!log) return 0;
  const e=log.exercises.find(x=> (exId && x.exId===exId) || x.name===exName);
  if(!e) return 0;
  const f=exFactor(exName, exId);
  return e.sets.filter(s=>s.done!==false).reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
}

function exVolumeNow(ex){
  const f=exFactor(ex.name, ex.exId);
  return ex.sets.filter(s=>s.done).reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
}

function logVolume(log){
  return log.exercises.reduce((sum,ex)=>{
    const f=exFactor(ex.name, ex.exId);
    return sum+ex.sets.filter(s=>s.done).reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
  },0);
}

function exFactor(name, exId){ const m=exMetaById(exId)||exMeta(name); return (m && m.dumbbells===2) ? 2 : 1; }

function rollPfade(app){
  const out=[];
  app.querySelectorAll('*').forEach(el=>{
    if(el.scrollTop<=0 || el.scrollHeight<=el.clientHeight) return;
    const pfad=[]; let n=el;
    while(n && n!==app){ pfad.unshift([...n.parentNode.children].indexOf(n)); n=n.parentNode; }
    out.push({pfad, top:el.scrollTop});
  });
  return out;
}
function rollZurueck(app, liste){
  if(!liste || !liste.length) return;
  liste.forEach(({pfad, top})=>{
    let n=app;
    for(const i of pfad){ n=n.children[i]; if(!n) return; }
    if(n.scrollHeight>n.clientHeight) n.scrollTop=top;
  });
}

function fokusPfad(app){
  const el=document.activeElement;
  if(!el || el===document.body || !app.contains(el)) return null;
  if(['INPUT','SELECT','TEXTAREA'].includes(el.tagName)) return null;
  const pfad=[]; let n=el;
  while(n && n!==app){ pfad.unshift([...n.parentNode.children].indexOf(n)); n=n.parentNode; }
  return pfad;
}
function fokusZurueck(app, pfad){
  if(!pfad) return;
  let n=app;
  for(const i of pfad){ n=n.children[i]; if(!n) return; }

  if(n.tagName==='BUTTON' || n.tabIndex>=0) n.focus({preventScroll:true});
}

function weekGoal(){
  const ziele=(DB.plans||[]).map(p=>+p.perWeek||p.days.length||0).filter(x=>x>0);
  if(!ziele.length) return 0;
  return Math.min(14, ziele.reduce((a,b)=>a+b,0));
}

function maxGapDays(){
  const ziel = weekGoal() || 3;
  return Math.max(3, Math.ceil(7/ziel*2));
}
function weekBar(){
  const goal=weekGoal();
  if(!goal) return '';
  const now=new Date();
  const monday=new Date(now); monday.setHours(0,0,0,0);
  const dow=(monday.getDay()+6)%7;
  monday.setDate(monday.getDate()-dow);
  const days=new Set(DB.logs
    .filter(l=>l.date>=monday.getTime())
    .map(l=>new Date(l.date).toDateString()));
  const done=days.size;
  const pct=Math.min(100, Math.round(done/goal*100));
  const reached=done>=goal;
  return `<div class="hr"></div>
    <div class="row between" style="margin-bottom:7px">
      <span class="faint" style="font-size:12px" title="${escAttr((DB.plans||[]).filter(p=>+p.perWeek>0).map(p=>p.name+' '+p.perWeek+'×').join(' + ')||'')}">This week${(DB.plans||[]).filter(p=>+p.perWeek>0).length>1?' · all plans':''}</span>
      <span style="font-size:12px;font-weight:700;color:${reached?'var(--accent)':'var(--text-dim)'}">${done} / ${goal}${reached?' ✓':''}</span>
    </div>
    <div class="sess-bar"><div class="sess-fill" style="width:${pct}%"></div></div>`;
}
function calcStreak(){
  if(!DB.logs.length) return 0;
  const gap=maxGapDays();

  const days=[...new Set(DB.logs.map(l=>new Date(l.date).toDateString()))]
    .map(d=>{const x=new Date(d); x.setHours(0,0,0,0); return x;})
    .sort((a,b)=>b-a);
  const today=new Date(); today.setHours(0,0,0,0);

  if(Math.round((today-days[0])/864e5) > gap) return 0;
  let streak=1;
  for(let i=1;i<days.length;i++){
    const diff=Math.round((days[i-1]-days[i])/864e5);
    if(diff<=gap) streak++; else break;
  }
  return streak;
}
function _plan(id){ return DB.plans.find(x=>x.id===id); }

const ARTEN = {
  strength:  {name:'Strength',  sub:'Weight \u00d7 reps',        icon:'dumb'},
  hiit:      {name:'HIIT',      sub:'Rounds on the clock',  icon:'stopwatch'},
  endurance: {name:'Endurance', sub:'Time and distance',    icon:'pulse'}
};
function hiitVorgabe(d){
  return {rounds: +(d&&d.rounds)||4, work: +(d&&d.work)||40, rest: +(d&&d.rest)||20};
}
function hiitDauer(d, anzahlUebungen){
  const v=hiitVorgabe(d);
  const n=Math.max(1, anzahlUebungen||1);
  return v.rounds * n * (v.work + v.rest);
}
function setHiit(di, feld, val){
  const d=BUILDER.days[di]; if(!d) return;
  const n=Math.max(1, Math.round(parseNum(val)||0));
  d[feld]=n;
  const el=document.getElementById('hiitSum');
  if(el) el.textContent=hiitSummeText(d);
}
function hiitSummeText(d){
  const v=hiitVorgabe(d);
  const n=Math.max(1, (d.exercises||[]).length);
  const gesamt=hiitDauer(d, n);
  return `${v.rounds} \u00d7 ${n} \u00d7 (${v.work}s + ${v.rest}s) = ${fmtDauer(Math.round(gesamt/60))}`;
}

function planArt(p){ return (p && ARTEN[p.kind]) ? p.kind : 'strength'; }
function tagArt(plan, tag){ return (tag && ARTEN[tag.kind]) ? tag.kind : planArt(plan); }
function logArt(l){ return (l && ARTEN[l.kind]) ? l.kind : 'strength'; }
function artName(k){ return (ARTEN[k]||ARTEN.strength).name; }
function artIcon(k){ return I[(ARTEN[k]||ARTEN.strength).icon]; }

function migrateKind(){
  let changed=false;
  (DB.plans||[]).forEach(p=>{ if(!ARTEN[p.kind]){ p.kind='strength'; changed=true; } });
  (DB.logs||[]).forEach(l=>{ if(!ARTEN[l.kind]){ l.kind='strength'; changed=true; } });
  if(changed){ save(); console.log('[Migration] training kind set on plans and logs'); }
}

function fmtDauer(min){
  const m=Math.max(0, Math.round(+min||0));
  if(m<60) return m+' min';
  return Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':'');
}
function pace(min, km){
  const m=+min||0, k=+km||0;
  if(m<=0 || k<=0) return null;
  const proKm=m/k;
  const ganz=Math.floor(proKm), sek=Math.round((proKm-ganz)*60);
  return ganz+':'+String(sek).padStart(2,'0')+' /km';
}
function cardioVon(l){ return (l && l.cardio) ? l.cardio : null; }
function logKm(l){ const c=cardioVon(l); return c ? (+c.km||0) : 0; }
function logMin(l){
  const c=cardioVon(l);
  if(c) return +c.minutes||0;
  return l.duration ? Math.round(l.duration/60000) : 0;
}

function neuerSatz(vorher){
  const w = (vorher && +vorher.weight>0) ? String(vorher.weight) : '';
  return {weight:w, reps:'', rir:'0', done:false, prev: vorher||null};
}

function startSession(plan, day){
  if(tagArt(plan, day)==='hiit'){
    const v=hiitVorgabe(day);
    const stationen=(day.exercises||[]).map(ex=>{
      const exId=ex.exId||exIdForName(ex.name);
      const meta=exMetaById(exId);
      return {exId, name: meta?meta.n:ex.name, muscle: meta?meta.g:ex.muscle};
    });
    if(!stationen.length){ toast('Add at least one station first'); return; }
    SESSION={
      kind:'hiit',
      planId:plan?plan.id:null, planName:plan?plan.name:'Free workout',
      dayName:day.name, date:Date.now(), exercises:[],
      stationen, rounds:v.rounds, work:v.work, rest:v.rest,
      round:1, station:0, arbeitSek:0
    };
    HIIT={phase:'ready', endsAt:0, uebrig:0};
    saveSession(); go('today'); return;
  }
  if(tagArt(plan, day)==='endurance'){
    SESSION={
      kind:'endurance',
      planId:plan?plan.id:null, planName:plan?plan.name:'Free workout',
      dayName:day.name, date:Date.now(), exercises:[],
      cardio:{minutes:'', km:'', hr:'', note:''}
    };
    saveSession(); go('today'); return;
  }
  SESSION={
    kind:'strength',
    planId:plan?plan.id:null, planName:plan?plan.name:'Free workout',
    dayName:day.name, date:Date.now(),
    exercises: day.exercises.map(ex=>{

      const exId = ex.exId || exIdForName(ex.name);

      const meta = exMetaById(exId);
      const name = meta ? meta.n : ex.name;
      const muscle = meta ? meta.g : ex.muscle;
      const prevSets=prevPerfSets(name, day.name, exId);

      const n = prevSets.length ? prevSets.length : (ex.sets||3);
      return {exId, name, muscle, targetReps:ex.reps, targetSets:n, rest:+ex.rest||0,
        sets:Array.from({length:n},(_,i)=>neuerSatz(prevSets[i]))};
    })
  };
  saveSession();
  go('today');
}

function prevPerfSets(exName, dayName, exId){
  const p=lastPerfUnit(exName, exId, dayName);

  return p.ex.sets.filter(s=>s.done!==false).map(s=>({weight:+s.weight||0, reps:+s.reps||0, rir:(s.rir!=null?s.rir:'')}));
}

function clockNow(){

function sessMillis(){

function durClock(ms){

  const h=Math.floor(ganz/3600), m=Math.floor(ganz%3600/60), sek=ganz%60;
  const zz=n=>String(n).padStart(2,'0');
  return h ? h+':'+zz(m)+':'+zz(sek) : zz(m)+':'+zz(sek);
}

const SICHTBARE_SAETZE = 3;

let FIT_DIAG=null;

const MIN_IMG_PX = 78;

function satzMasze(sets){
  const bl=sets.querySelectorAll('.set-block');
  if(!bl.length) return null;
  const bh=bl[0].getBoundingClientRect().height;
  const luecke = bl.length>1
    ? (bl[1].getBoundingClientRect().top - bl[0].getBoundingClientRect().bottom)
    : (parseFloat(getComputedStyle(bl[0]).marginBottom)||0);
  return {bh, luecke, anzahl:bl.length};
}

function hoeheFuerSaetze(n, m){ return n*m.bh + (n-1)*m.luecke; }

function platzFuerSaetze(sets){
  const altMax=sets.style.maxHeight;
  const altVar=sets.style.getPropertyValue('--sets-max');
  sets.style.maxHeight='';
  sets.style.removeProperty('--sets-max');

  const h=sets.getBoundingClientRect().height;
  sets.style.maxHeight=altMax;
  if(altVar) sets.style.setProperty('--sets-max', altVar);
  else sets.style.removeProperty('--sets-max');
  return h;
}
function dreiSatzHoehe(sets){
  const bl=sets.querySelectorAll('.set-block');
  if(!bl.length) return 0;
  if(bl.length>=SICHTBARE_SAETZE){

    return bl[SICHTBARE_SAETZE-1].getBoundingClientRect().bottom
         - bl[0].getBoundingClientRect().top;
  }

  return hoeheFuerSaetze(SICHTBARE_SAETZE, satzMasze(sets));
}

function begrenzeSatzbereich(sets){
  const m=satzMasze(sets);
  const frei=()=>{ sets.style.maxHeight=''; sets.style.removeProperty('--sets-max'); };
  if(!m){ frei(); return; }
  const platz=platzFuerSaetze(sets);
  let n=SICHTBARE_SAETZE;
  if(platz>0){

    const passt=Math.floor((platz + m.luecke + 0.5) / (m.bh + m.luecke));
    n=Math.max(SICHTBARE_SAETZE, Math.min(m.anzahl, passt));
  }
  if(n>=m.anzahl){ frei(); return; }

  const px=Math.ceil(hoeheFuerSaetze(n, m));
  sets.style.maxHeight=px+'px';
  sets.style.setProperty('--sets-max', px+'px');
}

function fitSessImage(){
  const body=document.getElementById('sessBody'); if(!body) return;
  const card=body.querySelector('.ex-card'); if(!card) return;
  const head=card.querySelector('.row');
  const sets=card.querySelector('.ex-sets');
  const vc=card.querySelector('.vc');
  const prev=card.querySelector('.ex-preview');
  if(!sets) return;

  const standalone = !!(window.matchMedia && (
      matchMedia('(display-mode: standalone)').matches ||
      matchMedia('(display-mode: fullscreen)').matches
  )) || (('standalone' in navigator) && navigator.standalone);
  const breit = window.innerWidth >= 900;

  const flach = breit && (window.innerHeight <= 720 || (standalone && window.innerHeight <= 900));

  function echteHoehe(){
    const cand=[window.innerHeight, document.documentElement.clientHeight];
    if(window.visualViewport && window.visualViewport.height) cand.push(Math.round(window.visualViewport.height));
    const gueltig=cand.filter(v=>v && v>300);
    return gueltig.length? Math.min.apply(null, gueltig) : window.innerHeight;
  }

  if(flach){
    const sess=card.closest('.sess');
    const appEl=document.getElementById('app');
    const h=echteHoehe();
    if(appEl){ appEl.style.height=h+'px'; }
    if(sess){ sess.style.height=h+'px'; }
  } else {
    const sess=card.closest('.sess');
    const appEl=document.getElementById('app');
    if(appEl) appEl.style.removeProperty('height');
    if(sess) sess.style.removeProperty('height');
  }

  const querBreit = window.matchMedia('(min-width:900px) and (max-height:820px)').matches;
  const quer = querBreit && !flach;
  if(quer){
    if(vc) vc.style.display='';
    if(prev){ prev.style.display=''; card.style.removeProperty('--img-max'); }

    sets.style.removeProperty('--sets-max');
    sets.style.maxHeight='';
    card.style.maxHeight='';
    card.classList.remove('scroll-all');

    begrenzeSatzbereich(sets);
    return;
  }

  if(querBreit && flach){
    if(vc) vc.style.display='';

    sets.style.removeProperty('--sets-max');
    sets.style.maxHeight='';
    card.style.maxHeight='';
    card.classList.remove('scroll-all');
    if(prev) prev.style.display='';

    const timerEl=document.getElementById('restTimer');
    const cTop=card.getBoundingClientRect().top;
    let limitBottom;
    if(timerEl && timerEl.classList.contains('show')){
      limitBottom = timerEl.getBoundingClientRect().top - 6;
    } else {

      const sess=card.closest('.sess');
      const sb=sess?sess.getBoundingClientRect():{bottom:window.innerHeight};
      const csEnv=sess?parseFloat(getComputedStyle(sess).paddingBottom||0):0;
      limitBottom = sb.bottom - csEnv - 6;
    }
    const maxCard=Math.max(120, Math.floor(limitBottom - cTop));
    card.style.maxHeight = maxCard+'px';

    if(prev){ card.style.removeProperty('--img-max'); }

    begrenzeSatzbereich(sets);

    const zielHoehe=Math.min(sets.scrollHeight, dreiSatzHoehe(sets));
    const vorher=sets.clientHeight;
    if(vc && zielHoehe>0 && sets.clientHeight < zielHoehe-1){
      vc.style.display='none';
      begrenzeSatzbereich(sets);
    }
    FIT_DIAG={zweig:'panel', zielHoehe, vorher, nachher:sets.clientHeight,
              vcWeg: (vc && vc.style.display==='none')?1:0, maxCard};
    return;
  }

  if(vc) vc.style.display='';
  if(prev) prev.style.display='';
  sets.style.maxHeight='';
  sets.style.removeProperty('--sets-max');
  card.style.maxHeight='';
  card.classList.remove('scroll-all');
  card.classList.remove('prev-kompakt');

  let setsVoll = sets.scrollHeight;
  const MIN_SETS = 120;

  let dreiHoehe = dreiSatzHoehe(sets) || setsVoll;

  const messeGrund=()=>{
    sets.style.maxHeight='0px';
    if(prev) card.style.setProperty('--img-max','0px');
    const h=card.offsetHeight;
    sets.style.maxHeight='';
    return h;
  };
  const verfuegbar = body.clientHeight;
  let grund = messeGrund();

  if(verfuegbar - grund < dreiHoehe + MIN_IMG_PX && sets.querySelector('.prev-grid')){

    const vorher=dreiHoehe;
    card.classList.add('prev-kompakt');
    const nachher=dreiSatzHoehe(sets) || sets.scrollHeight;
    if(nachher < vorher-8){
      dreiHoehe=nachher; setsVoll=sets.scrollHeight; grund=messeGrund();
    } else {
      card.classList.remove('prev-kompakt');
    }
  }

  if(vc && verfuegbar - grund < dreiHoehe + MIN_IMG_PX){ vc.style.display='none'; grund = messeGrund(); }

  let imgBlock=0;
  if(prev){

    const platz = verfuegbar - grund;
    let imgMax = Math.min(380, Math.floor(platz - dreiHoehe));

    if(imgMax < MIN_IMG_PX) imgMax = 0;
    imgMax = Math.max(0, imgMax);
    if(imgMax<40){ prev.style.display='none'; card.style.setProperty('--img-max','0px'); }
    else { card.style.setProperty('--img-max', imgMax+'px'); imgBlock = imgMax; }
  }

  const fuerSaetze = Math.floor(verfuegbar - grund - imgBlock);

  FIT_DIAG={zweig:'hoch', verfuegbar, grund, platz:verfuegbar-grund, dreiHoehe, setsVoll, imgBlock,
            fuerSaetze, kompakt:card.classList.contains('prev-kompakt')?1:0, hatBild:prev?1:0};

  let zielSaetze = Math.min(setsVoll, dreiHoehe);
  const masze = satzMasze(sets);
  if(masze){
    const passt=Math.floor((fuerSaetze + masze.luecke + 0.5) / (masze.bh + masze.luecke));
    const n=Math.max(SICHTBARE_SAETZE, Math.min(masze.anzahl, passt));
    zielSaetze = (n>=masze.anzahl) ? setsVoll : hoeheFuerSaetze(n, masze);
  }
  if(fuerSaetze < Math.min(zielSaetze, MIN_SETS)){

    card.classList.add('scroll-all');
    sets.style.maxHeight='';

    if(prev && imgBlock===0){
      prev.style.display='';
      card.style.setProperty('--img-max','110px');
    }
  } else {
    card.classList.remove('scroll-all');
    sets.style.maxHeight = Math.min(zielSaetze, fuerSaetze) + 'px';
  }

  const timerEl=document.getElementById('restTimer');
  if(timerEl && timerEl.classList.contains('show')){
    const t=timerEl.getBoundingClientRect();
    const c=card.getBoundingClientRect();
    if(c.bottom > t.top-6){
      card.classList.add('scroll-all');
      card.style.maxHeight = Math.max(80, Math.floor(t.top - c.top - 6)) + 'px';
      return;
    }
  }
  card.style.maxHeight='';
}

function initSessSwipe(){

  let x0=null,y0=null,moved=false;

    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; moved=false;
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(x0==null) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10) moved=true;
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0==null||!moved){ x0=null; return; }
    const dx=e.changedTouches[0].clientX-x0;
    x0=null;

    if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if(dx<-45) goExercise(SESSION.page+1);
    else if(dx>45) goExercise(SESSION.page-1);
  },{passive:true});
}

function exRepsNow(ex){
  return ex.sets.filter(s=>s.done).reduce((a,s)=>a+(+s.reps||0),0);
}
function exRepsInLog(log, exName, exId){
  if(!log) return 0;
  const e=log.exercises.find(x=> (exId && x.exId===exId) || x.name===exName);
  if(!e) return 0;
  return e.sets.filter(s=>s.done!==false).reduce((a,s)=>a+(+s.reps||0),0);
}
function volCompare(ex){
  const exId=ex.exId;
  const prevLog=lastSessionLog(SESSION.dayName);
  let now=exVolumeNow(ex);
  let prev=exVolumeInLog(prevLog, ex.name, exId);

  let prevReps2=null;
  if(!prev){
    const lp=lastPerf(ex.name, exId);
    if(lp){
      const f=exFactor(ex.name, exId);
      prev=lp.ex.sets.filter(s=>s.done!==false).reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
      prevReps2=lp.ex.sets.filter(s=>s.done!==false).reduce((a,s)=>a+(+s.reps||0),0);
    }
  }
  let unit='kg', title='Volume';

  const nowReps=exRepsNow(ex);
  let prevReps=exRepsInLog(prevLog, ex.name, exId);
  if(!prevReps && prevReps2!=null) prevReps=prevReps2;
  if(now===0 && prev===0 && (nowReps>0 || prevReps>0)){
    now=nowReps; prev=prevReps; unit='reps'; title='Reps';
  }
  if(!prev && !now) return '';
  const max=Math.max(now, prev, 1);
  const nowPct=Math.round(now/max*100);
  const prevPct=Math.round(prev/max*100);
  const fmt=v=>v.toLocaleString('en-GB')+' '+unit;
  let delta='';
  if(prev>0 && now>0){
    const d=Math.round((now/prev-1)*100);
    const cls = d>0?'up' : (d<0?'down':'same');
    delta=`<span class="vc-delta ${cls}">${d>0?'+':''}${d}%</span>`;
  } else if(!prev){
    delta=`<span class="vc-delta same">neu</span>`;
  }
  return `<div class="vc">
    <div class="vc-title">
      <span>${title}</span>${delta}
    </div>
    <div class="vc-row">
      <span class="vc-lbl">Today</span>
      <div class="vc-track"><div class="vc-fill now" style="width:${nowPct}%"></div></div>
      <span class="vc-val">${fmt(now)}</span>
    </div>
    <div class="vc-row">
      <span class="vc-lbl">Last time</span>
      <div class="vc-track"><div class="vc-fill prev" style="width:${prevPct}%"></div></div>
      <span class="vc-val prev">${prev?fmt(prev):'–'}</span>
    </div>
  </div>`;
}
function setRow(ex,ei,st,si){

    : `<input class="input" aria-label="Weight set ${si+1}, ${esc(ex.name)}, kg" inputmode="decimal" placeholder="–" value="${zahlFeld(st.weight)}" oninput="updateSetVol(${ei},${si})" onchange="setVal(${ei},${si},'weight',this.value)">`;

    </div>

function schlaegtRekord(st, rec, f){
  if(!rec || !st || !st.done) return false;
  const w=+st.weight||0, r=+st.reps||0;
  if(r<=0) return false;
  return rec.vol>0 ? (w*f*r > rec.vol) : (w===0 && r > rec.reps);
}

function setVolText(prevVol, nowVol, prev, rec, st, f, platzHalten){
  const parts=[];
  const geschlagen = schlaegtRekord(st, rec, f||1);

  if(prev){
    const rirTxt=(prev.rir!=null&&prev.rir!=='')?` · RIR ${prev.rir}`:'';

    parts.push(`<span class="sv-prevset" title="Last time" aria-label="Last time ${escAttr(zahlFeld(prev.weight))} kg by ${prev.reps} reps">${I.history}${zahlFeld(prev.weight)} kg × ${prev.reps} reps${rirTxt}</span>`);
  }

  if(nowVol>0){
    let d='';
    if(prevVol>0){
      const pct=Math.round((nowVol/prevVol-1)*100);
      const cls=pct>0?'up':(pct<0?'down':'same');
      d=` <span class="sv-delta ${cls}">${pct>0?'+':''}${pct}%</span>`;
    }
    parts.push(`<span class="sv-now">today ${nowVol.toLocaleString('en-GB')} kg${d}</span>`);
  }


  if(rec){
    const zahl = geschlagen
      ? `${zahlFeld(+st.weight||0)} kg × ${+st.reps||0} reps`
      : `${zahlFeld(rec.weight)} kg × ${rec.reps} reps`;
    const lbl = geschlagen ? 'Record beaten' : 'Record';
    parts.push(`<span class="sv-rec${geschlagen?' beat':''}" title="${lbl}" aria-label="${lbl} ${escAttr(zahl)}">${I.trophy}${geschlagen?'beaten · ':''}${zahl}</span>`);
  }

  if(!parts.length) return platzHalten ? '<span class="sv-inner"></span>' : '';
  return `<span class="sv-inner">${parts.join('<span class="sv-sep">·</span>')}</span>`;
}

                      : `Record! ${rec.reps} → ${+st.reps||0} reps`);

  renderView();

  if(st.done && ex.rest>0) startRest(ex.rest, ex.name);

let TIMER=null;
function restRemaining(){
  if(!TIMER) return 0;
  return Math.max(0, Math.round((TIMER.endAt-Date.now())/1000));
}
function startRest(seconds, label){
  stopRestTick();
  TIMER={endAt:Date.now()+seconds*1000, total:seconds, base:seconds,
         label:label||'', ended:false, alerted:false};
  renderRestTimer();
  TIMER.handle=setInterval(tickRest,1000);
}
function tickRest(){
  if(!TIMER) return;
  if(restRemaining()<=0){
    TIMER.ended=true;
    stopRestTick();

    if(!TIMER.alerted){ TIMER.alerted=true; restAlert(); }
    renderRestTimer();
    setTimeout(()=>{ if(TIMER&&TIMER.ended) closeRest(); },4000);
  } else {
    renderRestTimer();
  }
}
function stopRestTick(){ if(TIMER&&TIMER.handle){ clearInterval(TIMER.handle); TIMER.handle=null; } }
function closeRest(){ stopRestTick(); TIMER=null; renderRestTimer(); }
function adjustRest(delta){
  if(!TIMER) return;

  const next=Math.max(1, restRemaining()+delta);
  TIMER.endAt=Date.now()+next*1000;
  TIMER.total=Math.max(TIMER.total, next);
  if(TIMER.ended){ TIMER.ended=false; TIMER.alerted=false; if(!TIMER.handle){ TIMER.handle=setInterval(tickRest,1000); } }
  renderRestTimer();
}
function restartRest(){
  if(!TIMER) return;
  startRest(TIMER.base, TIMER.label);
}

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && TIMER) tickRest();
});
function fmtClock(s){ const m=Math.floor(s/60), ss=s%60; return `${m}:${String(ss).padStart(2,'0')}`; }

let TIMER_PLATZ=false;

function neuAufteilenWennTimerWechselt(an){

function renderRestTimer(){
  const el=document.getElementById('restTimer'); if(!el) return;

  if(!TIMER || !SESSION){
    el.classList.remove('show'); el.innerHTML='';
    document.body.classList.remove('timer-on');
    neuAufteilenWennTimerWechselt(false);

  }
  document.body.classList.add('timer-on');
  neuAufteilenWennTimerWechselt(true);
  const remaining=restRemaining();
  const pct = TIMER.total? Math.max(0, Math.min(100, remaining/TIMER.total*100)) : 0;
  const ended=TIMER.ended;
  el.innerHTML=`
    <div class="rt-bar"><div class="rt-fill ${ended?'done':''}" style="width:${ended?100:pct}%"></div></div>
    <div class="rt-body">

        <span class="rt-ico ${ended?'done':''}">${I.timer}</span>

          <div class="rt-label">${ended?'':'Rest'}${TIMER.label&&!ended?' · '+esc(TIMER.label):''}</div>
        </div>
      </div>
      <div class="rt-controls">
        ${ended?'' :`<button class="rt-btn" onclick="adjustRest(-15)" title="15 s less" aria-label="15 seconds less">−15</button>
        <button class="rt-btn" onclick="adjustRest(15)" title="15 s more" aria-label="15 seconds more">+15</button>`}
        <button class="rt-btn icon" onclick="restartRest()" title="Restart" aria-label="Restart rest">${I.restart}</button>
        <button class="rt-btn icon" onclick="closeRest()" title="Cancel" aria-label="Cancel rest">${I.x}</button>
      </div>
    </div>`;
  el.classList.add('show');
}

let _audioCtx=null;
function restAlert(){

  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}

  try{
    _audioCtx = _audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const ctx=_audioCtx;
    if(ctx.state==='suspended') ctx.resume();
    const now=ctx.currentTime;
    [0,0.22,0.44].forEach((t,i)=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type='sine';
      osc.frequency.setValueAtTime(i===2?1046:880, now+t);
      gain.gain.setValueAtTime(0.0001, now+t);
      gain.gain.exponentialRampToValueAtTime(0.35, now+t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+t+0.18);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now+t); osc.stop(now+t+0.2);
    });
  }catch(e){}
}

function logReps(log){
  return log.exercises.reduce((a,ex)=>
    a+ex.sets.filter(x=>x.done!==false).reduce((b,x)=>b+(+x.reps||0),0), 0);
}
function dauerText(ms){
  const min=Math.max(1, Math.round(ms/60000));
  if(min<60) return min+' min';
  const h=Math.floor(min/60), m=min%60;
  return h+' h'+(m?' '+m+' min':'');
}

function priorSets(exId, exName){
  const passt=e=> (exId && e.exId===exId) || (exName && e.name===exName);
  const f=exFactor(exName, exId);
  const out=[];
  (DB.logs||[]).forEach(l=>(l.exercises||[]).forEach(e=>{
    if(!passt(e)) return;
    (e.sets||[]).forEach(x=>{
      if(x.done===false) return;
      const r=+x.reps||0;
      if(r>0) out.push({w:(+x.weight||0)*f, r});
    });
  }));
  return out;
}

function newRepRecords(ex, f){
  const gesehen=priorSets(ex.exId, ex.name);
  if(!gesehen.length) return [];
  const out=[];
  (ex.sets||[]).forEach(st=>{
    const w=(+st.weight||0)*f, r=+st.reps||0;
    if(r<=0) return;
    const geschlagen = !gesehen.some(a=>a.w>=w && a.r>=r);
    gesehen.push({w,r});
    if(geschlagen) out.push({weight:+st.weight||0, reps:r});
  });
  const beste=new Map();
  out.forEach(x=>{ const v=beste.get(x.reps); if(!v || x.weight>v.weight) beste.set(x.reps, x); });
  return [...beste.values()].sort((a,b)=>a.reps-b.reps);
}

function exerciseDeltas(neu, vorLog){
  return (neu.exercises||[]).map(ex=>{
    const f=exFactor(ex.name, ex.exId);
    const summe=(sets,vol)=>(sets||[]).filter(x=>x.done!==false)
      .reduce((a,x)=>a+(vol?(+x.weight||0)*f*(+x.reps||0):(+x.reps||0)),0);
    const alt = vorLog ? (vorLog.exercises||[]).find(x=>(ex.exId&&x.exId===ex.exId)||x.name===ex.name) : null;
    const jetztVol=summe(ex.sets,true), altVol=alt?summe(alt.sets,true):0;
    const nurReps = jetztVol===0 && altVol===0;
    return {
      name: ex.name,
      jetzt: nurReps?summe(ex.sets,false):jetztVol,
      vorher: alt ? (nurReps?summe(alt.sets,false):altVol) : null,
      einheit: nurReps?'reps':'kg'
    };
  });
}

function deltaProzent(jetzt, vorher){
  if(vorher==null) return {cls:'same', txt:'new'};
  if(!vorher || !jetzt) return null;
  const d=Math.round((jetzt/vorher-1)*100);
  return {cls: d>0?'up':(d<0?'down':'same'), txt:(d>0?'+':'')+d+'%'};
}

let HIIT=null;
let _hiitAudio=null, _wakeLock=null;

function hiitBeep(hoch){
  try{
    _hiitAudio = _hiitAudio || new (window.AudioContext||window.webkitAudioContext)();
    if(_hiitAudio.state==='suspended') _hiitAudio.resume();
    const t=_hiitAudio.currentTime;
    const o=_hiitAudio.createOscillator(), g=_hiitAudio.createGain();
    o.type='sine'; o.frequency.value = hoch?900:520;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.19);
    o.connect(g); g.connect(_hiitAudio.destination);
    o.start(t); o.stop(t+0.2);
  }catch(e){}
}
async function wakeAn(){
  try{ if('wakeLock' in navigator && !_wakeLock) _wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
}
function wakeAus(){ try{ if(_wakeLock){ _wakeLock.release(); _wakeLock=null; } }catch(e){} }

function hiitPhaseSek(){ return HIIT && HIIT.phase==='rest' ? SESSION.rest : SESSION.work; }

function hiitStart(){
  if(!SESSION || SESSION.kind!=='hiit') return;
  HIIT={phase:'work', endsAt: Date.now()+SESSION.work*1000, uebrig:0};
  hiitBeep(true); wakeAn(); saveSession(); renderView();
}
function hiitPause(){
  if(!HIIT || HIIT.phase==='ready' || HIIT.phase==='done') return;
  if(HIIT.uebrig){ HIIT.endsAt=Date.now()+HIIT.uebrig; HIIT.uebrig=0; wakeAn(); }
  else { HIIT.uebrig=Math.max(0, HIIT.endsAt-Date.now()); HIIT.endsAt=0; wakeAus(); }
  renderView();
}
function hiitWeiter(){
  if(!SESSION || !HIIT) return;
  if(HIIT.phase==='work'){
    SESSION.arbeitSek += SESSION.work;
    HIIT.phase='rest'; HIIT.endsAt=Date.now()+SESSION.rest*1000; HIIT.uebrig=0;
    hiitBeep(false);
  } else {
    SESSION.station++;
    if(SESSION.station >= SESSION.stationen.length){
      SESSION.station=0; SESSION.round++;
    }
    if(SESSION.round > SESSION.rounds){
      SESSION.round=SESSION.rounds;
      HIIT.phase='done'; HIIT.endsAt=0; HIIT.uebrig=0;
      hiitBeep(true); setTimeout(()=>hiitBeep(true), 260);
      wakeAus();
    } else {
      HIIT.phase='work'; HIIT.endsAt=Date.now()+SESSION.work*1000; HIIT.uebrig=0;
      hiitBeep(true);
    }
  }
  saveSession(); renderView();
}
function hiitSkip(){ if(HIIT && HIIT.phase!=='done'){ if(HIIT.phase==='ready') return hiitStart(); hiitWeiter(); } }

function hiitTick(){
  if(!SESSION || SESSION.kind!=='hiit' || !HIIT) return;
  if(HIIT.phase==='ready' || HIIT.phase==='done' || HIIT.uebrig) return;
  const rest=HIIT.endsAt-Date.now();
  if(rest<=0){ hiitWeiter(); return; }
  const el=document.getElementById('hiitCount');
  if(el){ const t=String(Math.ceil(rest/1000)); if(el.textContent!==t) el.textContent=t; }
  const bar=document.getElementById('hiitBar');
  if(bar) bar.style.width=Math.max(0,Math.min(100, rest/(hiitPhaseSek()*1000)*100))+'%';
}
