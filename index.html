function cardioRekorde(neu){
  const vorher=(DB.logs||[]).filter(l=>logArt(l)==='endurance' && l.id!==neu.id && l.cardio);
  if(!vorher.length) return [];
  const c=neu.cardio||{};
  const km=+c.km||0, min=+c.minutes||0;
  const pj=(km>0&&min>0)?min/km:0;
  const out=[];
  const maxKm=Math.max(0,...vorher.map(l=>+((l.cardio||{}).km)||0));
  if(km>0 && km>maxKm) out.push({label:'Longest distance', wert:fmtKg(km)+' km'});
  const maxMin=Math.max(0,...vorher.map(l=>+((l.cardio||{}).minutes)||0));
  if(min>0 && min>maxMin) out.push({label:'Longest session', wert:fmtDauer(min)});
  if(pj>0){
    const geschlagen = !vorher.some(l=>{
      const v=l.cardio||{}, vk=+v.km||0, vm=+v.minutes||0;
      const pv=(vk>0&&vm>0)?vm/vk:0;
      return pv>0 && vk>=km && pv<=pj;
    });
    if(geschlagen) out.push({label:'Best pace over '+fmtKg(km)+' km or more', wert:pace(min,km)});
  }
  return out;
}

function hiitRekorde(neu){
  const vorher=(DB.logs||[]).filter(l=>logArt(l)==='hiit' && l.id!==neu.id && l.hiit);
  if(!vorher.length) return [];
  const h=neu.hiit||{}; const out=[];
  const gleiche=vorher.filter(l=>l.hiit.work===h.work && l.hiit.rest===h.rest);
  if(gleiche.length){
    const maxR=Math.max(0,...gleiche.map(l=>+l.hiit.done||0));
    if((+h.done||0)>maxR) out.push({label:`Most rounds at ${h.work}s / ${h.rest}s`, wert:h.done});
  }
  const maxW=Math.max(0,...vorher.map(l=>+l.hiit.arbeitSek||0));
  if((+h.arbeitSek||0)>maxW) out.push({label:'Most work time', wert:fmtDauer(Math.round(h.arbeitSek/60))});
  return out;
}

function finishSession(){
  if(SESSION.kind==='endurance') return finishCardio();
  if(SESSION.kind==='hiit') return finishHiit();
  const s=SESSION;
  const exercises=s.exercises.map(ex=>({exId:ex.exId||exIdForName(ex.name),name:ex.name,muscle:ex.muscle,targetReps:ex.targetReps,
    sets:ex.sets.filter(x=>x.done).map(x=>({weight:+x.weight||0,reps:+x.reps||0,rir:(x.rir===''||x.rir==null)?null:+x.rir,done:true}))}))
    .filter(ex=>ex.sets.length);
  if(!exercises.length){ toast('No sets ticked yet'); return; }

  const dauerMs = Math.max(0, Date.now() - (+s.date || Date.now()));

  const rekorde=[];
  exercises.forEach(ex=>{
    const treffer=newRepRecords(ex, exFactor(ex.name, ex.exId));
    if(treffer.length) rekorde.push({name:ex.name, sets:treffer});
  });

  const vorLog=lastSessionLog(s.dayName);
  const neu={id:uid(),date:s.date,duration:dauerMs,kind:'strength',planId:s.planId||null,planName:s.planName,dayName:s.dayName,exercises};

  const bilanz={
    tag: s.dayName || 'Workout',
    dauer: dauerText(dauerMs),
    saetze: logDoneSets(neu),
    uebungen: exercises.length,
    jetzt: logVolume(neu),
    vorher: vorLog ? logVolume(vorLog) : 0,
    einheit: 'kg',
    proEx: exerciseDeltas(neu, vorLog),
    rekorde
  };

  if(bilanz.jetzt===0 && bilanz.vorher===0){
    bilanz.jetzt = logReps(neu);
    bilanz.vorher = vorLog ? logReps(vorLog) : 0;
    bilanz.einheit = 'reps';
  }

  DB.logs.push(neu);
  save(); SESSION=null; clearStoredSession(); closeRest();
  bilanz.serie = calcStreak();

  go('today');
  zeigeBilanz(bilanz);
}

function zeigeBilanz(b){
  const max=Math.max(b.jetzt, b.vorher, 1);

function showPlanOverview(id){
  const p=DB.plans.find(x=>x.id===id); if(!p) return;
  let missing=0;

  const kraftTage=p.days.filter(d=>tagArt(p,d)==='strength');
  const andereTage=p.days.length-kraftTage.length;
  const perDay=kraftTage.map(d=>{
    const cP={}, cS={};
    d.exercises.forEach(e=>{
      const m=exMetaById(e.exId)||exMeta(e.name);
      const prim = m ? (Array.isArray(m.pm)&&m.pm.length ? m.pm : (m.g?[m.g]:[])) : [];
      const sec  = (m && Array.isArray(m.sm)) ? m.sm : [];
      if(!prim.length && !sec.length){
        missing++;
        const fallback=(m&&m.g)||e.muscle||'—';
        cP[fallback]=(cP[fallback]||0)+1;
        return;
      }
      [...new Set(prim)].forEach(x=>{ cP[x]=(cP[x]||0)+1; });

      [...new Set(sec)].filter(x=>!prim.includes(x)).forEach(x=>{ cS[x]=(cS[x]||0)+1; });
    });
    return {name:d.name, exCount:d.exercises.length, cP, cS};
  });

  const tP={}, tS={};
  perDay.forEach(d=>{
    Object.entries(d.cP).forEach(([m,n])=>{ tP[m]=(tP[m]||0)+n; });
    Object.entries(d.cS).forEach(([m,n])=>{ tS[m]=(tS[m]||0)+n; });
  });

  const block=(count, max, sekundaer)=>{
    const arr=Object.entries(count).sort((a,b)=>b[1]-a[1]);
    if(!arr.length) return `<div class="faint" style="font-size:11.5px;padding:2px 0 6px">–</div>`;
    return arr.map(([m,n])=>`<div class="ov-row">
      <span class="ov-lbl">${esc(m)}</span>
      <div class="ov-track"><div class="ov-fill ${sekundaer?'sec':'acc'}" style="width:${Math.round(n/max*100)}%"></div></div>
      <span class="ov-val">${n}×</span>
    </div>`).join('');
  };
  const maxOf=(...objs)=>Math.max(1, ...objs.flatMap(o=>Object.values(o)));

  openModal(`<div class="grab"></div>
    <h2>${esc(p.name)}</h2>
    <p class="faint" style="font-size:12px;margin:4px 0 14px">How often is each muscle worked? Split into main and supporting load.</p>
    ${andereTage?`<div class="ov-note">
      ${mz(andereTage,'session','sessions')} left out — the muscle breakdown only covers strength.
    </div>`:''}
    ${missing?`<div class="ov-note">
      ${missing} ${missing===1?'exercise has':'exercises have'} no muscles set yet.
      The body region is counted instead. Add the muscles to the exercise for a more accurate overview.
    </div>`:''}

    ${perDay.map(d=>{
      const maxD=maxOf(d.cP, d.cS);
      return `<div class="card" style="padding:13px 15px;margin-bottom:10px">
        <div class="row between" style="margin-bottom:10px">
          <span style="font-weight:700;font-size:14px">${esc(d.name)}</span>
          <span class="faint" style="font-size:11px">${mz(d.exCount,'exercise','exercises')}</span>
        </div>
        ${d.exCount? `
          <div class="ov-sub">Primary</div>
          ${block(d.cP, maxD, false)}
          <div class="ov-sub" style="margin-top:10px">Secondary</div>
          ${block(d.cS, maxD, true)}
        ` : `<div class="faint" style="font-size:12px">No exercises yet.</div>`}
      </div>`;
    }).join('')}

    ${(Object.keys(tP).length||Object.keys(tS).length)?`<div class="card" style="padding:13px 15px;margin-bottom:10px;border-color:var(--accent-dim)">
      <div class="eyebrow" style="margin-bottom:10px;color:var(--accent-dim)">Whole plan</div>
      <div class="ov-sub">Primary</div>
      ${block(tP, maxOf(tP,tS), false)}
      <div class="ov-sub" style="margin-top:10px">Secondary</div>
      ${block(tS, maxOf(tP,tS), true)}
    </div>`:''}

    <button class="btn ghost" style="margin-top:4px" onclick="closeModal()">Close</button>
  `, true);
}

function addPlanDay(id){
  const p=DB.plans.find(x=>x.id===id); if(!p) return;
  p.days.push({name:nextDayName(p.days), exercises:[]});
  save(); renderView();
  toast(`“${p.days[p.days.length-1].name}” added`);
}

function setPlanPerWeek(id, n){
  const p=DB.plans.find(x=>x.id===id); if(!p) return;
  p.perWeek=+n; save();
}

function deletePlan(id){
  const p0=DB.plans.find(x=>x.id===id); if(!p0) return;
  const ec=p0.days.reduce((a,d)=>a+d.exercises.length,0);
  confirmModal('Delete plan?',
    `“${p0.name}” with ${p0.days.length} ${p0.days.length===1?'session':'sessions'} and ${ec} ${ec===1?'exercise':'exercises'}.`,
    'Delete', ()=>{
    const idx=DB.plans.findIndex(p=>p.id===id);
    if(idx<0) return;
    const plan=DB.plans[idx];

    const m=collapsedMap();
    const kHeute='today:'+id, kPlaene='plans:'+id;
    const zHeute=m[kHeute], zPlaene=m[kPlaene];

    DB.plans.splice(idx,1);
    delete m[kHeute]; delete m[kPlaene];
    save(); renderView();

    registerUndo(`“${plan.name}” deleted`, ()=>{
      DB.plans.splice(Math.min(idx, DB.plans.length), 0, plan);
      const m2=collapsedMap();
      if(zHeute!==undefined) m2[kHeute]=zHeute;
      if(zPlaene!==undefined) m2[kPlaene]=zPlaene;
    });
  });
}

let BUILDER=null;
let BUILDER_OPEN=false;

function openPlanBuilder(id, dayIndex){
  const p=id?JSON.parse(JSON.stringify(DB.plans.find(x=>x.id===id))):{id:uid(),name:'',kind:'strength',days:[{name:'Day A',exercises:[]}]};
  if(!p.perWeek) p.perWeek = id ? (p.days.length||3) : 3;
  BUILDER=p;
  BUILDER._neu = !id;
  BUILDER.page = Math.min(Math.max(+dayIndex||0,0), p.days.length-1);
  BUILDER.screen = !id ? 'setup' : (dayIndex==null ? 'plan' : 'session');
  BUILDER_OPEN=true; renderBuilder();
}

function syncBuilderFields(){
  const n=document.getElementById('planName'); if(n) BUILDER.name=n.value;
  const d=document.getElementById('bldDayName');
  if(d && BUILDER.days[BUILDER.page]) BUILDER.days[BUILDER.page].name=d.value;
  const sc=document.querySelector('.bld-scroll'); if(sc) BUILDER._scroll=sc.scrollTop;
}
function syncBuilderName(){ syncBuilderFields(); }

function bldGo(screen){ syncBuilderFields(); BUILDER._scroll=0; BUILDER.screen=screen; renderBuilder(); }
function bldOpenDay(i){ syncBuilderFields(); BUILDER._scroll=0; BUILDER.page=i; BUILDER.screen='session'; renderBuilder(); }
function setBldKind(k){ syncBuilderFields(); BUILDER.kind=k; (BUILDER.days||[]).forEach(d=>{ delete d.kind; }); renderBuilder(); }
function setTagArt(di, k){ syncBuilderFields(); const d=BUILDER.days[di]; if(!d) return; if(k===planArt(BUILDER)) delete d.kind; else d.kind=k; renderBuilder(); }
function setBldPerWeek(n){ syncBuilderFields(); BUILDER.perWeek=+n; BUILDER._pwFest=true; renderBuilder(); }

function setBldDayCount(n){
  syncBuilderFields();
  const d=BUILDER.days;
  while(d.length<n) d.push({name:nextDayName(d),exercises:[]});
  while(d.length>n && !d[d.length-1].exercises.length) d.pop();
  if(!BUILDER._pwFest) BUILDER.perWeek=d.length;
  BUILDER.page=Math.min(BUILDER.page, d.length-1);
  renderBuilder();
}

function bldChips(wert, aktion, bis){
  return `<div class="bld-chips">${Array.from({length:bis||7},(_,i)=>i+1).map(n=>
    `<button class="bld-chip${n===+wert?' on':''}" onclick="${aktion}(${n})"
      aria-pressed="${n===+wert?'true':'false'}">${n}</button>`).join('')}</div>`;
}

function renderBuilder(){
  const p=BUILDER;
  if(p.page==null) p.page=0;
  if(p.page>p.days.length-1) p.page=Math.max(0,p.days.length-1);
  const inhalt = p.screen==='setup' ? bldSetup()
               : p.screen==='plan'  ? bldOverview()
               :                      bldSession();
  openModal(`<div class="grab"></div><div class="bld">${inhalt}</div>`, false, 'bld-modal');
  if(p.screen==='session'){
    initTouchDrag(); initBldSwipe();
    const sc=document.querySelector('.bld-scroll');
    if(sc && p._scroll) sc.scrollTop=p._scroll;
  }
  guardModal(p._neu?'New plan':'Edit plan', ()=>renderBuilder(), ()=>savePlan(), ()=>syncBuilderFields());
}

function goDay(i){
  const n=BUILDER.days.length;
  if(i<0||i>n-1) return;
  syncBuilderName();
  BUILDER.page=i;
  renderBuilder();
}

function initBldSwipe(){
  const el=document.getElementById('bldPage'); if(!el) return;
  let x0=null,y0=null,moved=false,skip=false;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    skip = !!e.target.closest('.bld-grip');
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; moved=false;
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(x0==null||skip) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10) moved=true;
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0==null||skip||!moved){ x0=null; skip=false; return; }
    const dx=e.changedTouches[0].clientX-x0;
    x0=null;
    if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if(dx<-45) goDay(BUILDER.page+1);
    else if(dx>45) goDay(BUILDER.page-1);
  },{passive:true});
}

let _dragDi=null, _dragEi=null;
function moveExercise(di, from, to){
  if(from===to || to<0) return;
  const arr=BUILDER.days[di].exercises;
  if(to>=arr.length) to=arr.length-1;
  const [item]=arr.splice(from,1);
  arr.splice(to,0,item);

function dragStart(ev,di,ei){ _dragDi=di; _dragEi=ei; ev.dataTransfer.effectAllowed='move';

function dragEnd(ev){ ev.currentTarget.classList.remove('dragging');

function dragOver(ev,di,ei){ if(_dragDi!==di) return; ev.preventDefault(); ev.dataTransfer.dropEffect='move';
  ev.currentTarget.classList.add('drop-target'); }
function dragLeave(ev){ ev.currentTarget.classList.remove('drop-target'); }
function dragDrop(ev,di,ei){ if(_dragDi!==di) return; ev.preventDefault();

let _touchDrag=null;
function initTouchDrag(){
  document.querySelectorAll('.bld-grip').forEach(grip=>{
    grip.addEventListener('touchstart', onGripTouchStart, {passive:false});
  });
}
function onGripTouchStart(ev){
  const row=ev.target.closest('.bld-row'); if(!row) return;
  ev.preventDefault();
  const di=+row.dataset.di, ei=+row.dataset.ei;
  const list=row.closest('.bld-exlist');
  row.classList.add('dragging');
  _touchDrag={di, from:ei, row, list};
  const move=e=>{
    const t=e.touches[0];
    const rows=[...list.querySelectorAll('.bld-row')];
    let target=null;
    for(const r of rows){ const rc=r.getBoundingClientRect();
      if(t.clientY>=rc.top && t.clientY<=rc.bottom){ target=r; break; } }
    rows.forEach(r=>r.classList.remove('drop-target'));
    if(target && target!==row) target.classList.add('drop-target');
    _touchDrag.overEi = target? +target.dataset.ei : null;
  };
  const end=()=>{
    document.removeEventListener('touchmove',move);
    document.removeEventListener('touchend',end);
    if(_touchDrag && _touchDrag.overEi!=null && _touchDrag.overEi!==_touchDrag.from){
      moveExercise(_touchDrag.di,_touchDrag.from,_touchDrag.overEi);
      _touchDrag=null; renderBuilder();
    } else { row.classList.remove('dragging');
      list.querySelectorAll('.drop-target').forEach(r=>r.classList.remove('drop-target')); _touchDrag=null; }
  };
  document.addEventListener('touchmove',move,{passive:false});
  document.addEventListener('touchend',end);
}

let HIST_MONTH=null;
function viewHistory(){
  if(!DB.logs.length) return topbar('Training history')+`<div class="pad"><div class="empty">${I.history}
    <h3>No workouts yet</h3><p style="font-size:13.5px">Your finished sessions will show up here.</p></div></div>`;
  const now=new Date();
  if(!HIST_MONTH) HIST_MONTH={year:now.getFullYear(), month:now.getMonth()};
  return topbar('Training history')+`<div class="pad">${calendarHtml()}</div>`;
}

function logsByDay(){
  const map={};
  DB.logs.forEach(l=>{
    const d=new Date(l.date);
    const key=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
    (map[key]||(map[key]=[])).push(l);
  });
  return map;
}

function dayCompletion(dayLogs){
  let best=0;
  dayLogs.forEach(l=>{
    let pct=1;
    const plan=(l.planId && DB.plans.find(p=>p.id===l.planId)) || DB.plans.find(p=>p.name===l.planName);
    const day=plan && (plan.days||[]).find(d=>d.name===l.dayName);
    if(day && day.exercises && day.exercises.length){
      pct=Math.min(1, (l.exercises||[]).length / day.exercises.length);
    }
    best=Math.max(best, pct);
  });
  return best;
}
function calendarHtml(){
  const {year, month}=HIST_MONTH;
  const byDay=logsByDay();
  const first=new Date(year, month, 1);
  const daysInMonth=new Date(year, month+1, 0).getDate();

  let startWd=first.getDay(); startWd=(startWd===0)?6:startWd-1;
  const monthName=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const today=new Date();
  const todayKey=today.getFullYear()+'-'+today.getMonth()+'-'+today.getDate();

  const monthStart=new Date(year,month,1).getTime();
  const monthEnd=new Date(year,month+1,1).getTime();
  const hasOlder=DB.logs.some(l=>l.date<monthStart);
  const hasNewer=DB.logs.some(l=>l.date>=monthEnd);

  const wd=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let cells='';

  for(let day=1;day<=daysInMonth;day++){
    const key=year+'-'+month+'-'+day;
    const dayLogs=byDay[key]||[];
    const trained=dayLogs.length>0;
    const isToday=(key===todayKey);
    const cls=['cal-cell'];
    if(trained) cls.push('trained');
    if(isToday) cls.push('today');

    const styles=[];
    if(day===1) styles.push(`grid-column-start:${startWd+1}`);
    if(trained) styles.push(`--fill:${Math.round(dayCompletion(dayLogs)*100)}%`);
    const colStyle = styles.length ? ` style="${styles.join(';')}"` : '';

    const badge = dayLogs.length>1 ? `<span class="cal-badge">${dayLogs.length}</span>` : '';
    const onclick = trained ? ` onclick="openDayLogs('${key}')"` : '';
    cells+=`<div class="${cls.join(' ')}"${colStyle}${onclick}>
      <span class="cal-num">${day}</span>${badge}
    </div>`;
  }

  const monthLogs=DB.logs.filter(l=>l.date>=monthStart && l.date<monthEnd);
  const mVol=monthLogs.reduce((a,l)=>a+logVolume(l),0);
  const trainDays=new Set(monthLogs.map(l=>{const d=new Date(l.date);return d.getDate();})).size;

  return `<div class="cal-wrap">
    <div class="cal-head">
      <button class="cal-nav" onclick="histShiftMonth(-1)" ${hasOlder?'':'disabled'} aria-label="Previous month">${I.chevronL}</button>
      <div class="cal-title">${monthName}</div>
      <button class="cal-nav" onclick="histShiftMonth(1)" ${hasNewer?'':'disabled'} aria-label="Next month">${I.chevron}</button>
    </div>
    <div class="cal-grid cal-wd">${wd.map(d=>`<div class="cal-wdlbl">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    ${monthLogs.length?`<div class="cal-summary">
      <div class="cal-sum-item"><span class="cal-sum-num">${trainDays}</span><span class="cal-sum-lbl">${trainDays===1?'training day':'training days'}</span></div>
      <div class="cal-sum-item"><span class="cal-sum-num">${monthLogs.length}</span><span class="cal-sum-lbl">${monthLogs.length===1?'session':'sessions'}</span></div>
      <div class="cal-sum-item"><span class="cal-sum-num">${(mVol/1000).toFixed(1)}<span style="font-size:13px;color:var(--text-dim)">t</span></span><span class="cal-sum-lbl">Volume</span></div>
    </div>`:`<div class="cal-empty-month">No workouts this month</div>`}
  </div>`;
}
function histShiftMonth(dir){
  let {year, month}=HIST_MONTH;
  month+=dir;
  if(month<0){ month=11; year--; }
  else if(month>11){ month=0; year++; }
  HIST_MONTH={year, month};
  renderView();
}

function vorherigeEinheit(log){
  let best=null;
  (DB.logs||[]).forEach(l=>{
    if(l.id===log.id || l.dayName!==log.dayName || l.date>=log.date) return;
    if(!best || l.date>best.date) best=l;
  });
  return best;
}
function exVolInEintrag(e){
  const f=exFactor(e.name, e.exId);
  return (e.sets||[]).filter(s=>s.done!==false)
    .reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
}
function exRepsInEintrag(e){
  return (e.sets||[]).filter(s=>s.done!==false).reduce((a,s)=>a+(+s.reps||0),0);
}
function vergleicheEinheiten(log){
  const vorher=vorherigeEinheit(log);
  const leer={vorher:null, gemeinsam:[], neu:[], weg:[],
              summeJetzt:0, summeVorher:0, pct:null, einheit:'kg'};
  if(!log) return leer;
  if(!vorher) return Object.assign({}, leer, {vorher:null});

  const passt=(x,y)=> (x.exId && y.exId) ? x.exId===y.exId : x.name===y.name;
  const alt=[...(vorher.exercises||[])];
  const gemeinsam=[], neu=[], weg=[];

  (log.exercises||[]).forEach(e=>{
    const i=alt.findIndex(a=>passt(e,a));
    if(i<0){ neu.push({exId:e.exId, name:e.name, vol:exVolInEintrag(e), reps:exRepsInEintrag(e)}); return; }
    const a=alt.splice(i,1)[0];
    const jv=exVolInEintrag(e), vv=exVolInEintrag(a);
    const jr=exRepsInEintrag(e), vr=exRepsInEintrag(a);

    const wdh = (jv===0 && vv===0 && (jr>0 || vr>0));
    gemeinsam.push({exId:e.exId, name:e.name,
      jetzt: wdh?jr:jv, vorher: wdh?vr:vv, einheit: wdh?'reps':'kg',
      pct: (!wdh && vv>0) ? Math.round((jv/vv-1)*100)
         : ( wdh && vr>0) ? Math.round((jr/vr-1)*100) : null});
  });
  alt.forEach(a=>weg.push({exId:a.exId, name:a.name, vol:exVolInEintrag(a), reps:exRepsInEintrag(a)}));

  const alleWdh = gemeinsam.length>0 && gemeinsam.every(g=>g.einheit==='reps');
  const einheit = alleWdh?'reps':'kg';
  const summeJetzt  = gemeinsam.reduce((a,g)=>a+(g.einheit===einheit?g.jetzt :0),0);
  const summeVorher = gemeinsam.reduce((a,g)=>a+(g.einheit===einheit?g.vorher:0),0);

  const pct = (gemeinsam.length>=2 && summeVorher>0)
    ? Math.round((summeJetzt/summeVorher-1)*100) : null;

  return {vorher, gemeinsam, neu, weg, summeJetzt, summeVorher, pct, einheit};
}
function vergleichsBlock(log){
  const v=vergleicheEinheiten(log);
  if(!v.vorher) return `<div class="cmp-empty">First time doing this session — nothing to compare yet.</div>`;
  const zahl=n=>n.toLocaleString('en-GB');
  const pill=p=>p==null?'' : `<span class="cmp-delta ${p>0?'up':(p<0?'down':'same')}">${p>0?'+':''}${p}%</span>`;
  const zeile=g=>`<div class="cmp-row">
      <span class="cmp-name">${esc(g.name)}</span>
      <span class="cmp-num">${zahl(g.vorher)} → ${zahl(g.jetzt)} ${g.einheit}</span>
      ${pill(g.pct)}
    </div>`;
  const extra=(titel,list)=>list.length? `<div class="cmp-extra">
      <div class="cmp-extra-t">${titel}</div>
      ${list.map(x=>`<div class="cmp-row">
        <span class="cmp-name">${esc(x.name)}</span>
        <span class="cmp-num">${x.vol>0?zahl(x.vol)+' kg':zahl(x.reps)+' reps'}</span>
      </div>`).join('')}
    </div>`:'';
  const n=v.gemeinsam.length;
  return `<div class="cmp">
    <div class="cmp-head">
      <span class="eyebrow">vs. ${fmtDate(v.vorher.date)}</span>
      ${pill(v.pct)}
    </div>
    ${n? `${n>=2? `<div class="cmp-sum">${zahl(v.summeVorher)} → <b>${zahl(v.summeJetzt)}</b> ${v.einheit}</div>
        <div class="cmp-basis">across ${n} exercises in common</div>`

      : `<div class="cmp-basis">Only one exercise in common — too few for a session total.</div>`}
      ${v.gemeinsam.map(zeile).join('')}`
    : `<div class="cmp-basis">No exercise in common — the session was changed completely.</div>`}
    ${extra('New', v.neu)}
    ${extra('Dropped', v.weg)}
  </div>`;
}

function showLogDetail(id){
  const l=DB.logs.find(x=>x.id===id); if(!l) return;
  if(logArt(l)==='endurance'){ openModal(cardioDetail(l)); return; }
  if(logArt(l)==='hiit'){ openModal(hiitDetail(l)); return; }
  const vol=logVolume(l);
  openModal(`<div class="grab"></div>
    <h2>${esc(l.dayName)}</h2>
    <div class="faint" style="font-size:12.5px;margin-bottom:14px">${fmtDate(l.date)} · ${fmtDay(l.date)} · ${esc(l.planName||'')}</div>
    <div class="row wrap" style="gap:8px;margin-bottom:18px">
      <span class="chip" style="color:var(--accent);border-color:var(--accent-dim)">${vol.toLocaleString('en-GB')} kg volume</span>

      ${l.duration?`<span class="chip">${dauerText(l.duration)}</span>`:''}
    </div>
    ${vergleichsBlock(l)}

      const f=exFactor(e.name);

      const meta=exMeta(e.name); const th=meta?meta.img[0]:null;
      return `<div class="det-ex">
        <div class="row between" style="margin-bottom:10px">
          <div class="row" style="gap:10px;min-width:0">
            ${th?`<div class="ex-thumb" style="width:40px;height:40px;cursor:pointer" onclick='showExercise("${escAttr(e.name)}")'><img loading="lazy" src="${th}" alt="" onerror="this.parentNode.classList.add('noimg')"></div>`:''}

          <span class="num" style="color:var(--text-faint)">${i+1}</span>
          <span class="num" style="font-weight:600">${s.weight} kg${f===2?` <span style="color:var(--text-faint);font-weight:400">(tot. ${(+s.weight||0)*2} kg)</span>`:''}</span>
          <span class="num" style="font-weight:600">${s.reps} reps</span>
          <span class="num" style="color:var(--text-dim)">${(s.rir!=null&&s.rir!=='')?('RIR '+s.rir):'–'}</span>
        </div>`).join('')}

    }).join('')}
    <div class="log-actions" style="margin-top:16px">
      <button class="log-btn" onclick="closeModal();editLog('${l.id}')">${I.edit}<span>Edit</span></button>

}

const LBL_L=-10, LBL_R=310;
const FIG_L=-10,  FIG_R=310;

function bodySvg(active, opts){
  opts=opts||{};
  const klick=!!opts.interaktiv;
  const g=BODY_GUIDES[active];

  let pfeil='';
  if(g){
    const dx=g.x2-g.x1, dy=g.y2-g.y1, L=Math.hypot(dx,dy)||1;
    const ux=dx/L, uy=dy/L;
    const nx=-uy, ny=ux;
    const E=22, AH=8, AB=4.2, T=9;
    const r=v=>Math.round(v*10)/10;
    const a1x=r(g.x1-ux*E), a1y=r(g.y1-uy*E);
    const a2x=r(g.x2+ux*E), a2y=r(g.y2+uy*E);

    const spitze=(x,y,s)=>`M${r(x)},${r(y)} L${r(x+ux*AH*s+nx*AB)},${r(y+uy*AH*s+ny*AB)} `+
                          `L${r(x+ux*AH*s-nx*AB)},${r(y+uy*AH*s-ny*AB)} Z`;

    const strich=(x,y,cls)=>`<line class="tick ${cls}" x1="${r(x-nx*T)}" y1="${r(y-ny*T)}" `+
                            `x2="${r(x+nx*T)}" y2="${r(y+ny*T)}"/>`;
    pfeil=`<g class="mess-linie">
      <line class="halo" x1="${a1x}" y1="${a1y}" x2="${a2x}" y2="${a2y}"/>
      <line x1="${a1x}" y1="${a1y}" x2="${a2x}" y2="${a2y}"/>
      <path d="${spitze(a1x,a1y,1)}"/>
      <path d="${spitze(a2x,a2y,-1)}"/>
      ${strich(g.x1,g.y1,'halo')}${strich(g.x2,g.y2,'halo')}
      ${strich(g.x1,g.y1,'')}${strich(g.x2,g.y2,'')}
    </g>`;
  }

  let labels='';
  if(opts.beschriftet){
    labels=BODY_LABELS.map(L=>{
      const m=BODY_METRICS.find(x=>x.key===L.key); if(!m) return '';
      const cur=lastMeasure(m.key), prev=prevMeasure(m.key);
      const diff=(cur&&prev)? Math.round((cur.value-prev.value)*10)/10 : null;
      const links=L.seite==='l';
      const tx=links?LBL_L:LBL_R;
      const anchor=links?'end':'start';
      const kx=links?LBL_L+6:LBL_R-6;
      const g=BODY_GUIDES[m.region];
      let ax,ay;
      if(g){ const nimmLinks=(g.x1<=g.x2)===links; ax=nimmLinks?g.x1:g.x2; ay=nimmLinks?g.y1:g.y2; }
      else { ax=links?110:190; ay=26; }
      const aktiv = BODY_ACTIVE_KEY===m.key;
      const wert = cur? `${cur.value}` : '–';

      const dTxt = (diff!=null&&diff!==0) ? `${diff>0?'+':''}${diff}` : '';
      const dCls = diff>0?'up':'down';
      const inhalt = `${wert}<tspan class="lbl-unit"> ${m.unit}</tspan>`;
      const nameZeile = links
        ? `${dTxt?`<tspan class="lbl-diff ${dCls}">${dTxt} </tspan>`:''}${esc(L.kurz)}`
        : `${esc(L.kurz)}${dTxt?`<tspan class="lbl-diff ${dCls}"> ${dTxt}</tspan>`:''}`;
      return `<g class="lbl${aktiv?' on':''}" onclick="editMeasure('${m.key}')">
        <path class="lbl-lead" d="M${kx},${L.y} L${(kx+ax)/2},${L.y} L${ax},${ay}"/>
        <circle class="lbl-dot" cx="${ax}" cy="${ay}" r="3.2"/>
        <rect class="lbl-hit" x="${links?tx-96:tx-4}" y="${L.y-20}" width="100" height="36"/>
        <text class="lbl-name" x="${tx}" y="${L.y-5}" text-anchor="${anchor}">${nameZeile}</text>
        <text class="lbl-val" id="lblval-${m.key}" x="${tx}" y="${L.y+13}" text-anchor="${anchor}">${inhalt}</text>
      </g>`;
    }).join('');
  }
  const narrow = opts.beschriftet && window.innerWidth<520;
  const vb = opts.beschriftet ? (narrow?"-104 -16 508 486":"-118 -16 536 486") : BODY_VIEWBOX;
  return `<svg viewBox="${vb}" class="body-fig${opts.beschriftet?' with-labels':''}${narrow?' narrow':''}" xmlns="http://www.w3.org/2000/svg">
    <path class="body-fill" d="${BODY_SIL}"/>
    ${BODY_DEKO.map(d=>`<path class="body-deko" d="${d}"/>`).join('')}
    ${Object.keys(BODY_REGIONS).map(k=>{
      const m=BODY_METRICS.find(x=>x.region===k);

      const nm = m ? m.label : '';
      return `<path class="body-reg${active===k?' on':''}" d="${BODY_REGIONS[k]}"
        ${klick&&nm?`aria-label="${escAttr(nm)} messen"`:''}
        ${klick?`onclick="editMeasure('${m?m.key:''}')"`:''}></path>`;
    }).join('')}
    <path class="body-outline" d="${BODY_SIL}"/>
    ${pfeil}
    ${labels}
  </svg>`;
}

function lastMeasure(key){
  const list=(DB.measurements||[]).filter(m=>m.vals && m.vals[key]!=null).sort((a,b)=>b.date-a.date);
  return list.length? {value:list[0].vals[key], date:list[0].date} : null;
}

function prevMeasure(key){
  const list=(DB.measurements||[]).filter(m=>m.vals && m.vals[key]!=null).sort((a,b)=>b.date-a.date);
  return list.length>1? {value:list[1].vals[key], date:list[1].date} : null;
}
function viewBody(){
  const active=BODY_ACTIVE_KEY? BODY_METRICS.find(m=>m.key===BODY_ACTIVE_KEY) : null;
  const anz=(DB.measurements||[]).length;
  const gemessen=BODY_METRICS.filter(m=>lastMeasure(m.key));
  return topbar('Body measurements')+`<div class="pad">
    <div class="card body-card">
      <div class="eyebrow" style="width:100%;margin-bottom:2px">Your measurements</div>
      <div class="body-wrap" id="bodyWrap">
        ${bodySvg(BODY_ACTIVE, {interaktiv:true, beschriftet:true})}
        <input class="ms-inline" id="msInline" inputmode="decimal"
          style="display:none" onkeydown="inlineKey(event)" onblur="inlineSave()">
      </div>
      <div class="body-cap">
        <div class="body-cap-t" id="bodyCapT">${active?esc(active.label):'Tap a site'}</div>
        <div class="body-cap-h" id="bodyCapH">${active?esc(active.hint):'The guide line shows exactly where to measure.'}</div>
      </div>
    </div>

    ${gemessen.length? `<div class="card" style="margin-top:14px">
      <div class="eyebrow" style="margin-bottom:6px">Trend</div>
      <p class="faint" style="font-size:11px;margin-bottom:10px">One measurement site across all measuring days</p>
      <div class="field" style="margin:0 0 4px">
        <select class="input" id="msSel" aria-label="Measurement site for the chart" onchange="renderMeasureChart(this.value)">
          ${gemessen.map(m=>{
            const pct=measureTrend(m.key);
            return `<option value="${m.key}">${esc(m.label)}${pct!=null?`  ·  ${pct>0?'+':''}${pct}${m.unit}`:''}</option>`;
          }).join('')}
        </select></div>
      <div id="msChart"></div>
    </div>`:''}

    ${anz? `<div class="card" style="margin-top:14px">
      <div class="eyebrow" style="margin-bottom:4px">Measuring days</div>
      <p class="faint" style="font-size:11px;margin-bottom:10px">${anz} ${anz===1?'entry':'entries'}</p>
      ${[...DB.measurements].sort((a,b)=>b.date-a.date).slice(0,8).map(m=>{
        const werte=Object.entries(m.vals||{}).filter(([k,v])=>v!=null);
        return `<div class="ms-hist">
          <div class="row between">
            <span style="font-weight:700;font-size:13px">${fmtDate(m.date)}</span>
            <button class="ms-del" onclick="deleteMeasureDay('${m.id}')" title="Delete measurement" aria-label="Delete measurement">${I.trash}</button>
          </div>
          <div class="ms-hist-vals">${werte.map(([k,v])=>{
            const def=BODY_METRICS.find(x=>x.key===k);
            return `<span class="ms-pill">${esc(def?def.label:k)} <b>${v}${def?def.unit:''}</b></span>`;
          }).join('') || '<span class="faint" style="font-size:11.5px">No values</span>'}</div>
        </div>`;
      }).join('')}
    </div>`:''}
  </div>`;
}

function measureTrend(key){
  const list=(DB.measurements||[]).filter(m=>m.vals&&m.vals[key]!=null).sort((a,b)=>a.date-b.date);
  if(list.length<2) return null;
  return Math.round((list[list.length-1].vals[key]-list[0].vals[key])*10)/10;
}

function renderMeasureChart(key){
  const el=document.getElementById('msChart'); if(!el) return;
  const m=BODY_METRICS.find(x=>x.key===key); if(!m) return;
  const rows=(DB.measurements||[]).filter(x=>x.vals&&x.vals[key]!=null)
    .map(x=>({date:x.date, v:x.vals[key]})).sort((a,b)=>a.date-b.date);
  if(!rows.length){ el.innerHTML=`<div class="faint" style="font-size:12.5px;padding:14px 0">No values yet.</div>`; return; }
  let chart='';
  if(rows.length>=2){
    const vs=rows.map(r=>r.v), max=Math.max(...vs), min=Math.min(...vs), sp=(max-min)||1;
    const W=100,H=80;
    const pfad=rows.map((r,i)=>{const x=i/(rows.length-1)*W, y=H-((r.v-min)/sp)*H; return `${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');
    const flaeche=`M0,${H} `+rows.map((r,i)=>{const x=i/(rows.length-1)*W, y=H-((r.v-min)/sp)*H; return `L${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ')+` L${W},${H} Z`;
    const d=rows[rows.length-1].v-rows[0].v, dr=Math.round(d*10)/10;
    chart=`<div class="row between" style="margin:8px 0 10px">
        <span class="faint" style="font-size:12px">${mz(rows.length,'measurement','measurements')}</span>
        <span class="pill ${d>0?'up':d<0?'down':'same'}">${d>0?'+':''}${dr} ${m.unit}</span></div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:110px;overflow:visible">
        <defs><linearGradient id="msgrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
        <path d="${flaeche}" fill="url(#msgrad)"/>
        <path d="${pfad}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
  }
  el.innerHTML=chart+`<div class="prog-table">
    <div class="prog-row prog-head" style="grid-template-columns:1.4fr 1fr 1fr">
      <span>Date</span><span>Value</span><span>Δ</span></div>
    ${[...rows].reverse().map((r,i,arr)=>{
      const vor=arr[i+1];
      const d=vor? Math.round((r.v-vor.v)*10)/10 : null;

function openInline(key){

function importData(ev){
  const file=ev.target.files&&ev.target.files[0];
  ev.target.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    let parsed;
    try{ parsed=JSON.parse(reader.result); }
    catch(e){ toast('The file could not be read'); return; }
    const d = parsed && parsed.data ? parsed.data : parsed;
    if(!d || (!Array.isArray(d.plans) && !Array.isArray(d.logs))){
      toast('Not a valid backup file'); return;
    }
    const nP=Array.isArray(d.plans)?d.plans.length:0;
    const nL=Array.isArray(d.logs)?d.logs.length:0;
    const nC=Array.isArray(d.customEx)?d.customEx.length:0;
    confirmModal('Restore backup?',
      `The file contains ${mz(nP,'plan','plans')}, ${mz(nL,'workout','workouts')}${nC?` and ${nC} custom exercises`:''}. This will replace your current data.`,
      'Wiederherstellen',()=>{
        clearUndo();
        DB.plans = Array.isArray(d.plans)? d.plans : [];
        DB.logs  = Array.isArray(d.logs)?  d.logs  : [];
        DB.customEx = Array.isArray(d.customEx)? d.customEx : [];
        DB.measurements = Array.isArray(d.measurements)? d.measurements : [];
        if(d.settings && typeof d.settings==='object') DB.settings=Object.assign(DB.settings||{},d.settings);
        DB.logs.sort((a,b)=>a.date-b.date);
        rebuildExDB();
        migrateToEnglish();
        migrateMuscleNames();
        migrateExerciseIds();
        migrateEquipToEnglish();
        migrateKind();
        save(); go('stats'); toast('Backup restored ✓');
      });
  };
  reader.readAsText(file);
}

function statsPeriod(range){
  const now=new Date(), y=now.getFullYear(), mo=now.getMonth();
  if(range==='week'){
    const cur=weekStartTs(Date.now());
    return {from:cur, prevFrom:cur-7*86400000, prevTo:cur,
            titel:'This week vs. last week', kurz:'this week'};
  }
  if(range==='month'){
    const cur=new Date(y,mo,1).getTime();
    return {from:cur, prevFrom:new Date(y,mo-1,1).getTime(), prevTo:cur,
            titel:'This month vs. last month', kurz:'this month'};
  }
  if(range==='year'){
    const cur=new Date(y,0,1).getTime();
    return {from:cur, prevFrom:new Date(y-1,0,1).getTime(), prevTo:cur,
            titel:'This year vs. last year', kurz:'this year'};
  }
  return {from:0, prevFrom:null, prevTo:null, titel:'', kurz:'total'};
}

function weekStartTs(ts){ const d=new Date(ts); const wd=(d.getDay()+6)%7; d.setHours(0,0,0,0); return d.getTime()-wd*86400000; }

function exProgressPct(key){
  const byName = key && key.indexOf('name:')===0;
  const exId = byName ? null : key;
  const name = byName ? key.slice(5) : (exMetaById(key) ? exMetaById(key).n : key);
  const f=exFactor(name, exId);
  const vols=[];
  DB.logs.forEach(l=>{
    const e=l.exercises.find(x=> (exId && x.exId===exId) || x.name===name);
    if(!e) return;
    const v=e.sets.filter(s=>s.done!==false).reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
    if(v>0) vols.push(v);
  });
  if(vols.length<2) return null;
  const first=vols[0], last=vols[vols.length-1];
  return first? Math.round((last-first)/first*100) : null;
}

  return `<span class="wk-delta ${cls}">${txt}</span>`;

function kmVerlauf(range){
  const t=volumeTrend(range, logKm);
  if(!t.eimer.some(b=>b.vol>0)) return '';
  const maxV=Math.max(...t.eimer.map(b=>b.vol), 1);
  const zeigen=t.eimer.length<=8;
  return `<div style="margin-top:14px">
    <div class="trend-legend"><span>Distance ${t.proWoche?'per week':'per month'}</span></div>
    <div class="trend">
      ${t.eimer.map(b=>{
        const h=b.vol>0?Math.max(Math.round(b.vol/maxV*70),4):2;
        return `<div class="trend-col ${b.stufe}" title="${escAttr(b.label+' · '+(Math.round(b.vol*10)/10)+' km')}">
          ${zeigen?`<div class="trend-val num">${b.vol>0?(Math.round(b.vol*10)/10):'–'}</div>`:''}
          <div class="trend-plot" style="height:70px"><div class="trend-bar ${b.stufe}" style="height:${h}px"></div></div>
          <div class="trend-lbl">${esc(b.label)}</div>
        </div>`;}).join('')}
    </div>
  </div>`;
}

function volumeTrend(range, wertFn){
  const wert = wertFn || logVolume;
  const per=statsPeriod(range);
  const proWoche = (range==='week' || range==='month');
  const anzahl = proWoche ? 8 : 12;
  const jetzt=new Date();
  const eimer=[];
  for(let i=anzahl-1;i>=0;i--){
    let von, bis, label;
    if(proWoche){
      von = weekStartTs(Date.now()) - i*7*86400000;
      bis = von + 7*86400000;
      const d=new Date(von);
      label = d.getDate()+'/'+(d.getMonth()+1);
    } else {
      von = new Date(jetzt.getFullYear(), jetzt.getMonth()-i, 1).getTime();
      bis = new Date(jetzt.getFullYear(), jetzt.getMonth()-i+1, 1).getTime();
      label = new Date(von).toLocaleDateString('en-GB',{month:'short'});
    }
    const mitte=(von+bis)/2;
    const logs=DB.logs.filter(l=>l.date>=von && l.date<bis);
    let stufe='old';
    if(range==='all') stufe='now';
    else if(mitte>=per.from) stufe='now';
    else if(per.prevFrom!=null && mitte>=per.prevFrom && mitte<per.prevTo) stufe='prev';
    eimer.push({von, bis, label, stufe,
      vol: logs.reduce((a,l)=>a+wert(l),0),
      einheiten: logs.length});
  }
  const summe=(von,bis)=>DB.logs.filter(l=>l.date>=von && l.date<bis)
    .reduce((a,l)=>a+wert(l),0);
  const nun=Date.now();
  const jetztSum = summe(range==='all'?0:per.from, nun);
  const bisher = nun - per.from;
  const vorSum = per.prevFrom!=null
    ? summe(per.prevFrom, Math.min(per.prevFrom+bisher, per.prevTo)) : 0;
  const angebrochen = per.prevTo!=null && (per.prevFrom+bisher) < per.prevTo;
  return {eimer, proWoche, jetztSum, vorSum, angebrochen, hatVor: per.prevFrom!=null};
}

function trendKarte(range){
  const t=volumeTrend(range);
  const maxV=Math.max(...t.eimer.map(b=>b.vol), 1);
  if(!t.eimer.some(b=>b.vol>0))
    return `<div class="card" style="margin-top:14px">
      <div class="eyebrow" style="margin-bottom:4px">Volume trend</div>
      <p class="faint" style="font-size:12.5px;margin:0">Not enough workouts yet.</p></div>`;

  const namen={week:['This week','Last week'], month:['This month','Last month'],
               year:['This year','Last year'], all:['All time','']};
  const [nName, vName]=namen[range]||namen.month;
  const werteZeigen = t.eimer.length<=8;
  const tonne=v=>Math.round(v/100)/10;

  const vergleichbar = t.hatVor && t.vorSum>0 && t.jetztSum>0;
  const d = vergleichbar ? Math.round((t.jetztSum/t.vorSum-1)*100) : null;
  const bis = t.angebrochen ? ' so far' : '';
  const delta = vergleichbar
    ? `<span class="vc-delta ${d>0?'up':(d<0?'down':'same')}" title="${escAttr(nName+bis+' against the same stretch of '+vName.toLowerCase())}">${d>0?'+':''}${d}%</span>`
    : '';

  return `<div class="card" style="margin-top:14px">
    <div class="row between" style="margin-bottom:6px">
      <span class="eyebrow" style="margin:0">Volume trend</span>${delta}
    </div>
    <div class="trend-legend">
      <span>${t.proWoche?'Per week':'Per month'}${(DB.logs||[]).some(l=>logArt(l)!=='strength')?' · strength only':''}</span>
      <span><i class="trend-key now"></i>${nName}</span>
      ${t.hatVor?`<span><i class="trend-key prev"></i>${vName}</span>`:''}
    </div>
    ${vergleichbar?`<p class="faint" style="font-size:11px;margin:0 0 2px">
      ${nName}${bis} ${tonne(t.jetztSum)} t &middot; ${tonne(t.vorSum)} t at the same point ${vName.toLowerCase()}</p>`:''}
    <div class="trend">
      ${t.eimer.map(b=>{
        const h=b.vol>0 ? Math.max(Math.round(b.vol/maxV*104), 4) : 2;
        const titel=`${b.label} · ${tonne(b.vol)} t · ${mz(b.einheiten,'session','sessions')}`;
        return `<div class="trend-col ${b.stufe}" title="${escAttr(titel)}">
          ${werteZeigen?`<div class="trend-val num">${b.vol>0?tonne(b.vol)+'t':'–'}</div>`:''}
          <div class="trend-plot"><div class="trend-bar ${b.stufe}" style="height:${h}px"></div></div>
          <div class="trend-lbl">${esc(b.label)}</div>
        </div>`;}).join('')}
    </div>
  </div>`;
}

function renderExerciseProgress(key){
  const el=document.getElementById('strChart'); if(!el) return;

  const byName = key && key.indexOf('name:')===0;
  const exId = byName ? null : key;
  const name = byName ? key.slice(5) : (exMetaById(key) ? exMetaById(key).n : key);
  const rows=[];
  const f=exFactor(name, exId);
  DB.logs.forEach(l=>{

    const e=l.exercises.find(x=> (exId && x.exId===exId) || x.name===name);
    if(e){
      const done=e.sets.filter(s=>s.done!==false);
      const vol=done.reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
      const topW=done.reduce((m,s)=>Math.max(m,(+s.weight||0)*f),0);
      const setStr=done.map(s=>`${(+s.weight||0)*f}×${+s.reps||0}`).join(', ');
      const rirVals=done.filter(s=>s.rir!=null&&s.rir!=='').map(s=>+s.rir);
      const rir=rirVals.length? rirVals.reduce((a,b)=>a+b,0)/rirVals.length : null;
      if(vol>0) rows.push({date:l.date, vol, topW, sets:done.length, setStr, rir});
    }
  });
  if(rows.length<1){ el.innerHTML=`<div class="faint" style="font-size:12.5px;padding:14px 0">There is no training data for this exercise yet.</div>`; return; }

  let chart='';
  if(rows.length>=2){
    const vols=rows.map(r=>r.vol);
    const max=Math.max(...vols), min=Math.min(...vols), range=max-min||1;
    const W=100, H=90;
    const path=rows.map((r,i)=>{const x=i/(rows.length-1)*W;const y=H-((r.vol-min)/range)*H;return `${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');
    const area=`M0,${H} `+rows.map((r,i)=>{const x=i/(rows.length-1)*W;const y=H-((r.vol-min)/range)*H;return `L${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ')+` L${W},${H} Z`;
    const first=rows[0].vol, last=rows[rows.length-1].vol, diff=last-first;
    const pct=first? Math.round(diff/first*100):0;
    chart=`<div class="row between" style="margin:8px 0 10px">
        <span class="faint" style="font-size:12px">${mz(rows.length,'workout','workouts')}</span>
        <span class="pill ${diff>0?'up':diff<0?'down':'same'}">${diff>0?'+':''}${(diff/1000).toFixed(1)}t · ${pct>0?'+':''}${pct}%</span></div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:120px;overflow:visible">
        <defs><linearGradient id="volgrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
        <path d="${area}" fill="url(#volgrad)" stroke="none"/>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
        ${rows.map((r,i)=>{const x=i/(rows.length-1)*W;const y=H-((r.vol-min)/range)*H;return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="var(--accent)" vector-effect="non-scaling-stroke"/>`;}).join('')}
      </svg>`;
  }

  const table=`<div class="prog-table">
    <div class="prog-row prog-head"><span>Date</span><span>Sets</span><span>Top kg</span><span>Ø RIR</span><span>Volume</span></div>
    ${[...rows].reverse().map(r=>`<div class="prog-row" title="${esc(r.setStr)}">
      <span>${fmtDate(r.date)}</span>
      <span class="num">${r.sets}</span>
      <span class="num">${r.topW} kg</span>
      <span class="num faint">${r.rir!=null? (Math.round(r.rir*10)/10) : '–'}</span>
      <span class="num" style="font-weight:700;color:var(--accent-dim)">${r.vol.toLocaleString('en-GB')} kg</span>
    </div>`).join('')}
  </div>`;

  el.innerHTML=chart+table;
}

function migrateToEnglish(){
  let changed=false;

  (DB.customEx||[]).forEach(e=>{
    const newName=EX_RENAME[e.n];
    if(newName){ e.n=newName; changed=true; }
    if(e.g && EN_MUSCLE[e.g]){ e.g=EN_MUSCLE[e.g]; changed=true; }
    if(Array.isArray(e.pm)){
      const t=e.pm.map(toEnMuscle);
      if(t.join('|')!==e.pm.join('|')){ e.pm=t; changed=true; }
    }
    if(Array.isArray(e.sm)){
      const t=e.sm.map(toEnMuscle);
      if(t.join('|')!==e.sm.join('|')){ e.sm=t; changed=true; }
    }

    const rc=EX_RECLASSIFY[e.n];
    if(rc){
      const pmNew=rc.pm.join('|'), smNew=rc.sm.join('|');
      if((e.pm||[]).join('|')!==pmNew){ e.pm=rc.pm.slice(); changed=true; }
      if((e.sm||[]).join('|')!==smNew){ e.sm=rc.sm.slice(); changed=true; }
      if(e.g!==rc.g){ e.g=rc.g; changed=true; }
    }
  });

  rebuildExDB();

  (DB.plans||[]).forEach(p=>(p.days||[]).forEach(d=>(d.exercises||[]).forEach(e=>{
    if(e.muscle && EN_MUSCLE[e.muscle]){ e.muscle=EN_MUSCLE[e.muscle]; changed=true; }

    const meta=e.exId?exMetaById(e.exId):null;
    if(meta && e.name!==meta.n){ e.name=meta.n; changed=true; }
    else if(!meta && e.name && EX_RENAME[e.name]){ e.name=EX_RENAME[e.name]; changed=true; }

    if(meta && meta.g && e.muscle!==meta.g){ e.muscle=meta.g; changed=true; }
  })));
  (DB.logs||[]).forEach(l=>(l.exercises||[]).forEach(e=>{
    if(e.muscle && EN_MUSCLE[e.muscle]){ e.muscle=EN_MUSCLE[e.muscle]; changed=true; }

  }));

  if(DB.settings && Array.isArray(DB.settings.customMuscles)){
    const before=DB.settings.customMuscles.join('|');
    DB.settings.customMuscles=DB.settings.customMuscles
      .map(toEnMuscle)
      .filter((m,i,a)=>!SECONDARY_MUSCLES.includes(m) && a.indexOf(m)===i);
    if(DB.settings.customMuscles.join('|')!==before) changed=true;
  }

  if(changed){ rebuildExDB(); save(); console.log('[Migration] switched to English taxonomy'); }
}

function migrateExerciseIds(){
  let changed=false, linked=0, unmatched=0;
  const fix=(exArr)=>{
    (exArr||[]).forEach(e=>{
      if(e.exId) return;
      const id=exIdForName(e.name);
      if(id){ e.exId=id; linked++; changed=true; }
      else { unmatched++; }
    });
  };
  (DB.logs||[]).forEach(l=>fix(l.exercises));
  (DB.plans||[]).forEach(p=>(p.days||[]).forEach(d=>fix(d.exercises)));
  if(changed){ save(); }

  if(linked||unmatched) console.log(`[Migration] exercise ids linked: ${linked}, unmatched: ${unmatched}`);
}

function addCustomMuscle(name, silent){

  customMuscles().push(name);

function deleteCustomMuscle(name){
  const liste=customMuscles();
  const idx=liste.indexOf(name);
  if(idx<0) return;

  const warSek = !!(CUSTOM && Array.isArray(CUSTOM._smChips) && CUSTOM._smChips.includes(name));
  const warPrim= !!(CUSTOM && Array.isArray(CUSTOM._pmChips) && CUSTOM._pmChips.includes(name));

  liste.splice(idx,1);
  if(CUSTOM && Array.isArray(CUSTOM._smChips)) CUSTOM._smChips=CUSTOM._smChips.filter(m=>m!==name);
  if(CUSTOM && Array.isArray(CUSTOM._pmChips)) CUSTOM._pmChips=CUSTOM._pmChips.filter(m=>m!==name);
  save();
  if(CUSTOM) renderCustomForm(!!CUSTOM._isEdit);

  registerUndo(`“${name}” removed`, ()=>{
    const l=customMuscles();
    l.splice(Math.min(idx, l.length), 0, name);

    if(CUSTOM){
      if(warSek && Array.isArray(CUSTOM._smChips)) CUSTOM._smChips.push(name);
      if(warPrim && Array.isArray(CUSTOM._pmChips)) CUSTOM._pmChips.push(name);
      renderCustomForm(!!CUSTOM._isEdit);
    }
  });
}

        <button class="cx-seg ${c.dumbbells===2?'on':''}" onclick="CUSTOM.dumbbells=2;renderCustomForm(${isEdit})">2 dumbbells</button>
      </div>
      <p class="faint" style="font-size:11px;margin-top:8px">During a workout you enter the weight of <b>one</b> dumbbell. With 2 dumbbells, volume and stats automatically count double.</p></div>`:''}
    <div class="field"><label>Bench <span class="faint" style="font-weight:400">(optional)</span></label>
      <input class="input" id="cxBench" placeholder="e.g. 30° incline or none" value="${esc(c.bench||'')}" oninput="CUSTOM.bench=this.value"></div>

    <div class="field"><label>Image / GIF</label>
      <div class="cx-imgmode">
        <button class="cx-seg ${c.imgMode==='file'?'on':''}" onclick="CUSTOM.imgMode='file';renderCustomForm(${isEdit})">Upload file</button>
        <button class="cx-seg ${c.imgMode==='url'?'on':''}" onclick="CUSTOM.imgMode='url';renderCustomForm(${isEdit})">Web link</button>
      </div>
      ${c.imgMode==='file'
        ? `<input type="file" id="cxFile" accept="image/*,image/gif" style="display:none" onchange="onCustomImgFile(event)">
           <button class="btn-slim" style="margin-top:10px" onclick="document.getElementById('cxFile').click()">${I.upload}<span>${img?'Replace image':'Choose image/GIF'}</span></button>
           <p class="faint" style="font-size:11px;margin-top:8px">Under 1.5 MB recommended (local storage is limited).</p>`
        : `<input class="input" id="cxUrl" placeholder="https://…/uebung.gif" value="${img&&/^https?:/i.test(img)?esc(img):''}" oninput="setCustomImgUrl(this.value)">
           <p class="faint" style="font-size:11px;margin-top:8px">Address of a GIF or image (e.g. from Giphy/Tenor). Showing it needs internet.</p>`}
      <div id="cxPreview">${customPreview(img)}</div>
    </div>

    <div class="field"><label>How-to (one line per step)</label>
      <textarea class="input" id="cxIns" rows="5" style="resize:vertical;line-height:1.5" placeholder="Step 1…&#10;Step 2…&#10;Step 3…" oninput="CUSTOM._insText=this.value">${esc(insText)}</textarea></div>

    <button class="btn-slim solid" style="margin-top:6px" onclick="saveCustomExercise(${isEdit})"><span>${isEdit?'Save changes':'Save exercise'}</span></button>
    <button class="btn ghost" style="margin-top:10px" onclick="cancelCustomExercise()">Cancel</button>
  `);

  guardModal(CUSTOM.n||'Custom exercise', ()=>renderCustomForm(isEdit), ()=>saveCustomExercise(isEdit));
}

function cancelCustomExercise(){
  MODAL_GUARD=null;
  const back=CUSTOM_RETURN; CUSTOM_RETURN=null;
  closeOverlay();
  if(back) back();
  else if(BUILDER_OPEN) renderBuilder();
  else if(_pickCb) renderPicker();
  else closeModal();
}
function customPreview(img){
  if(!img) return '';
  return `<div class="cx-preview"><img src="${img}" alt="Preview" onerror="this.parentNode.classList.add('bad')"><span class="cx-preview-bad">The image could not be loaded</span></div>`;
}
function refreshCustomPreview(){
  const el=document.getElementById('cxPreview'); if(el) el.innerHTML=customPreview(CUSTOM.img[0]||'');
}
function setCustomImgUrl(v){
  v=(v||'').trim();
  CUSTOM.img = v? [v] : [];
  refreshCustomPreview();
}
function onCustomImgFile(ev){
  const file=ev.target.files&&ev.target.files[0];
  ev.target.value='';
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast('Please choose an image file'); return; }
  const reader=new FileReader();
  reader.onload=()=>{
    const dataUrl=reader.result;

    const bytes=Math.round((dataUrl.length-(dataUrl.indexOf(',')+1))*0.75);
    const proceed=()=>{ CUSTOM.img=[dataUrl]; refreshCustomPreview(); toast('Image applied'); };
    if(bytes>MAX_IMG_BYTES){
      confirmModal('Large image',
        `The file is about ${(bytes/1_000_000).toFixed(1)} MB. Local storage is limited (usually ~5 MB in total) – large images can make saving fail. Use it anyway?`,
        'Use it anyway', proceed);
    } else proceed();
  };
  reader.onerror=()=>toast('The file could not be read');
  reader.readAsDataURL(file);
}
function saveCustomExercise(isEdit){
  const c=CUSTOM;
  c.n=(c.n||'').trim();
  if(!c.n){ toast('Please enter a name'); return false; }

  const clash = allRaw().some(e=>e.n.toLowerCase()===c.n.toLowerCase() && e.id!==c.id);
  if(clash){ toast('Name already taken – please pick another'); return false; }

  const txt = (c._insText!=null? c._insText : (c.ins||[]).join('\n'));
  c.ins = txt.split('\n').map(s=>s.trim()).filter(Boolean);
  delete c._insText;

  c.pm = (c._pmChips && c._pmChips.length) ? c._pmChips.slice() : [c.g];
  c.bench = (c.bench||'').trim();

  c.dumbbells = (c.eq==='Dumbbell' && c.dumbbells===2) ? 2 : 1;

  const chips = c._smChips||[];
  const merged=[];
  chips.forEach(m=>{ if(m && m!==c.g && !merged.some(x=>x.toLowerCase()===m.toLowerCase())) merged.push(m); });
  c.sm = merged;
  delete c._smChips; delete c._smExtra; delete c._isEdit;
  const arr = DB.customEx || (DB.customEx=[]);
  const idx = arr.findIndex(e=>e.id===c.id);

  const backup = JSON.stringify(arr);
  if(idx>=0) arr[idx]=c; else arr.push(c);
  try{
    localStorage.setItem(KEY, JSON.stringify(DB));
  }catch(err){

    DB.customEx = JSON.parse(backup);
    toast('Storage full – image too large. Use a web link or a smaller image.');
    return false;
  }
  rebuildExDB();

  (DB.plans||[]).forEach(p=>(p.days||[]).forEach(d=>(d.exercises||[]).forEach(e=>{
    if(e.exId===c.id){ e.name=c.n; e.muscle=toRegion(c.g); }
  })));
  save();
  MODAL_GUARD=null;
  closeOverlay();
  returnFromCustom();
  toast(isEdit?'Exercise updated':'Exercise created ✓');
  return true;
}

let CUSTOM_RETURN=null;

function captureReturn(){
  if(BUILDER_OPEN) return ()=>renderBuilder();
  if(_pickCb)      return ()=>renderPicker();
  return ()=>renderView();
}
function returnFromCustom(){
  const back=CUSTOM_RETURN;
  CUSTOM_RETURN=null;
  if(back){ back(); return; }
  if(BUILDER_OPEN){ renderBuilder(); return; }
  if(_pickCb){ renderPicker(); return; }
  renderView();
}
function deleteCustomExercise(id){
  const arr=DB.customEx||(DB.customEx=[]);
  const idx=arr.findIndex(e=>e.id===id);
  if(idx<0) return;
  const uebung=arr[idx];
  arr.splice(idx,1);
  rebuildExDB(); save();
  MODAL_GUARD=null; closeOverlay();
  returnFromCustom();
  registerUndo(`“${uebung.n}” deleted`, ()=>{
    const a=DB.customEx||(DB.customEx=[]);
    a.splice(Math.min(idx, a.length), 0, uebung);

    rebuildExDB();
  });
}

function equipSummary(eq){
  const c=equipMap()[eq];
  const l=equipWeights(eq);
  if(!c || !l.length) return {txt:'not set up', an:false};
  const wie = c.mode==='liste' ? 'list' : `${fmtKg(parseNum(c.schritt))} steps`;
  return {txt:`${fmtKg(l[0])} – ${fmtKg(l[l.length-1])} kg · ${wie} · ${l.length} steps`, an:true};
}
function viewEquipment(){
  const geraete=equipConfigurable();
  return topbar('Your equipment')+`<div class="pad">
    <div class="card">
      <div class="row" style="gap:9px;margin-bottom:4px">
        <span class="dlg-ico" style="color:var(--accent)">${I.plate}</span>
        <div class="eyebrow" style="margin:0">Settable weights</div>
      </div>
      <p class="faint" style="font-size:12.5px;line-height:1.5;margin-top:8px">
        Enter the weights your equipment can actually be set to. Suggestions during
        a workout then only land on settable values — and at the top end the
        app says to keep going with reps instead.
        With no entry it keeps using the fixed increment.
      </p>
    </div>
    ${geraete.length? `<div style="height:14px"></div>`+geraete.map(q=>{
      const s=equipSummary(q);

      return `<button class="day-box" onclick='openEquipEditor("${escAttr(q)}")'>
        <div class="row between">
          <span style="font-weight:700;font-size:14px">${esc(q)}</span>
          <span class="row" style="gap:6px;flex-shrink:0;min-width:0">
            <span style="font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${s.an?'color:var(--accent-dim);font-weight:600':'color:var(--text-faint)'}">${esc(s.txt)}</span>
            <span class="day-arrow">${I.chevron}</span>
          </span>
        </div>
      </button>`;
    }).join('') : `<div class="empty">${I.plate}<h3>No equipment</h3>
      <p style="font-size:13.5px">Create custom exercises — their equipment then shows up here.</p></div>`}
  </div>`;
}

let EQUIP=null;
function openEquipEditor(eq){
  const c=equipMap()[eq];
  const reihe = c && c.mode!=='liste';
  EQUIP={
    eq, vorhanden: !!c,
    mode: (c && c.mode==='liste') ? 'liste' : 'reihe',
    von:     reihe && c.von!=null     ? String(c.von)     : '',
    bis:     reihe && c.bis!=null     ? String(c.bis)     : '',
    schritt: reihe && c.schritt!=null ? String(c.schritt) : '',
    text: (c && c.mode==='liste' && Array.isArray(c.gewichte)) ? c.gewichte.map(fmtKg).join('; ') : ''
  };
  renderEquipEditor();
}

function equipDraftConfig(){
  if(!EQUIP) return null;
  return EQUIP.mode==='liste'
    ? {mode:'liste', gewichte:String(EQUIP.text||'').split(/[,;\s]+/).filter(Boolean)}
    : {mode:'reihe', von:EQUIP.von, bis:EQUIP.bis, schritt:EQUIP.schritt};
}
function equipPreview(){
  const c=equipDraftConfig();
  const l=equipWeightsFrom(c);
  if(!l.length) return `<span class="faint">No valid entry yet — that produces no steps.</span>`;
  const kurz = l.length<=8
    ? l.map(fmtKg).join(' · ')
    : l.slice(0,3).map(fmtKg).join(' · ')+' … '+l.slice(-2).map(fmtKg).join(' · ');

  let warn='';
  if(c && c.mode==='reihe'){
    const bis=parseNum(c.bis), letzte=l[l.length-1];
    if(isFinite(bis) && letzte < bis-1e-9){
      warn=`<br><span style="color:var(--amber)">The series ends at ${fmtKg(letzte)} kg — ${fmtKg(bis)} kg is not hit exactly by this step.</span>`;
    }
  }
  return `<b style="color:var(--accent)">${l.length} ${l.length===1?'step':'steps'}</b><br>${kurz}${warn}`;
}
function refreshEquipPreview(){ const el=document.getElementById('eqPreview'); if(el) el.innerHTML=equipPreview(); }
function renderEquipEditor(){
  const e=EQUIP;
  openModal(`<div class="grab"></div>
    <h2>${esc(e.eq)}</h2>
    <p class="faint" style="font-size:12px;margin:6px 0 14px">Which weights can this equipment be set to?</p>
    <div class="seg" style="margin-bottom:14px">
      <button class="seg-btn ${e.mode==='reihe'?'on':''}" onclick="EQUIP.mode='reihe';renderEquipEditor()">Range</button>
      <button class="seg-btn ${e.mode==='liste'?'on':''}" onclick="EQUIP.mode='liste';renderEquipEditor()">List</button>
    </div>
    ${e.mode==='reihe'? `
      <div class="row" style="gap:10px;align-items:flex-end">
        <div class="field" style="margin:0;flex:1;min-width:0"><label>from (kg)</label>
          <input class="input" id="eqVon" inputmode="decimal" placeholder="4" value="${escAttr(e.von)}" oninput="EQUIP.von=this.value;refreshEquipPreview()"></div>
        <div class="field" style="margin:0;flex:1;min-width:0"><label>to (kg)</label>
          <input class="input" id="eqBis" inputmode="decimal" placeholder="40.5" value="${escAttr(e.bis)}" oninput="EQUIP.bis=this.value;refreshEquipPreview()"></div>
        <div class="field" style="margin:0;flex:1;min-width:0"><label>Step</label>
          <input class="input" id="eqSchritt" inputmode="decimal" placeholder="1.5" value="${escAttr(e.schritt)}" oninput="EQUIP.schritt=this.value;refreshEquipPreview()"></div>
      </div>`
    : `
      <div class="field" style="margin:0"><label>Weights, comma separated</label>
        <textarea class="input" id="eqText" rows="4" placeholder="5; 10; 15; 20; 30" oninput="EQUIP.text=this.value;refreshEquipPreview()">${esc(e.text)}</textarea></div>`}
    <div class="ov-note" style="margin-top:14px" id="eqPreview">${equipPreview()}</div>
    <button class="btn-slim solid" style="margin-top:16px" onclick="saveEquip()"><span>Save</span></button>
    ${e.vorhanden?`<button class="btn ghost" style="margin-top:10px;color:var(--red);border-color:rgba(255,92,92,.25)" onclick="removeEquip()">Remove setup</button>`:''}
    <button class="btn ghost" style="margin-top:10px" onclick="closeModal()">Cancel</button>
  `, true);
}
function saveEquip(){
  const c=equipDraftConfig();
  const l=equipWeightsFrom(c);
  if(!l.length){ toast('Please enter valid weights'); return; }

  if(c.mode==='liste') c.gewichte=l;
  equipMap()[EQUIP.eq]=c;
  const name=EQUIP.eq; EQUIP=null;
  save(); closeModal(); renderView();
  toast(`${name}: ${l.length} ${l.length===1?'step':'steps'} saved`);
}
function removeEquip(){
  const eq=EQUIP.eq;

  confirmModal('Remove setup?',
    `“${eq}” then goes back to the fixed increment.`, 'Remove',
    ()=>{ delete equipMap()[eq]; EQUIP=null; save(); closeModal(); renderView(); toast('Setup removed'); },
    ()=>{ renderEquipEditor(); });
}

function openModal(html, tall, extraClass){
  const bg=document.getElementById('modalBg'); const box=document.getElementById('modalBox');
  const vorher=document.activeElement;
  if(!bg.classList.contains('show')) MODAL_OPENER = (vorher && vorher.id) ? vorher.id : null;
  box.className='modal'+(tall?' tall':'')+(extraClass?' '+extraClass:''); box.innerHTML=html; bg.classList.add('show');
  a11y(box);

  const h=box.querySelector('h2');
  if(h){ h.id=h.id||'modalTitel'; box.setAttribute('aria-labelledby',h.id); box.removeAttribute('aria-label'); }
  else { box.removeAttribute('aria-labelledby'); box.setAttribute('aria-label','Dialog'); }

  document.getElementById('app').inert=true;
  document.getElementById('nav').inert=true;
}
let MODAL_OPENER=null;

function closeModal(){ MODAL_GUARD=null; BUILDER_OPEN=false; CUSTOM_RETURN=null; _pickCb=null; closeOverlay(); }

function closeOverlay(){
  document.getElementById('modalBg').classList.remove('show');
  document.getElementById('app').inert=false;
  document.getElementById('nav').inert=false;

  if(MODAL_OPENER){ const el=document.getElementById(MODAL_OPENER); if(el) el.focus(); MODAL_OPENER=null; }
}

let MODAL_GUARD=null;

function guardModal(label, restore, save, sync){ MODAL_GUARD={label, restore, save, sync}; }
function tryCloseModal(){
  if(MODAL_GUARD){
    const g=MODAL_GUARD;
    if(g.sync) g.sync();
    MODAL_GUARD=null;
    confirmModal('Not saved yet',
      `Your changes ${g.label?'in “'+g.label+'” ':''}have not been saved yet.`,
      'Discard',
      ()=>{ closeModal(); },
      ()=>{ if(g.restore) g.restore(); else closeModal(); },
      null,
      g.save ? {label:'Save and close', run:()=>{

        if(g.save()===false && g.restore) g.restore();
      }} : null
    );
    return;
  }

  if(BUILDER_OPEN && !document.querySelector('.bld')){ closeOverlay(); renderBuilder(); return; }
  closeModal();
}
document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') tryCloseModal(); });

function confirmInEditor(title, msg, label, onOk, restore){
  confirmModal(title, msg, label, ()=>{ onOk(); restore(); }, ()=>{ restore(); });
}
function confirmModal(title,msg,confirmLabel,onOk,onCancel,cancelLabel,extra){
  openModal(`<div class="grab"></div><h2>${esc(title)}</h2>
    ${msg?`<p class="muted" style="margin:6px 0 20px">${esc(msg)}</p>`:'<div style="height:16px"></div>'}
    ${extra?`<button class="btn-slim solid" style="margin-bottom:10px" id="_cextra"><span>${esc(extra.label)}</span></button>`:''}
    <button class="btn danger" style="margin-bottom:10px" id="_cok">${esc(confirmLabel)}</button>
    <button class="btn ghost" id="_cno">${esc(cancelLabel||'Back')}</button>`);
  document.getElementById('_cok').onclick=()=>{ closeOverlay(); onOk(); };
  document.getElementById('_cno').onclick=()=>{ if(onCancel) onCancel(); else closeModal(); };
  if(extra) document.getElementById('_cextra').onclick=()=>{ closeOverlay(); extra.run(); };
}

rebuildExDB();
migrateToEnglish();
migrateMuscleNames();
migrateExerciseIds();
migrateEquipToEnglish();
migrateKind();
renderNav();
renderView();
offerSessionResume();
initCloud();
</script>
</body>
