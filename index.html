/* ---------- Exercise DB (873 Übungen, Public Domain: yuhonas/free-exercise-db) ----------
   Rohschema pro Eintrag:
   { id, n(ame), g(ruppe), pm[primär], sm[sekundär], eq(uipment), cat, lvl, frc, ins[], img[] }
   Eigene Übungen (DB.customEx) haben dasselbe Schema + custom:true und werden eingemischt.
   Adapter EXDB stellt {n,m,t,_} bereit; _ enthält den vollständigen Datensatz. */
/* Primär = Körperregion. Die alten, feineren Gruppen des Datensatzes werden zugeordnet. */
/* App-Version. Bei jeder Änderung hier hochzählen – wird in "Daten & Backup"
   und in jedem exportierten Backup mitgeführt. */
const APP_VERSION='1.21.0';
const APP_BUILD='2026-08-16';

const MUSCLES = ['Chest','Back','Shoulders','Arms','Legs','Core'];
// Ordnet jeden Einzelmuskel seiner Körperregion zu (für Filter und Statistik).
const REGION_OF = {
  'Chest':'Chest', 'Upper Chest':'Chest', 'Mid Chest':'Chest', 'Lower Chest':'Chest',
  'Back':'Back', 'Lats':'Back', 'Upper Back':'Back', 'Mid Back':'Back',
  'Lower Back':'Back', 'Traps':'Back',
  'Shoulders':'Shoulders', 'Front Delts':'Shoulders', 'Side Delts':'Shoulders', 'Rear Delts':'Shoulders',
  'Arms':'Arms', 'Biceps':'Arms', 'Triceps':'Arms', 'Forearms':'Arms',
  'Brachialis':'Arms', 'Brachioradialis':'Arms',
  'Legs':'Legs', 'Quads':'Legs', 'Hamstrings':'Legs', 'Glutes':'Legs',
  'Calves':'Legs', 'Adductors':'Legs', 'Abductors':'Legs',
  'Core':'Core', 'Abs':'Core', 'Obliques':'Core', 'Serratus':'Core', 'Neck':'Core'
};
function toRegion(g){ return REGION_OF[g] || (MUSCLES.includes(g)? g : 'Core'); }
const RAW = (window.EXDB_RAW||[]);
let EXDB = [];        // kombinierte Sicht (eigene zuerst), via rebuildExDB() gefüllt
let EXBYNAME = {};    // Name -> Datensatz
let EXBYID = {};      // ID -> Datensatz (stabile Verknüpfung, überlebt Umbenennen)
function customList(){ return (DB && Array.isArray(DB.customEx)) ? DB.customEx : []; }
function allRaw(){ return customList().concat(RAW); } // eigene zuerst
function rebuildExDB(){
  const all=allRaw();
  // Primärgruppe auf Körperregion umschlüsseln (Datensatz nutzt feinere Gruppen)
  all.forEach(e=>{ e.g = toRegion(e.g); });
  EXDB = all.map(e=>({n:e.n, m:e.g, t:e.eq, _:e}));
  EXBYNAME = {}; EXBYID = {};
  all.forEach(e=>{ if(!(e.n in EXBYNAME)) EXBYNAME[e.n]=e; });
  all.forEach(e=>{ if(e.id && !(e.id in EXBYID)) EXBYID[e.id]=e; });
}
// Metadaten per Name (Anzeige-Text). Bleibt für Altdaten/Anzeige erhalten.
function exMeta(name){ return EXBYNAME[name]||null; }
// Metadaten per ID (stabile Verknüpfung). Überlebt Umbenennen der Übung.
function exMetaById(id){ return id ? (EXBYID[id]||null) : null; }
// Übung nachschlagen: erst über exMetaById(), dann über exMeta() als Rückfall.
// Ids überleben ein Umbenennen, Namen nicht.
// Liefert die stabile ID zu einem Übungsnamen (für Migration & neues Speichern).
function exIdForName(name){ const m=exMeta(name); return m?m.id:null; }

/* Räumt die eingetragene URL auf, damit kleine Tippfehler nicht stören:
   - Leerzeichen weg
   - fehlendes https:// ergänzen
   - Schrägstrich(e) und versehentlich mitkopierte Pfade am Ende entfernen
   Ergebnis ist immer die reine Projekt-Adresse, z. B. https://abc.supabase.co */
(function normalizeCloudUrl(){
  let u=(CLOUD.url||'').trim();
  if(!u) return;
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  try{
    const p=new URL(u);
    CLOUD.url = p.origin;          // nur Schema + Host, ohne Pfad und ohne / am Ende
  }catch(e){
    CLOUD.url = u.replace(/\/+$/,'');
  }
  CLOUD.key = (CLOUD.key||'').trim();
})();

/* Der Browser gibt pro Seite nur ~5 MB localStorage. Eigene Übungen mit
   hochgeladenem Bild liegen als Base64 darin und fressen den Platz schnell auf.
   Früher gab es dafür nur einen Toast – wer den übersah, verlor ab da still

   anbieten, statt es beiläufig zu erwähnen. */
let SAVE_FAILED=false;
function onSaveFailed(e){
  const voll = e && (e.name==='QuotaExceededError' || e.name==='NS_ERROR_DOM_QUOTA_REACHED' || e.code===22);
  if(SAVE_FAILED) return;        // nicht bei jedem Tastendruck erneut aufpoppen
  SAVE_FAILED=true;
  if(!voll){ toast('Speichern fehlgeschlagen'); return; }
  openModal(`<div class="grab"></div>

      jetzt nicht mehr gesichert</b>, bis wieder Platz frei ist.
    </p>
    <p class="faint" style="font-size:12.5px;margin:0 0 18px">
      Häufigste Ursache sind eigene Übungen mit hochgeladenem Bild. Lade zuerst
      ein Backup herunter, lösche dann unter „Übungen“ ein paar Bilder oder
      ersetze sie durch eine Bild-URL.
    </p>
    <button class="btn-slim solid" style="margin-bottom:10px" onclick="exportData()">${I.download}<span>Backup jetzt herunterladen</span></button>
    <button class="btn ghost" onclick="closeModal()">Verstanden</button>`);
}
/* Belegter Speicher in Bytes (grobe Schätzung: UTF-16, also 2 Byte je Zeichen). */
function storageBytes(){
  let n=0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      n += (k.length + (localStorage.getItem(k)||'').length) * 2;
    }
  }catch(e){}
  return n;
}
function fmtBytes(b){
  if(b<1024) return b+' B';
  if(b<1024*1024) return (b/1024).toFixed(0)+' KB';
  return (b/1024/1024).toFixed(1)+' MB';
}
// Änderung vormerken und (gebündelt) in die Cloud schicken
function markDirty(){
  if(SYNC.state==='off' || SYNC.state==='signed-out' || SYNC.state==='conflict') return;
  SYNC.dirty=true;
  renderSyncBadge();
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{ pushToCloud(); }, 1500);   // 1,5 s nach der letzten Änderung
}
window.addEventListener('pagehide', ()=>{ saveNow(); saveSessionNow(); flushPush(); });
document.addEventListener('visibilitychange', ()=>{

  else if(document.visibilityState==='visible' && SYNC.state==='idle'){ pullFromCloud(true); }
});

/* ================================================================
   LAUFENDES TRAINING SICHERN
   SESSION lag früher nur im Arbeitsspeicher. Ein Reload, ein Absturz oder
   iOS, das den Tab bei ausgeschaltetem Bildschirm aus dem Speicher wirft,
   haben damit das komplette laufende Training vernichtet. Deshalb wird
   SESSION getrennt von DB mitgeschrieben und beim Start zur Wiederaufnahme
   angeboten. Eigener Key, damit ein kaputter Trainingsstand niemals den
   fertigen Verlauf beschädigen kann.
   ================================================================ */
const SESSION_KEY='progresslab.session';
let sessTimer;
// Gebündelt schreiben: bei jedem Tastendruck in ein Gewichtsfeld sonst zu oft.
function saveSession(){ clearTimeout(sessTimer); sessTimer=setTimeout(saveSessionNow,300); }
function saveSessionNow(){
  clearTimeout(sessTimer);
  try{
    if(SESSION) localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION));
    else localStorage.removeItem(SESSION_KEY);
  }catch(e){}
}
function clearStoredSession(){ clearTimeout(sessTimer); try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
function loadStoredSession(){
  try{
    const raw=localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const s=JSON.parse(raw);
    return (s && Array.isArray(s.exercises)) ? s : null;
  }catch(e){ return null; }
}
// Enthält der Stand überhaupt Arbeit? Ein frisch gestartetes, leeres Training
// muss man nicht wiederherstellen – das würde nur nerven.
function sessionHasData(s){
  const gefuellt=v=>v!=='' && v!=null;
  return s.exercises.some(e=>(e.sets||[]).some(x=> x.done || gefuellt(x.weight) || gefuellt(x.reps) ));
}
function offerSessionResume(){
  if(SESSION) return;
  const s=loadStoredSession();
  if(!s){ return; }
  if(!sessionHasData(s)){ clearStoredSession(); return; }
  const done=s.exercises.reduce((a,e)=>a+(e.sets||[]).filter(x=>x.done).length,0);
  const when=new Date(s.date||Date.now());
  const zeit=String(when.getHours()).padStart(2,'0')+':'+String(when.getMinutes()).padStart(2,'0');
  openModal(`<div class="grab"></div>
    <h2>Training fortsetzen?</h2>
    <p class="muted" style="margin:6px 0 4px">${esc(s.dayName||'Training')}</p>
    <p class="faint" style="font-size:12.5px;margin:0 0 20px">
      Gestartet um ${zeit} Uhr · ${done} ${done===1?'Satz':'Sätze'} bereits abgehakt
    </p>
    <button class="btn-slim solid" style="margin-bottom:10px" id="_resumeYes">Fortsetzen</button>
    <button class="btn ghost" id="_resumeNo">Verwerfen</button>`);
  document.getElementById('_resumeYes').onclick=()=>{
    SESSION=s; closeModal(); go('today');
  };
  document.getElementById('_resumeNo').onclick=()=>{
    confirmModal('Trainingsstand verwerfen?','Die abgehakten Sätze dieses Trainings gehen verloren.','Verwerfen',
      ()=>{ clearStoredSession(); closeModal(); },
      ()=>{ offerSessionResume(); });   // doch nicht: Auswahl erneut zeigen
  };
}
// Beim Verlassen der Seite noch schnell hochladen (überlebt das Schließen dank keepalive)
function flushPush(){
  if(!SYNC.dirty || !SYNC.token || !cloudConfigured()) return;
  clearTimeout(pushTimer);
  try{
    fetch(`${CLOUD.url}/rest/v1/progresslab?id=eq.${SYNC.user.id}`, {
      method:'PATCH', keepalive:true,
      headers:{
        'apikey':CLOUD.key,
        'Authorization':'Bearer '+SYNC.token,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body:JSON.stringify({ data:DB, rev:SYNC.rev+1, updated_at:new Date().toISOString() })
    });
  }catch(e){}
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ================================================================
   CLOUD: Anmeldung, Hoch- und Herunterladen, Konflikte
   ================================================================ */
const AUTH_KEY='progresslab.auth';

async function cloudFetch(path, opts={}){
  const res=await fetch(CLOUD.url+path, {
    ...opts,
    headers:{
      'apikey':CLOUD.key,
      'Content-Type':'application/json',
      ...(SYNC.token?{'Authorization':'Bearer '+SYNC.token}:{}),
      ...(opts.headers||{})
    }
  });
  if(!res.ok){
    let msg='';
    try{ const j=await res.json(); msg=j.msg||j.message||j.error_description||j.error||''; }catch(e){}
    throw new Error(msg||('Fehler '+res.status));
  }
  // Bei 201/204 (return=minimal) kommt kein Inhalt zurück – das ist kein Fehler.
  const txt=await res.text();
  if(!txt) return null;
  try{ return JSON.parse(txt); }catch(e){ return null; }
}

/* ---- Anmeldung ---- */
async function cloudSignUp(email, password){
  const r=await fetch(`${CLOUD.url}/auth/v1/signup`,{
    method:'POST',
    headers:{'apikey':CLOUD.key,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})
  });
  const j=await r.json();
  if(!r.ok) throw new Error(j.msg||j.message||j.error_description||'Registrierung fehlgeschlagen');
  // Wenn E-Mail-Bestätigung aktiv ist, kommt noch kein Token zurück
  if(!j.access_token) return {needsConfirm:true};
  applySession(j);
  return {needsConfirm:false};
}
async function cloudSignIn(email, password){
  const r=await fetch(`${CLOUD.url}/auth/v1/token?grant_type=password`,{
    method:'POST',
    headers:{'apikey':CLOUD.key,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})
  });
  const j=await r.json();
  if(!r.ok) throw new Error(j.error_description||j.msg||j.message||'Anmeldung fehlgeschlagen');
  applySession(j);
}
/* Fordert die Mail mit dem Rücksetz-Link an.
   Die Rückkehr-Adresse ist die Seite selbst – so stimmt sie überall, wo die
   Datei liegt. Sie muss in Supabase unter "URL Configuration" erlaubt sein. */
async function cloudRecover(email){
  const back = encodeURIComponent(location.origin + location.pathname);
  const r=await fetch(`${CLOUD.url}/auth/v1/recover?redirect_to=${back}`,{
    method:'POST',
    headers:{'apikey':CLOUD.key,'Content-Type':'application/json'},
    body:JSON.stringify({email})
  });
  if(!r.ok){
    let j={}; try{ j=await r.json(); }catch(e){}
    throw new Error(j.error_description||j.msg||j.message||'Konnte keine Mail schicken');
  }
}
/* Setzt das neue Passwort mit der Kennmarke aus dem Adressanker. */
async function cloudSetPassword(token, password){
  const r=await fetch(`${CLOUD.url}/auth/v1/user`,{
    method:'PUT',
    headers:{'apikey':CLOUD.key,'Authorization':'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({password})
  });
  const j=await r.json();
  if(!r.ok) throw new Error(j.error_description||j.msg||j.message||'Passwort konnte nicht gesetzt werden');
  return j;   // Benutzerobjekt, ohne Kennmarken
}
function applySession(j){
  SYNC.token=j.access_token;
  SYNC.refresh=j.refresh_token;
  SYNC.user=j.user;
  try{ localStorage.setItem(AUTH_KEY, JSON.stringify({
    token:j.access_token, refresh:j.refresh_token, user:j.user,
    expires: Date.now() + (j.expires_in||3600)*1000
  })); }catch(e){}
}
async function cloudRefresh(refresh){
  const r=await fetch(`${CLOUD.url}/auth/v1/token?grant_type=refresh_token`,{
    method:'POST',
    headers:{'apikey':CLOUD.key,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:refresh})
  });
  if(!r.ok) throw new Error('Sitzung abgelaufen');
  applySession(await r.json());
}
function cloudSignOut(){
  SYNC={state:'signed-out', msg:'', user:null, token:null, rev:0, lastPull:null, dirty:false};
  try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
  renderSyncBadge(); renderView();
  toast('Abgemeldet');
}

/* ---- Daten holen ---- */
async function pullFromCloud(silent){
  if(!SYNC.token) return;
  setSync('syncing','Lade…');
  try{
    const rows=await cloudFetch(`/rest/v1/progresslab?id=eq.${SYNC.user.id}&select=data,rev,updated_at`);
    const row=rows && rows[0];
    const meta=syncMeta();

    if(!row){
      // Noch nichts in der Cloud: aktuellen lokalen Stand hochladen
      await pushToCloud(true);
      return;
    }

    const cloudRev = row.rev||0;
    const seenRev  = meta.rev||0;          // Stand, den dieses Gerät zuletzt gesehen hat
    const localChanged = SYNC.dirty || !!meta.dirty;

    if(cloudRev===seenRev){
      // Cloud unverändert seit unserem letzten Abgleich
      SYNC.rev=cloudRev;
      if(localChanged){ await pushToCloud(); }
      else setSync('idle','Aktuell');
      return;
    }

    // Cloud hat einen neueren Stand
    if(!localChanged){
      applyCloudData(row);
      setSync('idle','Aktualisiert');
      if(!silent) toast('Daten aus der Cloud geladen');
      return;
    }

    // Beides geändert -> Konflikt
    SYNC.conflict = { cloud:row, localAt: meta.changedAt||Date.now() };
    setSync('conflict','Konflikt');
    showConflict();
  }catch(e){
    // Token abgelaufen? Einmal erneuern und nochmal versuchen.
    if(/JWT|token|401/i.test(e.message) && SYNC.refresh){
      try{ await cloudRefresh(SYNC.refresh); return pullFromCloud(silent); }catch(_){}
    }
    setSync('error', e.message||'Fehler');
  }
}
function applyCloudData(row){
  // Die Datenbank wird gleich komplett ersetzt. Ein gemerkter Rückweg zeigt
  // danach auf einen Stand, den es nicht mehr gibt – er würde einen gelöschten
  // Eintrag in fremde Daten schreiben.
  clearUndo();
  const d=row.data||{};
  DB.plans    = Array.isArray(d.plans)? d.plans : [];
  DB.logs     = Array.isArray(d.logs)?  d.logs  : [];
  DB.customEx = Array.isArray(d.customEx)? d.customEx : [];
  DB.measurements = Array.isArray(d.measurements)? d.measurements : [];
  DB.settings = (d.settings && typeof d.settings==='object') ? d.settings : DB.settings;
  DB.logs.sort((a,b)=>a.date-b.date);
  rebuildExDB(); migrateToEnglish(); migrateMuscleNames(); migrateExerciseIds();
  saveNow();
  SYNC.rev = row.rev||0;
  SYNC.dirty=false;
  setSyncMeta({rev:SYNC.rev, dirty:false, changedAt:null});
  renderView();
}

/* ---- Daten hochladen ---- */
async function pushToCloud(isFirst){
  if(!SYNC.token || SYNC.state==='conflict') return;
  setSync('syncing','Speichere…');
  try{
    const nextRev = (SYNC.rev||0)+1;
    const payload = { id:SYNC.user.id, data:DB, rev:nextRev, updated_at:new Date().toISOString() };
    await cloudFetch('/rest/v1/progresslab', {
      method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(payload)
    });
    SYNC.rev=nextRev;
    SYNC.dirty=false;
    setSyncMeta({rev:nextRev, dirty:false, changedAt:null});
    setSync('idle', isFirst?'Hochgeladen':'Gespeichert');
  }catch(e){
    if(/JWT|token|401/i.test(e.message) && SYNC.refresh){
      try{ await cloudRefresh(SYNC.refresh); return pushToCloud(isFirst); }catch(_){}
    }
    setSync('error', e.message||'Fehler');
  }
}

/* ---- Zustand + Anzeige ---- */
function setSync(state, msg){
  // Netzwerkfehler verständlich benennen
  if(state==='error' && (!navigator.onLine || /fetch|network|Load failed/i.test(msg||''))){
    msg='Offline – wird nachgeholt';
  }
  SYNC.state=state; SYNC.msg=msg||'';
  // ungespeicherte Änderungen auch über einen Neustart hinweg merken
  if(state!=='conflict'){
    const m=syncMeta();
    setSyncMeta({...m, rev:SYNC.rev, dirty:SYNC.dirty, changedAt: SYNC.dirty?(m.changedAt||Date.now()):null});
  }
  renderSyncBadge();
}
// Sobald wieder Netz da ist: ausstehende Änderungen hochladen
window.addEventListener('online', ()=>{
  if(SYNC.token && SYNC.state!=='conflict'){
    if(SYNC.dirty) pushToCloud(); else pullFromCloud(true);
  }
});
// Nach einem Fehler regelmäßig erneut versuchen (alle 30 s), solange etwas aussteht
setInterval(()=>{
  if(SYNC.state==='error' && SYNC.token && navigator.onLine){
    if(SYNC.dirty) pushToCloud(); else pullFromCloud(true);
  }
}, 30000);

/* ---- Konflikt: welchen Stand behalten? ---- */
function showConflict(){
  const c=SYNC.conflict; if(!c) return;
  const cd=c.cloud.data||{};
  const cloudInfo = `${(cd.plans||[]).length} Pläne · ${(cd.logs||[]).length} Trainings · ${(cd.customEx||[]).length} Übungen`;
  const localInfo = `${DB.plans.length} Pläne · ${DB.logs.length} Trainings · ${DB.customEx.length} Übungen`;
  const cloudWhen = c.cloud.updated_at ? fmtDateTime(new Date(c.cloud.updated_at).getTime()) : '—';
  const localWhen = c.localAt ? fmtDateTime(c.localAt) : '—';

  openModal(`<div class="grab"></div>
    <h2>Unterschiedliche Stände</h2>
    <p class="muted" style="font-size:13px;margin:8px 0 18px">
      Auf diesem Gerät und in der Cloud wurde unabhängig voneinander etwas geändert.
      Welcher Stand soll behalten werden?
    </p>

    <button class="cf-opt" onclick="resolveConflict('local')">
      <div class="cf-title">Dieses Gerät behalten ${I.chevron}</div>
      <div class="cf-sub">${localInfo}</div>
      <div class="cf-when">Zuletzt geändert: ${localWhen}</div>
    </button>

    <button class="cf-opt" onclick="resolveConflict('cloud')">
      <div class="cf-title">Cloud-Stand übernehmen ${I.chevron}</div>
      <div class="cf-sub">${cloudInfo}</div>
      <div class="cf-when">Zuletzt geändert: ${cloudWhen}</div>
    </button>

    <p class="faint" style="font-size:11.5px;margin-top:14px;line-height:1.5">
      Der nicht gewählte Stand wird überschrieben. Lade vorher ein Backup herunter,
      wenn du unsicher bist (Statistik → Backup).
    </p>
  `);
}
function resolveConflict(which){
  const c=SYNC.conflict; if(!c) return;
  SYNC.conflict=null;
  closeModal();
  if(which==='cloud'){
    applyCloudData(c.cloud);
    setSync('idle','Cloud übernommen');
    toast('Cloud-Stand übernommen');
  }else{
    // Lokalen Stand durchsetzen: über die Cloud-Version schreiben
    SYNC.rev = c.cloud.rev||0;
    SYNC.dirty=true;
    SYNC.state='idle';
    pushToCloud().then(()=>toast('Dieses Gerät hat gewonnen'));
  }
}
function fmtDateTime(ts){
  const d=new Date(ts);
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+' '+
         d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}

/* Übersetzt die englischen Meldungen von Supabase in verständliche Sätze. */
function authErrText(e){
  let m=(e && e.message)||'Fehlgeschlagen';
  if(/Invalid login/i.test(m)) m='E-Mail oder Passwort stimmt nicht';
  if(/already registered/i.test(m)) m='Diese E-Mail ist bereits registriert';
  if(/Invalid path|not found|404/i.test(m)) m='Die Projekt-URL stimmt nicht. Sie muss auf .supabase.co enden – ohne Schrägstrich und ohne Pfad dahinter.';
  if(/Invalid API key|apikey/i.test(m)) m='Der Schlüssel stimmt nicht. Nimm den „anon public“-Schlüssel aus den Projekt-Einstellungen.';
  if(/does not exist|relation/i.test(m)) m='Die Tabelle fehlt. Führe das SQL aus Schritt 2 der Anleitung aus.';
  if(/not confirmed/i.test(m)) m='E-Mail noch nicht bestätigt. Entweder Link in der Mail anklicken oder in Supabase „Confirm email“ ausschalten.';
  if(/Password should be at least/i.test(m)) m='Das Passwort braucht mindestens 6 Zeichen';
  if(/you can only request this after|rate limit|too many/i.test(m)) m='Zu viele Versuche. Warte ein paar Minuten und probier es noch einmal.';
  if(/otp_expired|invalid claim|expired|token has invalid/i.test(m)) m='Der Link ist abgelaufen. Fordere einen neuen an.';
  if(/fetch|network|Load failed/i.test(m)) m='Keine Verbindung. Stimmt die Projekt-URL? Bist du online?';
  return m;
}

/* ---- Passwort vergessen: neues Passwort setzen ----
   Der Link aus der Mail führt über /auth/v1/verify zurück auf diese Seite und
   hängt die Kennmarken an den Adressanker. Die werden hier gelesen, der Anker
   danach geleert – sonst käme dieses Fenster bei jedem Neuladen wieder und die
   Kennmarke stünde im Verlauf des Browsers. */
let RECOVERY=null;   // {access_token, refresh_token, expires_in} oder null
function recoveryFromUrl(){
  const h=(location.hash||'').replace(/^#/,'');
  if(!h) return null;
  const p=new URLSearchParams(h);
  const clean=()=>{ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; } };
  if(p.get('error') || p.get('error_code')){
    clean();
    return {error: p.get('error_description')||p.get('error_code')||'Der Link hat nicht funktioniert'};
  }
  if(p.get('type')!=='recovery' || !p.get('access_token')) return null;
  clean();
  return {
    access_token: p.get('access_token'),
    refresh_token: p.get('refresh_token'),
    expires_in: +(p.get('expires_in')||3600)
  };
}
function renderNewPassword(err, busy){
  openModal(`<div class="grab"></div>
    <div class="row" style="gap:10px;align-items:center;margin-bottom:4px">

}
async function doSetPassword(){
  const a=(document.getElementById('npass1').value||'').trim();
  const b=(document.getElementById('npass2').value||'').trim();
  if(a.length<6){ renderNewPassword('Das Passwort braucht mindestens 6 Zeichen'); return; }

  if(!RECOVERY){ renderNewPassword('Der Link ist abgelaufen. Fordere einen neuen an.'); return; }
  renderNewPassword('', true);
  try{

      user, expires_in: RECOVERY.expires_in
    });

    renderNewPassword(authErrText(e));

/* ---- Start: gespeicherte Sitzung wiederherstellen ---- */
async function initCloud(){
  if(!cloudConfigured()){ SYNC.state='off'; renderSyncBadge(); return; }
  // Kommt der Benutzer über den Link aus der Rücksetz-Mail, geht das vor:
  // eine alte Sitzung auf diesem Gerät wäre jetzt die falsche.
  const rec=recoveryFromUrl();
  if(rec){
    setSync('signed-out','Nicht angemeldet'); renderView();
    if(rec.error){ _authMode='in'; renderAuthForm(authErrText({message:rec.error})); }
    else { RECOVERY=rec; renderNewPassword(''); }
    return;
  }
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem(AUTH_KEY)); }catch(e){}
  if(!saved || !saved.refresh){ setSync('signed-out','Nicht angemeldet'); renderView(); return; }
  SYNC.token=saved.token; SYNC.refresh=saved.refresh; SYNC.user=saved.user;
  const meta=syncMeta();
  SYNC.rev=meta.rev||0; SYNC.dirty=!!meta.dirty;
  renderView();   // Anzeige sofort zeigen, dann im Hintergrund abgleichen
  try{
    if(!saved.expires || Date.now() > saved.expires-60000) await cloudRefresh(saved.refresh);
    await pullFromCloud(true);
  }catch(e){
    setSync('signed-out','Bitte neu anmelden');
  }
}

/* ---------- Helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2000);
}

/* ================================================================
   RÜCKGÄNGIG NACH DEM LÖSCHEN
   Die fünf dauerhaften Löschungen fragen nicht mehr vorher nach, sondern
   bieten danach für kurze Zeit die Rücknahme an. Ein Bestätigungsdialog
   schützt schlecht: Er wird weggeklickt, bevor man ihn gelesen hat. Die
   Rücknahme greift dagegen erst, wenn man das Ergebnis sieht.

   Gemerkt wird kein Datenabzug, sondern eine Funktion: Jede Löschstelle
   liefert ihren eigenen Rückweg. Das gelöschte Objekt lebt dadurch in der
   Closure weiter – nichts wird kopiert – und Nebenwirkungen (aufgeräumte
   Aufklapp-Zustände, Neuaufbau der Übungs-Tabellen) stehen direkt bei der
   Löschung, die sie verursacht hat.
   ================================================================ */
const UNDO_MS=8000;
let UNDO=null;   // {label, restore, timer, endAt} oder null

// Nach dem Löschen aufrufen. Ein bereits gemerkter Vorgang wird dadurch endgültig –
// es gibt immer nur eine rücknehmbare Löschung.
function registerUndo(label, restore){
  clearUndo();
  UNDO={label, restore, endAt:Date.now()+UNDO_MS};
  UNDO.timer=setTimeout(clearUndo, UNDO_MS);
  renderUndoBar();
}
function clearUndo(){
  if(UNDO && UNDO.timer) clearTimeout(UNDO.timer);
  UNDO=null;
  renderUndoBar();
}
function doUndo(){
  if(!UNDO) return;
  const restore=UNDO.restore;
  clearUndo();          // zuerst aufräumen, damit restore() nicht erneut auslöst
  restore();
  save();
  renderView();
  toast('Wiederhergestellt');
}
function renderUndoBar(){
  const el=document.getElementById('undoBar'); if(!el) return;
  if(!UNDO){
    el.classList.remove('show'); el.innerHTML='';
    document.body.classList.remove('undo-on');
    return;
  }
  el.innerHTML=`
    <div class="rt-bar"><div class="rt-fill" id="undoFill" style="width:100%"></div></div>
    <div class="ub-body">
      <span class="ub-txt">${esc(UNDO.label)}</span>
      <button class="ub-btn" onclick="doUndo()" aria-label="Löschen rückgängig machen">Rückgängig</button>
    </div>`;
  el.classList.add('show');
  document.body.classList.add('undo-on');
  // Der Balken läuft in einem Rutsch leer. Ohne ihn verfiele die Frist stumm,
  // was bei acht Sekunden überrascht. requestAnimationFrame, damit der
  // Startwert 100 % gerendert ist, bevor die Übergabe auf 0 beginnt.
  requestAnimationFrame(()=>{
    const f=document.getElementById('undoFill');
    if(f){ f.style.transition=`width ${UNDO_MS}ms linear`; f.style.width='0%'; }
  });
}
function fmtDate(ts){
  const d=new Date(ts), n=new Date();
  const same=d.toDateString()===n.toDateString();
  const y=new Date(n-864e5).toDateString()===d.toDateString();
  if(same) return 'Heute';
  if(y) return 'Gestern';
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtDay(ts){ return new Date(ts).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}); }
// Unterkörper: bestimmt, ob beim Vorschlag der große oder kleine Gewichtssprung gilt.
function isLower(m){ return ['Legs','Quads','Hamstrings','Glutes','Calves','Adductors','Abductors'].includes(m); }
function round(x,step){ return Math.round(x/step)*step; }

/* ================================================================
   GERÄTE: welche Gewichte lassen sich an einem Gerät überhaupt einstellen?
   Ohne diese Angabe rechnet die App wie bisher „Gewicht + Schrittweite“. Das
   passt zu einer Langhantel mit Scheiben, aber nicht zu verstellbaren Hanteln:
   Bei 4–40,5 kg in 1,5er-Schritten ist ein Vorschlag von 24,5 kg schlicht nicht
   einstellbar. Ein Gerät OHNE Eintrag verhält sich unverändert.
   ================================================================ */
function equipMap(){
  if(!DB.settings.equipment || typeof DB.settings.equipment!=='object') DB.settings.equipment={};
  return DB.settings.equipment;
}
// Zahl aus einer Eingabe: Komma und Punkt gelten beide als Dezimaltrennzeichen.
function parseNum(v){
  if(typeof v==='number') return isFinite(v)?v:NaN;
  if(v==null) return NaN;
  const n=parseFloat(String(v).replace(',','.').trim());
  return isFinite(n)?n:NaN;
}
// Anzeige mit deutschem Dezimalkomma, höchstens zwei Nachkommastellen.
function fmtKg(n){ return (Math.round(+n*100)/100).toLocaleString('de-DE'); }
/* Zahl aus einem Eingabefeld. Komma und Punkt gelten beide als Dezimaltrennzeichen.
   Umgewandelt wird bewusst HIER, an der Eingabe – nicht an den über dreißig
   Rechenstellen (+st.weight …). Dadurch steht in DB und SESSION immer eine echte
   Zahl, und jede bestehende Rechnung bleibt ohne Änderung richtig.
   Leer bleibt leer: Daran hängen die Platzhalter mit den Vorschlägen.
   Unlesbares wird ebenfalls zu leer, sonst rechnet die App mit NaN weiter. */
function feldZahl(v){
  const s=String(v==null?'':v).trim();
  if(s==='') return '';
  const n=parseNum(s);
  return isFinite(n)? n : '';
}
// Umgekehrter Weg: Zahl ins Eingabefeld, deutsch geschrieben. Leer bleibt leer.
function zahlFeld(v){
  if(v==null || v==='') return '';
  return String(v).replace('.', ',');
}
const EQUIP_MAX_STUFEN=500;   // Deckel gegen winzige Schritte über große Spannen
/* Alle einstellbaren Gewichte eines Geräts, aufsteigend. [] = nicht eingerichtet.
   Absichtlich zweigeteilt: Der Editor zeigt seine Vorschau über dieselbe
   Funktion, mit der die Progression später rechnet. So kann die Vorschau nicht
   etwas anderes behaupten, als hinterher herauskommt. */
function equipWeights(eq){ return equipWeightsFrom(eq ? equipMap()[eq] : null); }
function equipWeightsFrom(c){
  if(!c) return [];
  if(c.mode==='liste'){
    const arr=(Array.isArray(c.gewichte)?c.gewichte:[])
      .map(parseNum).filter(v=>isFinite(v) && v>0)
      .map(v=>Math.round(v*1000)/1000);
    return [...new Set(arr)].sort((a,b)=>a-b);
  }
  const von=parseNum(c.von), bis=parseNum(c.bis), schritt=parseNum(c.schritt);
  if(!isFinite(von)||!isFinite(bis)||!isFinite(schritt)) return [];
  if(schritt<=0 || bis<von || von<=0) return [];
  const out=[];
  // Kleine Toleranz, damit der letzte Wert nicht an einem Fließkomma-Rest scheitert
  for(let v=von; v<=bis+1e-9 && out.length<EQUIP_MAX_STUFEN; v+=schritt){
    out.push(Math.round(v*1000)/1000);
  }
  return out;
}
/* Nächstes einstellbares Gewicht, `stufen` Stufen über dem aktuellen.
   amEnde = das aktuelle Gewicht liegt bereits auf oder über der letzten Stufe;
   dann geht es an diesem Gerät körperlich nicht weiter. */
function nextEquipWeight(list, aktuell, stufen){
  if(!list.length) return {weight:aktuell, amEnde:false};
  const a=+aktuell||0;
  let idx=-1;   // letzter Eintrag <= aktuell; -1 wenn aktuell unter der ersten Stufe liegt
  for(let i=0;i<list.length;i++){ if(list[i]<=a+1e-9) idx=i; else break; }
  if(idx===list.length-1) return {weight:list[idx], amEnde:true};
  const ziel=Math.min(idx+Math.max(1,stufen|0), list.length-1);
  return {weight:list[ziel], amEnde:false};
}
/* Geräte, für die sich eine Einrichtung lohnt. Körpergewicht und „Ohne Gerät“
   haben keine einstellbaren Gewichte und stehen deshalb nicht zur Auswahl. */
const EQUIP_OHNE_GEWICHT=['Körpergewicht','Ohne Gerät'];
function equipConfigurable(){ return equipList().filter(q=>!EQUIP_OHNE_GEWICHT.includes(q)); }

/* ================================================================
   PROGRESSIVE OVERLOAD ENGINE
   Schlägt Gewicht/Wdh für den nächsten Satz vor, basierend auf
   der letzten protokollierten Leistung dieser Übung.
   ================================================================ */
function lastPerf(exName, exId){
  // Übung im Log per stabiler ID finden; Fallback auf den Namen (Altdaten).
  const match=(e)=> (exId && e.exId===exId) || (e.name===exName);
  for(let i=DB.logs.length-1;i>=0;i--){
    const ex=DB.logs[i].exercises.find(match);
    if(ex && ex.sets.some(s=>s.done)) return {log:DB.logs[i], ex};
  }
  return null;
}
/* Bester Einzelsatz einer Übung – der „Rekord“.
   Bewusst über ALLE Trainings, nicht nur über dieselbe Einheit: Ein Rekord ist
   unabhängig davon, an welchem Tag er fiel. Genau darin unterscheidet er sich
   von „zuletzt“, das immer die gleiche Einheit meint.
   Gewertet wird das Volumen des Satzes. Bringt keine einzige Wiederholung
   Volumen mit (Körpergewichtsübung), zählen stattdessen die Wiederholungen –
   dieselbe Lesart nutzt der Vergleichsbalken schon.
   Grundlage sind nur abgeschlossene Trainings. Die laufende SESSION bleibt
   auszen vor, und weil DB.logs während einer Einheit unverändert bleibt, ist
   das automatisch „der Stand, mit dem du reingegangen bist“. */
function bestSet(exId, exName){
  const passt=e=> (exId && e.exId===exId) || (exName && e.name===exName);
  const f=exFactor(exName, exId);
  let best=null, bestReps=null;
  (DB.logs||[]).forEach(l=>{
    (l.exercises||[]).forEach(e=>{
      if(!passt(e)) return;
      (e.sets||[]).forEach(s=>{
        if(s.done===false) return;
        const w=+s.weight||0, r=+s.reps||0;
        if(r<=0) return;
        const vol=w*f*r;
        if(!best || vol>best.vol) best={weight:w, reps:r, vol, date:l.date};
        if(!bestReps || r>bestReps.reps) bestReps={weight:w, reps:r, vol:0, date:l.date};
      });
    });
  });
  if(!best) return null;
  return best.vol>0 ? best : bestReps;
}
/* ---------- Vergleich mit dem letzten Training DERSELBEN Einheit ---------- */
// Letztes abgeschlossenes Training mit gleichem Einheitsnamen (z. B. "Montag - Rücken")
function lastSessionLog(dayName){
  for(let i=DB.logs.length-1;i>=0;i--){
    if(DB.logs[i].dayName===dayName) return DB.logs[i];
  }
  return null;
}
// Volumen einer Übung in einem Log (mit Hantel-Faktor). Sucht per ID, Fallback Name.
function exVolumeInLog(log, exName, exId){
  if(!log) return 0;
  const e=log.exercises.find(x=> (exId && x.exId===exId) || x.name===exName);
  if(!e) return 0;
  const f=exFactor(exName, exId);
  return e.sets.filter(s=>s.done!==false).reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
}
// Volumen einer Übung in der laufenden Session (nur abgehakte Sätze)
function exVolumeNow(ex){
  const f=exFactor(ex.name, ex.exId);
  return ex.sets.filter(s=>s.done).reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
}
/* Kleinster RIR-Wert unter den abgehakten Sätzen mit einem bestimmten Gewicht.
   Bewusst das Minimum und nicht der Durchschnitt: Die Frage lautet „wie viel war
   im SCHWERSTEN Moment mit diesem Gewicht noch übrig?“. Wer 50 kg mit RIR 3, 1
   und 0 drückt, war am Ende am Anschlag – ein Mittelwert von 1,3 würde einen
   doppelten Sprung nahelegen, obwohl der letzte Satz gerade so ging.
   Rückgabe null, wenn nichts Verwertbares erfasst ist (Altdaten, leeres Feld).
   Die Trainingsansicht speichert den RIR als Zeichenkette, deshalb +s.rir. */
function minRir(sets, weight){
  let m=null;
  sets.forEach(s=>{
    if((+s.weight||0)!==weight) return;
    if(s.rir==null || s.rir==='') return;
    const v=+s.rir;
    if(!isFinite(v)) return;
    if(m==null || v<m) m=v;
  });
  return m;
}
/* Wie viele Schritte auf einmal? Reserve heißt: die Last war zu leicht.
   null (nicht erfasst) gilt als „keine Reserve“ – also wie bisher ein Schritt. */
function rirFactor(rir){
  if(rir==null) return 1;
  if(rir>=4) return 3;
  if(rir>=2) return 2;
  return 1;
}
function suggest(exName, targetReps, muscle, exId){
  const p=lastPerf(exName, exId);
  const inc = isLower(muscle)?DB.settings.incrementLower:DB.settings.incrementUpper;
  if(!p){ return {weight:'', reps:targetReps, note:'Erstes Mal — taste dich heran'}; }
  const done=p.ex.sets.filter(s=>s.done);
  const tgt=+targetReps||p.ex.targetReps||10;

  /* Übung ohne Gewicht (Klimmzüge, Liegestütze …): Der Fortschritt läuft über
     Wiederholungen. Dieselbe Lesart nutzt der Vergleichsbalken im Training
     schon – Volumen 0 bedeutet dort: Wiederholungen vergleichen.
     Erkannt am tatsächlich protokollierten Gewicht, nicht am Geräte-Feld:
     Klimmzüge mit Gewichtsgürtel sollen weiter über das Gewicht laufen.
     Ohne diesen Zweig blieb top unten auf {weight:0,reps:0} stehen, weil
     0 > 0 falsch ist – die Übung landete dann dauerhaft bei „Ziel minus 2“,
     selbst wenn das Ziel übertroffen wurde. */
  const maxW=done.reduce((a,s)=>Math.max(a,+s.weight||0),0);
  if(maxW===0){
    const best=done.reduce((a,s)=>Math.max(a,+s.reps||0),0);
    if(best>=tgt){
      const plus=rirFactor(minRir(done,0));
      const ziel=best+plus;
      return {weight:'', reps:ziel,
        note: plus>1 ? `Ziel geschafft mit Reserve — versuch ${ziel} Wdh`
                     : `Ziel geschafft — versuch ${ziel} Wdh`};
    }
    return {weight:'', reps:tgt, note:`Hol dir die ${tgt}. Wdh`};
  }

  const top=done.reduce((a,s)=>(+s.weight> a.weight?{weight:+s.weight,reps:+s.reps}:a),{weight:0,reps:0});
  const rir=minRir(done, top.weight);
  // Hat der User im Top-Satz das Wdh-Ziel erreicht/übertroffen? -> Gewicht hoch.
  // Mit Reserve fällt der Sprung größer aus; bei RIR 0/1 bleibt alles wie bisher.
  if(top.reps>=tgt){
    const f=rirFactor(rir);
    const grund = f>1 ? `Ziel geschafft mit ${rir} RIR Reserve` : 'Ziel letztes Mal geschafft';
    // Ist das Gerät eingerichtet, zählt der RIR-Faktor in STUFEN statt in Kilo –
    // der Vorschlag fällt dann immer auf ein Gewicht, das sich einstellen lässt.
    const meta=exMetaById(exId)||exMeta(exName);
    const leiter=equipWeights(meta&&meta.eq);
    if(leiter.length){
      const st=nextEquipWeight(leiter, top.weight, f);
      if(st.amEnde){
        // Oberes Ende des Geräts: mehr Gewicht gibt es nicht, also über die
        // Wiederholungen weiter. repsVorschlag, weil hier ausnahmsweise ein
        // Vorschlag MIT Gewicht trotzdem die Wiederholungen meint.
        return {weight:top.weight, reps:top.reps+f, repsVorschlag:true,
          note:`${meta.eq} am Anschlag (${fmtKg(top.weight)} kg) — steigere über Wiederholungen`};
      }
      const stufen = f===1 ? 'nächste Stufe' : `${f} Stufen weiter`;
      return {weight:st.weight, reps:tgt,
        note:`${fmtKg(st.weight)} kg — ${stufen}, ${grund} (${top.reps} Wdh)`};
    }
    const plus=inc*f;
    const nw=round(top.weight+plus,inc>=5?2.5:1.25);
    return {weight:nw, reps:tgt, note:`+${plus} kg — ${grund} (${top.reps} Wdh)`};
  }
  // knapp dran -> gleiches Gewicht, mehr Wdh anpeilen.
  // Reserve trotz verfehltem Ziel ist ein Widerspruch, der benannt gehört.
  if(top.reps>=tgt-2){
    const note = (rir!=null && rir>=2)
      ? `Gleiches Gewicht — ${rir} Wdh waren noch drin, hol dir die ${tgt}.`
      : `Gleiches Gewicht — hol dir die ${tgt}. Wdh`;
    return {weight:top.weight, reps:tgt, note};
  }
  // deutlich drunter -> Gewicht halten, Technik/Wdh festigen
  return {weight:top.weight, reps:Math.max(top.reps,tgt-2), note:'Gewicht halten & Wiederholungen aufbauen'};
}

/* ---------- Volume / Stats helpers ---------- */
function logVolume(log){
  return log.exercises.reduce((sum,ex)=>{
    const f=exFactor(ex.name, ex.exId);
    return sum+ex.sets.filter(s=>s.done).reduce((a,s)=>a+(+s.weight||0)*f*(+s.reps||0),0);
  },0);
}
// Gewichts-Faktor einer Übung: 2 bei Kurzhantel-Übungen mit zwei Hanteln, sonst 1.
// Das gespeicherte Satz-Gewicht ist immer das Gewicht EINER Hantel.
// Sucht per ID (stabil), Fallback auf den Namen.
function exFactor(name, exId){ const m=exMetaById(exId)||exMeta(name); return (m && m.dumbbells===2) ? 2 : 1; }

  {id:'today',label:'Training',icon:I.today},
  {id:'plans',label:'Pläne',icon:I.plans},
  {id:'exercises',label:'Übungen',icon:I.dumb},

function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(t=>
    `<button class="${t.id===current?'on':''}" onclick="go('${t.id}')">${t.icon}<span>${t.label}</span></button>`
  ).join('');
}
function go(tab){ current=tab; renderNav(); renderView(); window.scrollTo(0,0); }
function renderView(){
  const app=document.getElementById('app');
  if(current==='today') app.innerHTML=viewToday();
  else if(current==='plans') app.innerHTML=viewPlans();
  else if(current==='exercises') app.innerHTML=viewExercises();
  else if(current==='history') app.innerHTML=viewHistory();
  else if(current==='stats'){ app.innerHTML=viewStats();
    const sel=document.getElementById('strEx'); if(sel&&sel.value) renderExerciseProgress(sel.value);
  }
  else if(current==='equip') app.innerHTML=viewEquipment();
  else if(current==='body'){ app.innerHTML=viewBody();
    const sel=document.getElementById('msSel'); if(sel&&sel.value) renderMeasureChart(sel.value);
  }
  // Trainings-Modus: feste Bildschirmhöhe, kein Scrollen
  const inSession = !!(SESSION && current==='today');
  document.body.classList.toggle('in-session', inSession);
  if(inSession){ initSessSwipe(); fitSessImage(); }

  return `<div class="topbar"><div class="brand">
      <div class="mark">${I.dumb}</div>

      <div class="sub">${sub||'Strength · Data · Progress'}</div></div>

/* Statusanzeige der Cloud – zeigt, was gerade passiert */
function syncBadge(){
  if(SYNC.state==='off') return '';
  const map={
    'signed-out':{cls:'off',  ico:I.cloudOff, txt:'Anmelden'},
    'syncing':   {cls:'busy', ico:I.cloud,    txt:SYNC.msg||'Synchronisiere…'},
    'idle':      {cls:'ok',   ico:I.cloudOk,  txt:SYNC.dirty?'Nicht gespeichert':(SYNC.msg||'Synchron')},
    'error':     {cls:'err',  ico:I.cloudOff, txt:SYNC.msg||'Fehler'},
    'conflict':  {cls:'err',  ico:I.cloudOff, txt:'Konflikt'}
  };
  const s=map[SYNC.state]||map['idle'];
  return `<button class="sync-badge ${s.cls}" onclick="openSyncPanel()" title="${esc(s.txt)}" aria-label="Cloud-Synchronisierung: ${esc(s.txt)}">
    <span class="sync-ico">${s.ico}</span>
    <span class="sync-txt">${esc(s.txt)}</span>
  </button>`;
}
function renderSyncBadge(){
  document.querySelectorAll('.topbar .sync-badge').forEach(b=>{
    const wrap=document.createElement('div');
    wrap.innerHTML=syncBadge();
    const neu=wrap.firstElementChild;
    if(neu) b.replaceWith(neu); else b.remove();
  });
}

/* Einklappbare Pläne: Zustand je Bereich ('today' / 'plans') und Plan-ID,
   dauerhaft in den Einstellungen gemerkt. Standard: aufgeklappt. */
function collapsedMap(){
  if(!DB.settings) DB.settings={};
  if(!DB.settings.collapsed || typeof DB.settings.collapsed!=='object') DB.settings.collapsed={};
  return DB.settings.collapsed;
}
function isCollapsed(area, planId){ return !!collapsedMap()[area+':'+planId]; }
function togglePlan(area, planId){
  const m=collapsedMap(); const k=area+':'+planId;
  if(m[k]) delete m[k]; else m[k]=1;
  save(); renderView();
}
function setAllPlans(area, collapsed){
  const m=collapsedMap();
  DB.plans.forEach(p=>{ const k=area+':'+p.id; if(collapsed) m[k]=1; else delete m[k]; });
  save(); renderView();
}
function anyOpen(area){ return DB.plans.some(p=>!isCollapsed(area,p.id)); }

            <div class="faint" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.exercises.map(e=>esc(e.name)).join(' · ')||'Noch keine Übungen'}</div>
          </div>
          <div class="day-go">${I.play}</div>

      </div>`:''}

  }).join('');

    <div class="card">
      <div class="row between"><div>
        <div class="eyebrow" style="color:var(--accent-dim)">Aktuelle Serie</div>
        <div class="display num" style="font-size:40px;line-height:1;margin-top:4px">${streak}<span style="font-size:18px;color:var(--text-dim);margin-left:6px">${streak===1?'Training':'Trainings'}</span></div>
      </div><div style="color:var(--accent);opacity:.9">${I.fire}</div></div>
      ${weekBar()}
      ${lastLog?`<div class="hr"></div><div class="row between"><span class="faint" style="font-size:13px">Letztes Training</span><span class="muted" style="font-size:13px;font-weight:600">${esc(lastLog.dayName)} · ${fmtDate(lastLog.date)}</span></div>`:''}
    </div>
    <div class="row between" style="margin:24px 4px 12px">
      <div class="eyebrow">Training starten</div>
      ${DB.plans.length>1?`<button class="filt-toggle" onclick="setAllPlans('today',${anyOpen('today')})">
        ${anyOpen('today')?'Alle einklappen':'Alle ausklappen'}
      </button>`:''}
    </div>
    ${DB.plans.length? planCards : `<div class="empty">${I.dumb}
      <h3>Noch kein Plan</h3><p style="font-size:13.5px">Erstelle zuerst einen Trainingsplan unter „Pläne“.</p>
      <div style="height:16px"></div>
      <button class="btn wauto" style="margin:0 auto" onclick="go('plans')">Plan erstellen</button></div>`}
    ${DB.plans.length?`<div class="hr" style="margin:22px 0"></div>
      <button class="btn-slim" onclick="startFreestyle()">${I.plus}<span>Freies Training</span></button>`:''}
  </div>`;
}
/* Serie = Trainings in Folge, ohne dass eine zu lange Pause dazwischen liegt.
   Ruhetage laut Plan brechen die Serie also nicht.
   Erlaubte Lücke leitet sich aus dem Wochenziel ab (z. B. 4×/Woche -> ca. alle 2 Tage,
   erlaubt sind großzügig 4 Tage). Mindestens 3 Tage, damit es nie zu streng wird. */
function maxGapDays(){
  // Größtes Wochenziel aller Pläne verwenden (der aktivste Plan bestimmt den Takt)
  const goals=DB.plans.map(p=>+p.perWeek||p.days.length||3).filter(x=>x>0);
  const perWeek = goals.length? Math.max(...goals) : 3;
  const typical = 7/perWeek;             // typischer Abstand in Tagen
  return Math.max(3, Math.ceil(typical*2)); // Toleranz: doppelter Abstand, min. 3 Tage
}
/* Wochenziel: wie viele Trainings diese Woche (Montag–Sonntag) geschafft? */
function weekGoal(){
  const goals=DB.plans.map(p=>+p.perWeek||p.days.length||0).filter(x=>x>0);
  return goals.length? Math.max(...goals) : 0;
}
function weekBar(){
  const goal=weekGoal();
  if(!goal) return '';
  const now=new Date();
  const monday=new Date(now); monday.setHours(0,0,0,0);
  const dow=(monday.getDay()+6)%7;           // Montag = 0
  monday.setDate(monday.getDate()-dow);
  const days=new Set(DB.logs
    .filter(l=>l.date>=monday.getTime())
    .map(l=>new Date(l.date).toDateString()));
  const done=days.size;
  const pct=Math.min(100, Math.round(done/goal*100));
  const reached=done>=goal;
  return `<div class="hr"></div>
    <div class="row between" style="margin-bottom:7px">
      <span class="faint" style="font-size:12px">Diese Woche</span>
      <span style="font-size:12px;font-weight:700;color:${reached?'var(--accent)':'var(--text-dim)'}">${done} / ${goal}${reached?' ✓':''}</span>
    </div>
    <div class="sess-bar"><div class="sess-fill" style="width:${pct}%"></div></div>`;
}
function calcStreak(){
  if(!DB.logs.length) return 0;
  const gap=maxGapDays();
  // Trainingstage (eindeutig), neueste zuerst
  const days=[...new Set(DB.logs.map(l=>new Date(l.date).toDateString()))]
    .map(d=>{const x=new Date(d); x.setHours(0,0,0,0); return x;})
    .sort((a,b)=>b-a);
  const today=new Date(); today.setHours(0,0,0,0);
  // Ist das letzte Training zu lange her? Dann ist die Serie vorbei.
  if(Math.round((today-days[0])/864e5) > gap) return 0;
  let streak=1;
  for(let i=1;i<days.length;i++){
    const diff=Math.round((days[i-1]-days[i])/864e5);
    if(diff<=gap) streak++; else break;
  }
  return streak;
}
function _plan(id){ return DB.plans.find(x=>x.id===id); }

/* ================================================================
   SESSION (laufendes Workout)
   ================================================================ */
function startSession(plan, day){
  SESSION={
    planId:plan?plan.id:null, planName:plan?plan.name:'Freies Training',
    dayName:day.name, date:Date.now(),
    exercises: day.exercises.map(ex=>{
      // Stabile Übungs-ID: aus dem Plan übernehmen, sonst per Name auflösen (Altpläne).
      const exId = ex.exId || exIdForName(ex.name);
      // Aktuellen Namen aus der Übungs-DB nehmen (falls die Übung umbenannt wurde);
      // sonst den im Plan gespeicherten Namen.
      const meta = exMetaById(exId);
      const name = meta ? meta.n : ex.name;
      const muscle = meta ? meta.g : ex.muscle;
      const sg=suggest(name, ex.reps, muscle, exId);
      const prevSets=prevPerfSets(name, day.name, exId); // Sätze aus dem letzten Training (kann leer sein)
      // Satzanzahl richtet sich nach dem letzten Training; ohne Vorgeschichte gilt der Plan
      const n = prevSets.length ? prevSets.length : (ex.sets||3);
      return {exId, name, muscle, targetReps:ex.reps, targetSets:n, rest:+ex.rest||0,
        sets:Array.from({length:n},(_,i)=>({
          weight:'', reps:'', rir:'0', done:false, sug:sg,   // RIR startet bei 0
          prev: prevSets[i] || null   // Ergebnis desselben Satzes im letzten Training
        }))};
    })
  };
  saveSession();
  go('today');
}
// Liefert die abgehakten Sätze der Übung aus dem letzten Training (als {weight,reps}).
// Bevorzugt das letzte Training DERSELBEN Einheit; sonst das letzte Vorkommen überhaupt.
function prevPerfSets(exName, dayName, exId){
  if(dayName){
    const log=lastSessionLog(dayName);
    const ex=log && log.exercises.find(e=> (exId && e.exId===exId) || e.name===exName);
    if(ex && ex.sets.some(s=>s.done!==false)){
      return ex.sets.filter(s=>s.done!==false).map(s=>({weight:+s.weight||0, reps:+s.reps||0, rir:(s.rir!=null?s.rir:'')}));
    }
  }
  const p=lastPerf(exName, exId);
  if(!p) return [];
  return p.ex.sets.filter(s=>s.done).map(s=>({weight:+s.weight||0, reps:+s.reps||0, rir:(s.rir!=null?s.rir:'')}));
}
function startFreestyle(){ SESSION={planId:null,planName:'Freies Training',dayName:'Freies Training',date:Date.now(),exercises:[]}; saveSession(); go('today'); }

/* Uhrzeit im Training, immer 24-Stunden-Format (unabhängig von der Geräte-Region) */
function clockNow(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
// Aktualisiert nur das Uhr-Element, nicht die ganze Ansicht – sonst würden
// Eingaben in den Satzfeldern beim Tippen verloren gehen.
function tickSessClock(){
  const el=document.getElementById('sessClock');
  if(el){ const t=clockNow(); if(el.textContent!==t) el.textContent=t; }
}
setInterval(tickSessClock, 1000);

        <div class="faint" style="font-size:11px">${s.planName==='Freies Training'?'Freies Training':esc(s.planName)}</div>
      </div>
      <div class="row sess-ctls" style="gap:6px;flex-shrink:0">
        <div class="sess-clock" id="sessClock">${clockNow()}</div>
        <button class="sess-btn danger" onclick="cancelSession()">${I.x}<span>Abbrechen</span></button>
        <button class="sess-btn solid" onclick="finishSession()">${I.check}<span>Fertig</span></button>
      </div>
    </div>

    <div class="sess-vol">
      <div class="row between" style="margin-bottom:7px">
        <span class="faint" style="font-size:12px">${doneSets}/${totalSets} Sätze</span>
        <span class="display" style="font-size:15px;color:var(--accent)">${pct}%</span>
      </div>
      <div class="sess-bar"><div class="sess-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="sess-body" id="sessBody">
      ${ex?exerciseCard(ex,ei):`<div class="sess-empty">
        <div class="faint" style="font-size:13px;margin-bottom:14px">Noch keine Übung in dieser Einheit.</div>
        <button class="btn-slim solid" onclick="addExerciseToSession()">${I.plus}<span>Übung hinzufügen</span></button>
      </div>`}
    </div>

    ${n>1?`<div class="sess-nav">
      <button class="sess-arrow" ${ei===0?'disabled':''} onclick="goExercise(${ei-1})" aria-label="Vorherige Übung">${I.chevronL}</button>
      <div class="sess-dots">
        ${s.exercises.map((e,i)=>{
          const allDone=e.sets.length&&e.sets.every(x=>x.done);
          return `<button class="sess-dot ${i===ei?'on':''} ${allDone?'done':''}" onclick="goExercise(${i})" title="${escAttr(e.name)}" aria-label="Zu Übung ${i+1}: ${escAttr(e.name)}"${i===ei?' aria-current="true"':''}></button>`;
        }).join('')}
      </div>
      <button class="sess-arrow" ${ei===n-1?'disabled':''} onclick="goExercise(${ei+1})" aria-label="Nächste Übung">${I.chevron}</button>

}
function goExercise(i){
  const n=SESSION.exercises.length;
  if(i<0||i>n-1) return;
  SESSION.page=i;
  saveSession();
  renderView();
}
function toggleSessImg(){
  SESSION.hideImg=!SESSION.hideImg;
  saveSession();
  renderView();
}
/* Wischen zwischen Übungen (Touch) */
/* Wie viele Sätze immer vollständig zu sehen sind. Diese Zusage steht in der
   Rangfolge über dem Bild – anders als bis 1.19.7, wo das Bild zuerst bediente
   wurde und auf dem Handy zweieinhalb Sätze übrig blieben. */
const SICHTBARE_SAETZE = 3;
/* Letzte Platzverteilung, siehe fitSessImage(). Das Feld `zweig` sagt, WELCHER
   Zweig sie gefüllt hat ('panel' oder 'hoch') – die übrigen Felder sind je
   Zweig verschieden, weil der Panel-Zweig früher zurückkehrt und die Werte des
   anderen gar nicht kennt. Ohne `zweig` war auf kein Feld Verlass. */
let FIT_DIAG=null;
/* Kleinstes Bild, das noch gezeigt wird. Gemessen, nicht geschätzt: Auf dem
   Handy (500×844) bleiben bei einer Übung mit fünf Sätzen und Vorgeschichte
   nach den drei reservierten Satzblöcken 80,6 px übrig. Der Wert muss darunter
   liegen, sonst verschwände das Bild dort ganz. Bis 1.19.7 standen hier 110 px –
   die Differenz ist der Preis für den dritten sichtbaren Satz. */
const MIN_IMG_PX = 78;
/* Höhe von genau SICHTBARE_SAETZE Satzblöcken, aus dem gerenderten Block
   abgeleitet. Der Abstand HINTER dem letzten Block zählt bewusst nicht mit –
   sonst lugte der vierte Block angeschnitten herein, und „genau drei“ wäre es
   nicht mehr. Muss aufgerufen werden, solange maxHeight nicht gesetzt ist,
   sonst misst man die eigene Vorgabe nach. */
/* Maße eines Satzblocks: Höhe und Abstand zum nächsten. */
function satzMasze(sets){
  const bl=sets.querySelectorAll('.set-block');
  if(!bl.length) return null;
  const bh=bl[0].getBoundingClientRect().height;
  const luecke = bl.length>1
    ? (bl[1].getBoundingClientRect().top - bl[0].getBoundingClientRect().bottom)
    : (parseFloat(getComputedStyle(bl[0]).marginBottom)||0);
  return {bh, luecke, anzahl:bl.length};
}
// Höhe für genau n Blöcke – der Abstand hinter dem letzten zählt nicht mit.
function hoeheFuerSaetze(n, m){ return n*m.bh + (n-1)*m.luecke; }
/* Wie viel Höhe steht dem Satzbereich zur Verfügung? Nicht ausgerechnet, sondern
   den Browser gefragt: Ohne Begrenzung füllt der Bereich (flex:1 1 auto) genau
   den freien Platz der Spalte aus, und das ist die gesuchte Zahl.
   Der frühere Weg – Bereich auf 0 und die übrigen Kinder aufsummieren – lieferte
   auf dem Panel 0: Dort steckt ein automatischer Abstand in der Spalte, der den
   frei werdenden Raum sofort aufsaugt und in die Scrollhöhe eingeht. */
function platzFuerSaetze(sets){
  const altMax=sets.style.maxHeight;
  const altVar=sets.style.getPropertyValue('--sets-max');
  sets.style.maxHeight='';
  sets.style.removeProperty('--sets-max');
  /* Rechteck statt clientHeight: Letzteres rundet auf ganze Pixel, und ein
     Bruchteil zu wenig ließ einen Satz durchfallen, der gerade noch passte. */
  const h=sets.getBoundingClientRect().height;
  sets.style.maxHeight=altMax;
  if(altVar) sets.style.setProperty('--sets-max', altVar);
  else sets.style.removeProperty('--sets-max');
  return h;
}
function dreiSatzHoehe(sets){
  const bl=sets.querySelectorAll('.set-block');
  if(!bl.length) return 0;
  if(bl.length>=SICHTBARE_SAETZE){
    /* Echt gemessen statt hochgerechnet. Die Blöcke sind NICHT gleich hoch: Ein
       geschlagener Rekord trägt auf, und eine umbrechende Info-Zeile erst recht.
       Der erste Block mal drei lag deshalb daneben – mal zu hoch, dann lugte der
       vierte Satz herein, mal zu niedrig. Die Differenz zweier Rechtecke ist
       zudem unabhängig davon, wie weit der Bereich gerade gescrollt ist. */
    return bl[SICHTBARE_SAETZE-1].getBoundingClientRect().bottom
         - bl[0].getBoundingClientRect().top;
  }
  // Weniger Sätze als zugesagt: hochrechnen, damit der Bildrahmen gleich bleibt.
  return hoeheFuerSaetze(SICHTBARE_SAETZE, satzMasze(sets));
}
/* Den Satzbereich auf drei Blöcke kappen – für die Zweige, in denen sonst
   allein das CSS die Höhe bestimmt (Querformat und flaches Panel). Hat die
   Übung weniger als drei Sätze, bleibt sie kürzer. */
/* Begrenzt den Satzbereich auf so viele GANZE Sätze, wie die Spalte hergibt –
   mindestens SICHTBARE_SAETZE, höchstens alle. Zwei Dinge fallen damit weg:
   ein Scrollbalken, obwohl noch Platz für einen weiteren Satz wäre, und ein
   halb angeschnittener Satz am unteren Rand.
   Passt alles, wird gar nicht begrenzt – dann gibt es auch nichts zu scrollen. */
function begrenzeSatzbereich(sets){
  const m=satzMasze(sets);
  const frei=()=>{ sets.style.maxHeight=''; sets.style.removeProperty('--sets-max'); };
  if(!m){ frei(); return; }
  const platz=platzFuerSaetze(sets);
  let n=SICHTBARE_SAETZE;
  if(platz>0){
    /* +luecke, weil der Abstand hinter dem letzten Block nicht gebraucht wird.
       +0.5 als Toleranz gegen Rundung: Ohne sie fiel ein Satz durch, der um
       zwei Zehntel Pixel gepasst hätte. */
    const passt=Math.floor((platz + m.luecke + 0.5) / (m.bh + m.luecke));
    n=Math.max(SICHTBARE_SAETZE, Math.min(m.anzahl, passt));
  }
  if(n>=m.anzahl){ frei(); return; }
  /* Aufgerundet, nicht abgerundet: n Blöcke messen selten eine ganze Zahl.
     Abrunden schnitt vom letzten sichtbaren Satz einen Bruchteil ab. */
  const px=Math.ceil(hoeheFuerSaetze(n, m));
  sets.style.maxHeight=px+'px';
  sets.style.setProperty('--sets-max', px+'px');
}
/* Bildhöhe an den tatsächlich freien Platz anpassen:
   Karte darf höchstens so hoch werden wie der Bereich zwischen Volumen-Karte und Punkten.
   Das Bild bekommt genau den Platz, der nach Kopfzeile und Sätzen übrig bleibt. */
/* Verteilt den verfügbaren Platz in der Übungskarte:
   Kopfzeile und Vergleichsbalken sind fix, die Sätze haben Vorrang,
   das Bild bekommt den Rest. Reicht es selbst ohne Bild nicht (kleiner Bildschirm
   oder Windows-Skalierung), scrollen ausschließlich die Sätze – Timer, Punkte
   und Navigation bleiben immer sichtbar. */
function fitSessImage(){
  const body=document.getElementById('sessBody'); if(!body) return;
  const card=body.querySelector('.ex-card'); if(!card) return;
  const head=card.querySelector('.row');
  const sets=card.querySelector('.ex-sets');
  const vc=card.querySelector('.vc');
  const prev=card.querySelector('.ex-preview');
  if(!sets) return;

  // "Flaches Panel" = wenig vertikaler Platz UND breit (Querformat-Display wie
  // das Promethean-Panel). Auch der Standalone-Modus (zum Startbildschirm
  // hinzugefügt, ohne Adressleiste) zählt dazu: dort meldet der Chromium mancher
  // Panels eine größere Höhe (z. B. 684 statt 600). Auf dem Promethean-Panel
  // gemessen: innerHeight 684, 100vh 684, 100dvh 0 – dvh wird dort nicht
  // unterstützt. Deshalb rechnet diese Funktion konsequent ohne dvh.
  const standalone = !!(window.matchMedia && (
      matchMedia('(display-mode: standalone)').matches ||
      matchMedia('(display-mode: fullscreen)').matches
  )) || (('standalone' in navigator) && navigator.standalone);
  const breit = window.innerWidth >= 900;
  // Schwelle 720px fängt flache Panels (588–684) ein, lässt echte Tablets (768+) aus.
  // Im Standalone-Modus gilt die großzügigere Grenze von 900px, weil dort teils
  // eine zu große Höhe gemeldet wird. Sie muss trotzdem gesetzt sein: sonst gilt
  // ein als App installierter 1080p-Desktop (~985px) fälschlich als flaches Panel.
  // Gleiche Schwellen wie in der Panel-Media-Query im <style> – bitte zusammen ändern.
  const flach = breit && (window.innerHeight <= 720 || (standalone && window.innerHeight <= 900));

  // Verlässlichste sichtbare Höhe bestimmen. Im Standalone-Modus kann innerHeight
  // zu groß sein; visualViewport und clientHeight sind dann oft genauer. Wir nehmen
  // den kleinsten plausiblen Wert (> 300), damit nichts unter Timer/Nav rutscht.
  function echteHoehe(){
    const cand=[window.innerHeight, document.documentElement.clientHeight];
    if(window.visualViewport && window.visualViewport.height) cand.push(Math.round(window.visualViewport.height));
    const gueltig=cand.filter(v=>v && v>300);
    return gueltig.length? Math.min.apply(null, gueltig) : window.innerHeight;
  }

  // Auf flachen Panels klemmen wir das Session-Layout hart auf die echte Höhe.
  if(flach){
    const sess=card.closest('.sess');
    const appEl=document.getElementById('app');
    const h=echteHoehe();
    if(appEl){ appEl.style.height=h+'px'; }
    if(sess){ sess.style.height=h+'px'; }
  } else {
    const sess=card.closest('.sess');
    const appEl=document.getElementById('app');
    if(appEl) appEl.style.removeProperty('height');
    if(sess) sess.style.removeProperty('height');
  }

  // Querformat (Bild neben den Sätzen): Das CSS regelt die Größen selbst,
  // hier ist keine Höhenberechnung nötig.
  // ABER nur, wenn auch wirklich genug Höhe da ist. Auf sehr flachen Panels
  // (z. B. Promethean 1280×588) würde der Schnellausstieg das Sicherheitsnetz
  // gegen die Timer-Überlappung überspringen – dort rechnen wir voll durch.
  const querBreit = window.matchMedia('(min-width:900px) and (max-height:820px)').matches;
  const quer = querBreit && !flach;
  if(quer){
    if(vc) vc.style.display='';
    if(prev){ prev.style.display=''; card.style.removeProperty('--img-max'); }
    /* --sets-max mit zurücksetzen, nicht nur maxHeight: Im Querformat greift
       die Begrenzung über die Eigenschaft (die dortige Regel ist !important).
       Ohne dies misst man beim Blättern die Vorgabe der VORHERIGEN Übung. */
    sets.style.removeProperty('--sets-max');
    sets.style.maxHeight='';
    card.style.maxHeight='';
    card.classList.remove('scroll-all');
    // Auch hier gilt die Zusage: genau drei Sätze. Sonst zeigte dasselbe Gerät
    // im Querformat sechs und im Hochformat drei.
    begrenzeSatzbereich(sets);
    return;
  }
  // Flaches Querformat-Panel (z. B. Promethean): Größen regelt das CSS (Bild
  // neben den Sätzen, die Sätze scrollen). Höhe NICHT selbst berechnen –
  // aber das Sicherheitsnetz gegen die Timer-Überlappung muss laufen.
  if(querBreit && flach){
    if(vc) vc.style.display='';
    // siehe Querformat-Zweig: die Begrenzung läuft hier über die Eigenschaft
    sets.style.removeProperty('--sets-max');
    sets.style.maxHeight='';
    card.style.maxHeight='';
    card.classList.remove('scroll-all');
    if(prev) prev.style.display='';

    // Obergrenze für die Karte: bis knapp über den Timer (bzw. bis zum unteren
    // Rand des sess-Paddings, wenn kein Timer läuft). Ohne dvh gerechnet.
    const timerEl=document.getElementById('restTimer');
    const cTop=card.getBoundingClientRect().top;
    let limitBottom;
    if(timerEl && timerEl.classList.contains('show')){
      limitBottom = timerEl.getBoundingClientRect().top - 6;
    } else {
      // kein Timer: bis zum Ende des verfügbaren sess-Bereichs
      const sess=card.closest('.sess');
      const sb=sess?sess.getBoundingClientRect():{bottom:window.innerHeight};
      const csEnv=sess?parseFloat(getComputedStyle(sess).paddingBottom||0):0;
      limitBottom = sb.bottom - csEnv - 6;
    }
    const maxCard=Math.max(120, Math.floor(limitBottom - cTop));
    card.style.maxHeight = maxCard+'px';

    // Bildgröße regelt jetzt das CSS strukturell (align-self:stretch auf dem
    // Rahmen): Er ist immer exakt so hoch wie der Hauptbereich – kein Abschneiden
    // möglich. Die frühere Pixel-Berechnung entfällt; nur Altwerte aufräumen.
    if(prev){ card.style.removeProperty('--img-max'); }
    /* Auf dem Panel regelt sonst allein das CSS die Höhe des Satzbereichs –
       dort standen zuletzt dreieinhalb Sätze. Die Zusage „genau drei“ muss
       deshalb auch in diesem Zweig gesetzt werden; er kehrt vorher zurück und
       erreicht die Rechnung weiter unten nie. */
    begrenzeSatzbereich(sets);
    /* Der Satzbereich hat in der Spalte flex:1 1 0 und wird zusammengedrückt,
       wenn Kopfzeile, Knopf und Vergleichsbalken nicht mehr danebenpassen.
       Dann tritt der Vergleichsbalken zurück – dieselbe Rangfolge wie im
       Hochformat. Geprüft wird das ERGEBNIS, nicht eine Vorhersage: Ob es
       gepasst hat, sagt die tatsächliche Höhe nach dem Setzen. */
    const zielHoehe=Math.min(sets.scrollHeight, dreiSatzHoehe(sets));
    const vorher=sets.clientHeight;
    if(vc && zielHoehe>0 && sets.clientHeight < zielHoehe-1){
      vc.style.display='none';
      begrenzeSatzbereich(sets);
    }
    FIT_DIAG={zweig:'panel', zielHoehe, vorher, nachher:sets.clientHeight,
              vcWeg: (vc && vc.style.display==='none')?1:0, maxCard};
    return;
  }

  // Erst alles zurücksetzen, damit die echten Größen gemessen werden
  if(vc) vc.style.display='';
  if(prev) prev.style.display='';
  sets.style.maxHeight='';
  sets.style.removeProperty('--sets-max');
  card.style.maxHeight='';
  card.classList.remove('scroll-all');
  card.classList.remove('prev-kompakt');

  let setsVoll = sets.scrollHeight;
  const MIN_SETS = 120;                            // darunter wird es unbrauchbar
  /* Muss VOR messeGrund() stehen: Dort wird die Höhe der Sätze kurzzeitig auf 0
     gesetzt, danach ließe sich kein Satzblock mehr messen. */
  let dreiHoehe = dreiSatzHoehe(sets) || setsVoll;

  /* Der Bildrahmen soll beim Blättern stillstehen, und immer drei Sätze sollen
     vollständig zu sehen sein. Beides erledigt dieselbe Zahl – dreiHoehe. Der
     Platz für die Sätze richtet sich nicht mehr nach der Satzanzahl der Übung,
     sondern ist fest SICHTBARE_SAETZE Blöcke hoch. Dadurch ist der Bildrahmen
     über alle Übungen hinweg gleich groß, auch bei nur zwei Sätzen.
     Bewusst KEINE zweite Variable dafür: Eine solche hielt hier zwischenzeitlich
     den Wert von VOR dem Einklappen der „zuletzt“-Zeile fest, und die
     Bildrechnung arbeitete mit 270 statt mit 247 px. */

  /* Grundgerüst = die Karte MIT allem außer der Höhe der Sätze und der des
     Bildes: Kopfzeile, „Satz hinzufügen“, Vergleichsbalken, sämtliche Ränder
     und Abstände. Bewusst GEMESSEN statt aufgezählt. Das Aufzählen war die
     Fehlerquelle – es übersah den Abstand unter der Kopfzeile und den
     „Satz hinzufügen“-Knopf, der außerhalb des Scrollbereichs steht. Solange
     das Bild kleiner ausfiel als der reservierte Platz, fing die Differenz das
     auf; mit festem Bildrahmen wurden stattdessen die Sätze beschnitten. */
  const messeGrund=()=>{
    sets.style.maxHeight='0px';
    if(prev) card.style.setProperty('--img-max','0px');
    const h=card.offsetHeight;
    sets.style.maxHeight='';
    return h;
  };
  const verfuegbar = body.clientHeight;
  let grund = messeGrund();

  /* Rangfolge, wenn es eng wird – von der harmlosesten Maßnahme zur härtesten:
       1. „zuletzt“-Zeile einklappen (nichts geht verloren, spart ~16 px je Satz)
       2. Vergleichsbalken ausblenden (steht auch im Verlauf)
       3. Bild ausblenden
       4. die ganze Karte scrollen lassen
     Erst danach würde die Zusage „drei Sätze“ brechen. */
  if(verfuegbar - grund < dreiHoehe + MIN_IMG_PX && sets.querySelector('.prev-grid')){
    /* Ausprobieren und nur behalten, wenn es wirklich hilft. Auf schmalen
       Geräten bringt das Einklappen nämlich NICHTS: Die zusammengefaltete
       Angabe bricht in der Info-Zeile um und frisst die gesparte Zeile wieder
       auf. Gemessen auf 500×844 – dort stieg die Höhe sogar leicht an. */
    const vorher=dreiHoehe;
    card.classList.add('prev-kompakt');
    const nachher=dreiSatzHoehe(sets) || sets.scrollHeight;
    if(nachher < vorher-8){
      dreiHoehe=nachher; setsVoll=sets.scrollHeight; grund=messeGrund();
    } else {
      card.classList.remove('prev-kompakt');
    }
  }

  /* Reicht der Platz nicht für drei Sätze, tritt der Vergleichsbalken zurück –
     er ist die einzige Angabe hier, die es auch im Verlauf nachzulesen gibt.
     Früher griff das erst unterhalb von MIN_SETS; damit blieben auf dem Handy
     zweieinhalb Sätze stehen, obwohl 74 px Balken zu holen gewesen wären.
     Sobald wieder Platz ist, kommt er von selbst zurück. */
  if(vc && verfuegbar - grund < dreiHoehe + MIN_IMG_PX){ vc.style.display='none'; grund = messeGrund(); }

  let imgBlock=0;
  if(prev){
    /* Umgekehrte Rangfolge seit den drei sichtbaren Sätzen: Erst bekommen die
       Sätze ihre feste Höhe, dann das Bild den Rest. Vorher war es andersherum,
       und auf dem Handy blieben deshalb nur zweieinhalb Sätze übrig.
       Die Kette bei zu wenig Platz: Bild auf Mindestmaß, sonst Bild ganz weg,
       und erst danach scrollt die ganze Karte. */
    const platz = verfuegbar - grund;          // teilen sich Bild und Sätze
    let imgMax = Math.min(380, Math.floor(platz - dreiHoehe));
    /* Reicht der Rest nicht für ein erkennbares Bild, ist er auch nicht als
       Briefmarke zu gebrauchen – dann lieber ganz weg und der Platz geht an
       die Sätze. */
    if(imgMax < MIN_IMG_PX) imgMax = 0;
    imgMax = Math.max(0, imgMax);
    if(imgMax<40){ prev.style.display='none'; card.style.setProperty('--img-max','0px'); }
    else { card.style.setProperty('--img-max', imgMax+'px'); imgBlock = imgMax; }
  }

  // Was übrig bleibt, bekommen die Sätze – notfalls scrollen sie.
  const fuerSaetze = Math.floor(verfuegbar - grund - imgBlock);
  /* Die Zwischenwerte bleiben abrufbar. Diese Rechnung ist die fehleranfälligste
     Stelle der App – bei der Bildgröße und beim RIR-Feld hat schon zweimal nur
     das Nachmessen am Gerät weitergeholfen, und Raten kostete jedes Mal eine
     Fassung. Kostet nichts und erspart beim nächsten Mal eine Sonde. */
  FIT_DIAG={zweig:'hoch', verfuegbar, grund, platz:verfuegbar-grund, dreiHoehe, setsVoll, imgBlock,
            fuerSaetze, kompakt:card.classList.contains('prev-kompakt')?1:0, hatBild:prev?1:0};
  /* Ziel: so viele GANZE Sätze, wie in den übrigen Platz passen – mindestens
     SICHTBARE_SAETZE, höchstens alle. Vorher waren es strikt drei; dadurch stand
     ein Scrollbalken da, obwohl ein vierter Satz bequem Platz gehabt hätte.
     Ein angeschnittener Satz am unteren Rand entsteht so ebenfalls nicht. */
  let zielSaetze = Math.min(setsVoll, dreiHoehe);
  const masze = satzMasze(sets);
  if(masze){
    const passt=Math.floor((fuerSaetze + masze.luecke + 0.5) / (masze.bh + masze.luecke));
    const n=Math.max(SICHTBARE_SAETZE, Math.min(masze.anzahl, passt));
    zielSaetze = (n>=masze.anzahl) ? setsVoll : hoeheFuerSaetze(n, masze);
  }
  if(fuerSaetze < Math.min(zielSaetze, MIN_SETS)){
    // Zu wenig Platz für ein sinnvolles Aufteilen (sehr flaches Fenster,
    // starke Windows-Skalierung): dann scrollt die ganze Karte.
    // Timer, Punkte und Navigation bleiben trotzdem immer sichtbar.
    card.classList.add('scroll-all');
    sets.style.maxHeight='';
    /* Hier scrollt die ganze Karte – Bild und Sätze konkurrieren also gar nicht
       mehr um Platz. Dann darf das Bild auch wieder erscheinen, selbst wenn die
       Aufteilung oben zu dem Schluss kam, es sei kein Platz. Ohne diese Zeile
       verschwand es auf sehr flachen schmalen Fenstern ersatzlos – genau der
       Fehler, der in 1.19.3 schon einmal behoben wurde.
       110 px ist das Maß, das bis 1.19.7 als Mindestgröße galt. */
    if(prev && imgBlock===0){
      prev.style.display='';
      card.style.setProperty('--img-max','110px');
    }
  } else {
    card.classList.remove('scroll-all');
    sets.style.maxHeight = Math.min(zielSaetze, fuerSaetze) + 'px';
  }
  // Sicherheitsnetz: Die Karte darf niemals in den Timer ragen.
  const timerEl=document.getElementById('restTimer');
  if(timerEl && timerEl.classList.contains('show')){
    const t=timerEl.getBoundingClientRect();
    const c=card.getBoundingClientRect();
    if(c.bottom > t.top-6){
      card.classList.add('scroll-all');
      card.style.maxHeight = Math.max(80, Math.floor(t.top - c.top - 6)) + 'px';
      return;
    }
  }
  card.style.maxHeight='';
}
window.addEventListener('resize', ()=>{ if(SESSION && current==='today') fitSessImage(); });

function initSessSwipe(){
  const el=document.getElementById('sessBody'); if(!el) return;
  let x0=null,y0=null,moved=false;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; moved=false;
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(x0==null) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10) moved=true;
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0==null||!moved){ x0=null; return; }
    const dx=e.changedTouches[0].clientX-x0;
    x0=null;
    // Eingabefelder nicht stören
    if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if(dx<-45) goExercise(SESSION.page+1);
    else if(dx>45) goExercise(SESSION.page-1);
  },{passive:true});
}
function exerciseCard(ex,ei){

  // Primärmuskeln stehen voran. Die Körperregion wird herausgefiltert, weil sie
  // bereits in der Zeile darüber steht – dieselbe Logik wie in der Übungsliste.
  const prim=(meta&&Array.isArray(meta.pm))?meta.pm.filter(m=>m!==ex.muscle):[];
  const hidden=!!SESSION.hideImg;
  return `<div class="card ex-card">
    <div class="row between" style="margin-bottom:4px;flex-shrink:0">
      <div style="min-width:0">
        <div class="display" style="font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ex.name)}</div>
        <div class="faint" style="font-size:11.5px">${esc(ex.muscle)}${bench?' · '+I.bench+' '+esc(bench):''}${twoDb?' · 2 Hanteln':''}</div>
        ${(prim.length||sec.length)?`<div class="ex-sec">${prim.map(m=>`<span class="ex-sec-tag prim">${esc(m)}</span>`).join('')}${sec.map(m=>`<span class="ex-sec-tag">${esc(m)}</span>`).join('')}</div>`:''}
      </div>
      <div class="row" style="gap:5px;flex-shrink:0">

        ${meta?`<button class="chip" onclick='showExercise("${escAttr(ex.name)}")' style="padding:6px 9px">${I.info}</button>`:''}
      </div>
    </div>
    <!-- Bild + Sätze: untereinander (hoch) oder nebeneinander (breit & flach) -->
    <div class="ex-main">
      ${thumb&&!hidden?`<div class="ex-preview" onclick='showExercise("${escAttr(ex.name)}")'>
        <img loading="lazy" src="${thumb}" alt="" onerror="this.parentNode.classList.add('bad')">
      </div>`:''}
      <div class="ex-col">
        <!-- Die Kopfzeile steht bewusst AUSSERHALB von .ex-sets. Innerhalb
             scrollte sie nicht nur mit, sondern verschwand sofort: Das Einrasten
             zieht den ersten Satzblock an den oberen Rand und schiebt alles
             darüber hinaus. Sichtbar wurde sie nur beim Hochziehen, und beim
             Loslassen rastete es wieder auf die drei Sätze. -->
        <div class="set-grid set-head">
          <span>#</span><span>KG</span><span>WDH</span><span style="text-align:center">RIR</span><span></span></div>
        <div class="ex-sets">
          ${ex.sets.map((st,si)=>setRow(ex,ei,st,si)).join('')}
        </div>
        <!-- Steht bewusst AUSSERHALB von .ex-sets: so bleibt der Button beim
             Scrollen der Sätze immer sichtbar. -->
        <button class="add-set" onclick="addSet(${ei})">${I.plus}<span>Satz hinzufügen</span></button>
        ${volCompare(ex)}
      </div>
    </div>
  </div>`;
